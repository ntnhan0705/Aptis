<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptis — Từ vựng & Ngữ pháp</title>
<style>
  :root{
    --ink:#1b2a2f; --paper:#fbf7ef; --card:#ffffff; --line:#d8cdb8;
    --accent:#c0392b; --accent-soft:#f6e3df;
    --green:#2e7d52; --green-soft:#e3f0e8; --muted:#7a7264;
    --gold:#f0b429; --gold-soft:#fdf0c8; --blue:#2e6fb0; --blue-soft:#e2edf7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  .wrap{max-width:700px;margin:0 auto;padding:26px 18px 80px;}
  header.top{border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:14px;}
  .eyebrow{font-family:"SF Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;}
  h1{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.01em;}
  .sub{margin:0;color:var(--muted);font-size:.88rem;}
  .savebar{font-family:"SF Mono",monospace;font-size:.7rem;text-align:center;margin:12px 0;padding:7px 11px;border-radius:9px;background:var(--green-soft);color:#1f7a52;border:1px solid #cfe6d6;}
  .savebar.local{background:var(--gold-soft);color:#8a6d00;border-color:var(--gold);}
  .maintabs{display:flex;gap:8px;margin:0 0 16px;}
  .maintab{flex:1;text-align:center;padding:11px 8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-family:"SF Mono",monospace;font-size:.78rem;color:var(--muted);}
  .maintab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .hide{display:none;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px;}
  /* dashboard */
  .dash-h{font-size:1.05rem;font-weight:800;margin-bottom:4px;}
  .dash-s{font-size:.84rem;color:var(--muted);margin-bottom:14px;}
  .lvbars{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .lvrow{display:flex;align-items:center;gap:10px;font-size:.8rem;}
  .lvrow .nm{width:118px;flex:none;font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);}
  .lvrow .bar{flex:1;height:14px;background:#efe8da;border-radius:99px;overflow:hidden;}
  .lvrow .bar>span{display:block;height:100%;border-radius:99px;}
  .lvrow .n{width:34px;text-align:right;font-weight:700;font-family:"SF Mono",monospace;font-size:.74rem;}
  .b5{background:var(--green);} .b4{background:#5aa77c;} .b3{background:#9dbf6a;}
  .b2{background:var(--gold);} .b1{background:#e2953f;} .b0{background:var(--accent);} .bnew{background:#c3bbaa;}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;}
  .btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 18px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn:hover{opacity:.9;} .btn:disabled{opacity:.45;cursor:default;}
  .lv{font-size:.6rem;font-weight:800;border-radius:99px;padding:2px 7px;white-space:nowrap;}
  .lvnew{background:#eee7d8;color:var(--muted);} .lv0{background:var(--accent-soft);color:var(--accent);}
  .lv1{background:#fbe6cf;color:#a15c00;} .lv2{background:var(--gold-soft);color:#8a6d00;}
  .lv3{background:#eaf2dc;color:#5a7d1e;} .lv4{background:var(--green-soft);color:var(--green);} .lv5{background:var(--green);color:#fff;}
  /* trainer */
  .qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .qz-mode{font-family:"SF Mono",monospace;font-size:.68rem;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:3px 10px;}
  .qz-prog{font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .qz-q{font-family:"SF Mono",monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .qz-prompt{font-size:1.4rem;font-weight:800;text-align:center;margin:10px 0 4px;line-height:1.35;}
  .qz-sent{font-size:1.05rem;line-height:1.85;margin:8px 0;}
  .qz-blank{display:inline-block;min-width:92px;border-bottom:2.5px solid var(--accent);color:var(--accent);text-align:center;font-weight:800;}
  .qz-vi{text-align:center;color:var(--muted);font-size:.85rem;margin-top:6px;}
  .qz-play{display:inline-flex;gap:6px;border:none;background:var(--blue);color:#fff;border-radius:10px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:700;font-size:.88rem;margin:4px 0 8px;}
  .qz-opts{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .qz-optrow{display:flex;gap:8px;align-items:stretch;}
  .qz-optrow .qz-opt{flex:1;}
  .qz-optplay{flex:none;border:1.5px solid var(--line);background:var(--blue-soft);color:var(--blue);
    border-radius:10px;width:46px;font-size:1.05rem;cursor:pointer;}
  .qz-optplay:hover{background:var(--blue);color:#fff;}
  .qz-opt{text-align:left;padding:12px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font:inherit;font-size:1rem;color:var(--ink);}
  .qz-opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft);}
  .qz-opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:800;}
  .qz-opt.wrong{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .qz-opt:disabled{cursor:default;}
  .qz-inrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .qz-in{flex:1;min-width:170px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:1.05rem;}
  .qz-in.ok{border-color:var(--green);background:var(--green-soft);} .qz-in.no{border-color:var(--accent);background:var(--accent-soft);}
  .qz-fb{margin-top:14px;text-align:center;font-size:1rem;font-weight:700;}
  .qz-fb.ok{color:var(--green);} .qz-fb.no{color:var(--accent);}
  .qz-fb .ans{font-weight:900;text-decoration:underline;}
  .qz-meta{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .qz-next{display:block;margin:16px auto 0;border:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 30px;cursor:pointer;font:inherit;font-weight:800;font-size:.95rem;}
  .qz-hintwrap{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;}
  /* word list */
  .wl{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
  .wrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);flex-wrap:wrap;}
  .wrow .wen{font-weight:700;font-size:.92rem;min-width:140px;}
  .wrow .wipa{font-family:ui-monospace,monospace;font-size:.76rem;color:var(--muted);flex:1;min-width:110px;}
  .wrow .wvi{font-size:.85rem;color:#4a4438;flex:1;min-width:100px;}
  .wrow .wstat{font-family:"SF Mono",monospace;font-size:.68rem;color:var(--muted);}
  .wplay{border:none;background:var(--accent-soft);color:var(--accent);border-radius:8px;width:32px;height:32px;cursor:pointer;}
  .filt{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;}
  .fchip{padding:6px 13px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);}
  .fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  /* grammar */
  .gr-block{margin-bottom:20px;}
  .gr-h{font-size:1.02rem;font-weight:800;margin-bottom:6px;}
  .gr-rule{font-size:.86rem;line-height:1.65;color:#4a4438;background:var(--blue-soft);border:1px solid #cfe0ef;border-radius:9px;padding:10px 13px;margin-bottom:8px;}
  .gr-rule b{color:var(--ink);}
  .gr-eg{font-size:.94rem;line-height:1.7;padding:7px 12px;border-left:2px solid var(--line);margin:5px 0;}
  .gr-eg b{background:var(--gold-soft);border-radius:3px;padding:0 3px;color:#5a4600;}
  .gr-src{display:inline-block;font-family:"SF Mono",monospace;font-size:.58rem;font-weight:700;border-radius:99px;padding:1px 7px;margin-right:7px;vertical-align:middle;}
  .src-Speaking{background:#e9e2f7;color:#5b3fa8;} .src-Writing{background:var(--accent-soft);color:var(--accent);}
  .src-Reading{background:var(--gold-soft);color:#8a6d00;} .src-Listening{background:var(--blue-soft);color:var(--blue);}
  .gr-count{font-family:"SF Mono",monospace;font-size:.62rem;color:var(--muted);}
  .gr-vi{margin-top:10px;font-size:.94rem;line-height:1.6;color:#4a4438;background:var(--paper);
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;text-align:left;}
  .gr-gp{margin-top:8px;font-size:.86rem;line-height:1.6;color:#1d4f7a;background:var(--blue-soft);
    border:1px solid #cfe0ef;border-radius:9px;padding:9px 12px;text-align:left;font-weight:600;}
  .gr-why{margin-top:8px;font-size:.88rem;line-height:1.75;color:#4a4438;background:var(--gold-soft);
    border:1px solid var(--gold);border-radius:9px;padding:10px 13px;text-align:left;}
  .gr-why b{color:#5a4600;}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">

    <p class="eyebrow">Aptis General</p>
    <h1>Từ vựng &amp; Ngữ pháp</h1>

  <div id="vocabTab">

</div>

<script>

op of that, summer is great for trips with my colleagues."],"gap":true},{"en":"motivated","ipa":"/ˈməʊtɪveɪtɪd/","vi":"có động lực","eg":"On top of that, training with others keeps you motivated.","egs":["On top of that, training with others keeps you motivated.","On top of that, seeing other people study makes you feel more motivated.","I also like trying different activities, since they keep me motivated and make exercise more fun."],"gap":true},{"en":"popular","ipa":"/ˈpɒpjələ/","vi":"phổ biến","eg":"On top of that, it is very popular with foreign visitors.","egs":["On top of that, it is very popular with foreign visitors.","Well, football is by far the most popular sport in my country.","I think we should run fun online events and invite popular speakers."],"gap":true},{"en":"bring people together","ipa":"/brɪŋ ˈpiːpl təˈɡeðə/","vi":"gắn kết mọi người","eg":"It reminded me that sports can bring people together.","egs":["It reminded me that sports can bring people together.","First of all, it brings people together around one table.","First of all, it brings people together after a busy week apart."],"gap":true},{"en":"cheer for","ipa":"/tʃɪə fɔː/","vi":"cổ vũ cho","eg":"On top of that, I sometimes watch it with my colleagues, and we all cheer for the teams we like.","egs":["On top of that, I sometimes watch it with my colleagues, and we all cheer for the teams we like."],"gap":true},{"en":"outdoors","ipa":"/ˌaʊtˈdɔːz/","vi":"ngoài trời","eg":"In both pictures, people are working outdoors.","egs":["In both pictures, people are working outdoors.","In this picture, I can see two people outdoors.","In this picture, I can see three people outdoors."],"gap":true},{"en":"hiking","ipa":"/ˈhaɪkɪŋ/","vi":"đi bộ đường dài","eg":"They seem to be hiking together in a forest.","egs":["They seem to be hiking together in a forest."],"gap":true},{"en":"casual, comfortable clothes","ipa":"/ˈkæʒuəl ˈkʌmftəbl kləʊðz/","vi":"quần áo giản dị, thoải mái","eg":"They're wearing casual, f that, shops are often crowded at the weekend, which I don't like."],"gap":true},{"en":"noisy","ipa":"/ˈnɔɪzi/","vi":"ồn ào","eg":"The main reason is that I work in a noisy factory all day.","egs":["The main reason is that I work in a noisy factory all day.","The first one looks hard and noisy, while the second one looks calm and peaceful.","Also, the pavement is noisy and busy, whereas a restaurant is calm and comfortable."],"gap":true},{"en":"peaceful","ipa":"/ˈpiːsfl/","vi":"yên bình","eg":"To me, it feels like a peaceful day on holiday.","egs":["To me, it feels like a peaceful day on holiday.","So, one is peaceful, and the other is full of energy.","The main reason I love it is that it is quiet and peaceful."],"gap":true},{"en":"the countryside","ipa":"/ðə ˈkʌntrisaɪd/","vi":"vùng quê","eg":"That's why I like living in the countryside outside the city.","egs":["That's why I like living in the countryside outside the city.","Well, I live in the countryside in Dong Nai, about twenty kilometres from the city.","I usually take photographs when I travel at the weekend, especially in the countryside."],"gap":true},{"en":"a chance to score","ipa":"/ə tʃɑːns tə skɔː/","vi":"cơ hội ghi bàn","eg":"During the game, we cheered loudly every time our team had a chance to score.","egs":["During the game, we cheered loudly every time our team had a chance to score."],"gap":true},{"en":"nervous","ipa":"/ˈnɜːvəs/","vi":"hồi hộp, lo lắng","eg":"I felt really nervous, since I had to redo everything.","egs":["I felt really nervous, since I had to redo everything.","As for how I felt, I felt worried and a little nervous.","I was really nervous, but my friends encouraged me to try it."],"gap":true},{"en":"proud","ipa":"/praʊd/","vi":"tự hào","eg":"As for how I felt, I felt excited and very proud.","egs":["As for how I felt, I felt excited and very proud.","But when I saw my result, I felt so proud and relieved.","It was quite stressful, but I felt proud when we finished."],"gap":true /* ===== Đồng bộ đám mây — mã đồng bộ = ID blob (jsonblob). Dùng chung mọi app. ===== */
window.ACLOUD=window.ACLOUD||(function(){
  var API='/.netlify/functions/progress',CK='aptis_sync_code',t=null;
  function code(){try{return localStorage.getItem(CK)||'';}catch(e){return'';}}
  function setCode(c){try{localStorage.setItem(CK,c||'');}catch(e){}}
  function clear(){try{localStorage.removeItem(CK);}catch(e){}}
  function on(){return !!code();}
  function isMap(x){return x&&typeof x==='object'&&!Array.isArray(x);}
  function score(r){if(!isMap(r))return 0;return (r.attempts||0)*1000+(r.seen||0)*10+(r.correct||0)+((r.history&&r.history.length)||0);}
  function mm(a,b){a=isMap(a)?a:{};b=isMap(b)?b:{};var o={},ks={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ks[k]=1;});
    Object.keys(ks).forEach(function(k){var av=a[k],bv=b[k];
      if(av===undefined){o[k]=bv;return;}if(bv===undefined){o[k]=av;return;}
      if(isMap(av)&&isMap(bv)&&!('seen'in av)&&!('attempts'in av)&&!('correct'in av)){o[k]=mm(av,bv);}
      else{o[k]=score(bv)>=score(av)?bv:av;}});return o;}
  function merge(a,b){a=isMap(a)?a:{};b=isMap(b)?b:{};var o={},ks={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ks[k]=1;});
    Object.keys(ks).forEach(function(k){if(k==='updated'){o.updated=((a.updated||'')>(b.updated||''))?a.updated:b.updated;return;}
      var av=a[k],bv=b[k];if(isMap(av)||isMap(bv)){o[k]=mm(av,bv);}else{o[k]=(bv!==undefined?bv:av);}});return o;}
  function u(){return API+'?code='+encodeURIComponent(code());}
  function pull(){if(!code())return Promise.resolve(null);
    return fetch(u(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
  function pushNow(data){if(!code())return Promise.resolve(false);
    return fetch(u(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.ok;}).catch(function(){return false;});}
  function push(data){if(!code())return;clearTimeout(t);t=setTimeout(function(){pushNow(data);},1200);}
  function syncOnLoad(local){if(!code())return Promise.resolve(local);
    return pull().then(function(remote){return remote===null?local:merge(local||{},remote||{});});}
  return {code:code,setCode:setCode,clear:clear,on:on,merge:merge,pull:pull,push:push,pushNow:pushNow,syncOnLoad:syncOnLoad,API:API};
})();
const SERVED = /^https?:$/.test(location.protocol);
let PROG = {};
function lsGet(){ try{ return JSON.parse(localStorage.getItem('aptis_progress')||'{}'); }catch(e){ return {}; } }
async function progLoad(){
  let d={};
  if(SERVED){ try{ const r=await fetch('/api/progress',{cache:'no-store'}); d=await r.json(); }catch(e){ d=lsGet(); } }
  else d=lsGet();
  d=d||{};
  if(ACLOUD.on()){try{const m=await ACLOUD.syncOnLoad(d);if(m){d=m;
    try{localStorage.setItem('aptis_progress',JSON.stringify(d));}catch(e){}
    if(SERVED){try{await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch(e){}}
    ACLOUD.push(d);}}catch(e){}}
  PROG=d||{}; if(!PROG.vocab)PROG.vocab={};
}
let saveT=null;
function progSave(){
  PROG.updated=new Date().toISOString();
  try{ localStorage.setItem('aptis_progress',JSON.stringify(PROG)); }catch(e){}
  if(SERVED){ clearTimeout(saveT); saveT=setTimeout(()=>{
    fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(PROG)}).catch(()=>{});
  },250); }
  ACLOUD.push(PROG);
}
function setSaveBar(){
  const el=document.getElementById('savebar');
  if(SERVED){ el.className='savebar'; el.innerHTML='✅ Đang chạy qua server — tiến độ từ vựng <b>lưu tự động</b>'; }
  else { el.className='savebar local'; el.innerHTML='⚠️ Mở trực tiếp (file://) — lưu tạm trong trình duyệt. Mở bằng <b>start.bat</b> để lưu tự động.'; }
}

/* ============ mastery ============ */
const KEY = en => en.toLowerCase();
function vRec(en){ return PROG.vocab[KEY(en)]||null; }
function vLevel(en){
  const r=vRec(en); if(!r||!r.seen) return -1;      // -1 = chưa học
  const a=r.correct/r.seen;
  return a>=1?5 : a>=.9?4 : a>=.8?3 : a>=.7?2 : a>=.6?1 : 0;
}
const LVNAME=['<60% — chưa nhớ','60% — mới nhớ','70% — lõm bõm','80% — khá','90% — tốt','100% — thuần thục'];
function levelBadge(en){
  const l=vLevel(en);
  if(l<0) return '<span class="lv lvnew">chưa học</span>';
  return '<span class="lv lv'+l+'" title="'+LVNAME[l]+'">Lv'+l+'</span>';
}
// Máy trạng thái: M1 --3 đúng liên tiếp--> M2 --3 đúng liên tiếp--> M3
//                 M2 <--quá 3 sai liên tiếp-- M3 ; M1 <--quá 3 sai liên tiếp-- M2
function vRecord(en, ok){
  const k=KEY(en);
  const r=PROG.vocab[k]||{en:en,seen:0,correct:0,mode:1,sc:0,sw:0};
  r.seen++;
  if(ok){ r.correct++; r.sc++; r.sw=0; } else { r.sw++; r.sc=0; }
  const before=r.mode;
  if(r.mode===1){ if(r.sc>=3){ r.mode=2; r.sc=0; r.sw=0; } }
  else if(r.mode===2){ if(r.sc>=3){ r.mode=3; r.sc=0; r.sw=0; } else if(r.sw>3){ r.mode=1; r.sc=0; r.sw=0; } }
  else if(r.mode===3){ if(r.sw>3){ r.mode=2; r.sc=0; r.sw=0; } }
  r.moved = r.mode!==before ? (r.mode>before?'up':'down') : '';
  PROG.vocab[k]=r; progSave(); return r;
}

/* ============ tiện ích ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const normW = w => String(w==null?'':w).toLowerCase().replace(/[^a-z0-9']/g,'');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
const synth = window.speechSynthesis;
let voice=null;
function pickVoice(){ if(!synth)return; const vs=synth.getVoices().filter(v=>/en[-_]/i.test(v.lang));
  vs.sort((a,b)=>(/en-GB/i.test(a.lang)?0:1)-(/en-GB/i.test(b.lang)?0:1)); voice=vs[0]||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function say(t){ if(!synth)return; synth.cancel(); const u=new SpeechSynthesisUtterance(t);
  if(voice)u.voice=voice; u.lang=voice?voice.lang:'en-GB'; u.rate=.88; synth.speak(u); }
function coreOf(en){ return en.replace(/^(a|an|the)\s+/i,'').trim(); }
// tìm cụm (cho phép biến thể s/es/ing/ed) trong câu -> {idx,len,matched}
function findInEg(eg, en){
  const c=coreOf(en); const parts=c.split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const last=parts.pop();
  const pat=parts.map(p=>p+'\\s+').join('')+last+'(s|es|ing|ed)?';
  try{ const m=eg.match(new RegExp('\\b'+pat+'\\b','i')); if(m) return {idx:m.index,len:m[0].length,matched:m[0]}; }catch(e){}
  return null;
}

/* ============ dashboard ============ */
function renderDash(){
  const counts=[0,0,0,0,0,0]; let neu=0;
  VOCAB.forEach(v=>{ const l=vLevel(v.en); if(l<0)neu++; else counts[l]++; });
  const learned=VOCAB.length-neu;
  let bars='';
  for(let l=5;l>=0;l--){
    const pct=VOCAB.length?Math.round(counts[l]/VOCAB.length*100):0;
    bars+='<div class="lvrow"><span class="nm">Lv'+l+' · '+LVNAME[l].split(' — ')[0]+'</span>'
      +'<span class="bar"><span class="b'+l+'" style="width:'+pct+'%"></span></span><span class="n">'+counts[l]+'</span></div>';
  }
  const pn=VOCAB.length?Math.round(neu/VOCAB.length*100):0;
  bars+='<div class="lvrow"><span class="nm">chưa học</span><span class="bar"><span class="bnew" style="width:'+pn+'%"></span></span><span class="n">'+neu+'</span></div>';
  $('dash').innerHTML='<div class="dash-h">🎯 Mức thuần thục — '+VOCAB.length+' từ</div>'
    +'<div class="dash-s">Đã học <b>'+learned+'</b> · thuần thục (Lv4–5) <b>'+(counts[4]+counts[5])+'</b> · chưa học <b>'+neu+'</b></div>'
    +'<div class="lvbars">'+bars+'</div>'
    +'<div class="btnrow"><button class="btn primary" id="btnStart">🎲 Học ngẫu nhiên toàn bộ</button>'
    +'<button class="btn" id="btnWeak">⚠️ Ôn từ yếu (Lv0–2 + chưa học)</button></div>';
  $('btnStart').onclick=()=>startQuiz(VOCAB.slice());
  $('btnWeak').onclick=()=>{
    const w=VOCAB.filter(v=>{ const l=vLevel(v.en); return l<0||l<=2; });
    startQuiz(w.length?w:VOCAB.slice());
  };
}

/* ============ trainer ============ */
let qz={pool:[],order:[],oi:0,cur:null,mode:1,answered:false,done:0,right:0};
function startQuiz(pool){
  qz.pool=pool; if(!qz.pool.length)return;
  qz.order=shuffle(qz.pool.map((_,i)=>i)); qz.oi=0; qz.done=0; qz.right=0;
  $('trainer').classList.remove('hide'); $('listCard').classList.add('hide');
  nextQ();
  try{ $('trainer').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
}
function endQuiz(){ if(synth)synth.cancel(); $('trainer').classList.add('hide'); $('listCard').classList.remove('hide'); renderDash(); renderList(); }
function nextQ(){
  if(qz.oi>=qz.order.length){ qz.order=shuffle(qz.pool.map((_,i)=>i)); qz.oi=0; }
  qz.cur=qz.pool[qz.order[qz.oi]]; qz.oi++;
  const r=vRec(qz.cur.en); let m=r?r.mode:1;
  if(!qz.cur.gap) m=1;                 // từ không tách được chỗ trống -> chỉ chế độ 1
  qz.mode=m; qz.answered=false; renderQ();
}
function distractors(en,n){
  const pool=(VOCAB.length>=n+1?VOCAB:qz.pool).map(v=>v.en).filter(e=>e.toLowerCase()!==en.toLowerCase());
  return shuffle(pool).slice(0,n);
}
function renderQ(){
  const v=qz.cur, m=qz.mode;
  const mname=m===1?'Chế độ 1 · Nghĩa → chọn từ':m===2?'Chế độ 2 · Điền vào câu':'Chế độ 3 · Nghe & gõ';
  let head='<div class="qz-top"><span class="qz-mode">'+mname+'</span>'
    +'<span class="qz-prog">'+levelBadge(v.en)+' · đúng '+qz.right+'/'+qz.done
    +' <button class="fchip" id="qzExit" style="margin-left:6px">Thoát</button></span></div><div id="qzBody"></div>';
  $('trainer').innerHTML=head;
  $('qzExit').onclick=endQuiz;
  const b=$('qzBody');
  if(m===1)mode1(b,v); else if(m===2)mode2(b,v); else mode3(b,v);
}
function optionBox(b, correctEn, v){
  const opts=shuffle([correctEn].concat(distractors(correctEn,4)));
  const box=document.createElement('div'); box.className='qz-opts';
  const rows=[];
  opts.forEach(en=>{
    const row=document.createElement('div'); row.className='qz-optrow';
    const btn=document.createElement('button'); btn.className='qz-opt'; btn.textContent=en;
    const play=document.createElement('button'); play.className='qz-optplay'; play.textContent='🔊';
    play.title='Nghe lại'; play.style.display='none';
    play.onclick=(e)=>{ e.stopPropagation(); say(en); };
    btn.onclick=()=>{
      if(qz.answered)return; qz.answered=true;
      const ok=en.toLowerCase()===correctEn.toLowerCase();
      rows.forEach(r=>{ r.btn.disabled=true; r.play.style.display='';    // hiện nút nghe lại cho mọi đáp án
        if(r.btn.textContent.toLowerCase()===correctEn.toLowerCase())r.btn.classList.add('correct'); });
      if(!ok)btn.classList.add('wrong');
      finish(ok,v);
    };
    row.appendChild(btn); row.appendChild(play); box.appendChild(row);
    rows.push({btn:btn, play:play});
  });
  b.appendChild(box);
  const fb=document.createElement('div'); fb.id='qzFb'; b.appendChild(fb);
}
function mode1(b,v){
  b.innerHTML='<div class="qz-q">Nghĩa tiếng Việt — chọn từ tiếng Anh đúng</div>'
    +'<div class="qz-prompt">'+esc(v.vi)+'</div>';
  optionBox(b, v.en, v);
}
function mode2(b,v){
  const f=findInEg(v.eg,v.en);
  const sent=f?esc(v.eg.slice(0,f.idx))+'<span class="qz-blank">_____</span>'+esc(v.eg.slice(f.idx+f.len)):esc(v.eg);
  b.innerHTML='<div class="qz-q">Điền vào chỗ trống — chọn từ đúng</div>'
    +'<div class="qz-sent">'+sent+'</div><div class="qz-vi">'+esc(v.vi)+'</div>';
  optionBox(b, v.en, v);
}
function mode3(b,v){
  const f=findInEg(v.eg,v.en);
  let hint='';
  if(f){
    const before=v.eg.slice(0,f.idx).trim().split(/\s+/).slice(-4).join(' ');
    const after=v.eg.slice(f.idx+f.len).trim().split(/\s+/).slice(0,4).join(' ');
    hint='<div class="qz-hintwrap"><div class="qz-sent" style="margin:0">'
      +(before?'… '+esc(before)+' ':'')+'<span class="qz-blank">_____</span>'+(after?' '+esc(after)+' …':'')+'</div></div>';
  }
  b.innerHTML='<div class="qz-q">Nghe câu — gõ đúng chính tả từ còn thiếu</div>'
    +'<div style="text-align:center"><button class="qz-play" id="qzPlay">🔊 Nghe lại câu</button></div>'
    +hint+'<div class="qz-vi">'+esc(v.vi)+'</div>'
    +'<div class="qz-inrow"><input class="qz-in" id="qzIn" placeholder="Gõ từ còn thiếu…" autocomplete="off" spellcheck="false">'
    +'<button class="btn" id="qzChk">Kiểm tra</button></div><div id="qzFb"></div>';
  $('qzPlay').onclick=()=>say(v.eg);
  say(v.eg);
  const inp=$('qzIn');
  const submit=()=>{
    if(qz.answered)return; const t=inp.value.trim(); if(!t)return;
    const cand=[v.en, coreOf(v.en)]; if(f)cand.push(f.matched);
    const ok=cand.some(c=>normW(t)===normW(c) || t.toLowerCase().trim()===c.toLowerCase().trim());
    qz.answered=true; inp.className='qz-in '+(ok?'ok':'no'); inp.disabled=true;
    finish(ok,v);
  };
  $('qzChk').onclick=submit;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')submit(); });
  setTimeout(()=>{ try{inp.focus();}catch(e){} },50);
}
function finish(ok,v){
  qz.done++; if(ok)qz.right++;
  say(v.en);                    // tự phát âm đáp án đúng khi hiện đáp án
  const r=vRecord(v.en, ok);
  const moved = r.moved==='up' ? ' <b style="color:var(--green)">▲ lên chế độ '+r.mode+'</b>'
              : r.moved==='down' ? ' <b style="color:var(--accent)">▼ về chế độ '+r.mode+'</b>' : '';
  const fb=$('qzFb');
  fb.innerHTML='<div class="qz-fb '+(ok?'ok':'no')+'">'
      +(ok?'✓ Chính xác!':'✗ Chưa đúng — đáp án: <span class="ans">'+esc(v.en)+'</span>')+'</div>'
    +'<div class="qz-meta"><button class="qz-optplay" id="qzSay" title="Nghe lại đáp án">🔊</button> <b style="color:var(--ink)">'+esc(v.en)+'</b> · '+esc(v.ipa||'')+' · '+esc(v.vi)+' · '+levelBadge(v.en)
      +' · đúng '+r.correct+'/'+r.seen+' · chế độ '+r.mode+moved+'</div>'
    +'<div class="qz-sent" style="font-size:.92rem;text-align:center;color:var(--muted)">'+esc(v.eg)+'</div>'
    +'<button class="qz-next" id="qzNext">Tiếp →</button>';
  const _say=$('qzSay'); if(_say)_say.onclick=()=>say(v.en);
  $('qzNext').onclick=nextQ;
  setTimeout(()=>{ try{$('qzNext').focus();}catch(e){} },30);
}

/* ============ danh sách từ ============ */
let filt='all';
function renderList(){
  const f=$('filt'); f.innerHTML='';
  [['all','Tất cả'],['new','Chưa học'],['weak','Yếu (Lv0–2)'],['good','Tốt (Lv3–5)']].forEach(function(p){
    const c=document.createElement('button'); c.className='fchip'+(filt===p[0]?' on':''); c.textContent=p[1];
    c.onclick=()=>{ filt=p[0]; renderList(); }; f.appendChild(c);
  });
  const wl=$('wl'); wl.innerHTML='';
  VOCAB.filter(v=>{ const l=vLevel(v.en);
    return filt==='all'||(filt==='new'&&l<0)||(filt==='weak'&&l>=0&&l<=2)||(filt==='good'&&l>=3);
  }).forEach(v=>{
    const r=vRec(v.en);
    const row=document.createElement('div'); row.className='wrow';
    row.innerHTML='<span class="wen">'+esc(v.en)+'</span><span class="wipa">'+esc(v.ipa||'')+'</span>'
      +'<span class="wvi">'+esc(v.vi)+'</span>'+levelBadge(v.en)
      +'<span class="wstat">'+(r?('đúng '+r.correct+'/'+r.seen+' · M'+r.mode):'—')+'</span>';
    const p=document.createElement('button'); p.className='wplay'; p.textContent='🔊'; p.onclick=()=>say(v.en);
    row.appendChild(p); wl.appendChild(row);
  });
  if(!wl.children.length) wl.innerHTML='<div class="qz-vi">Không có từ nào trong nhóm này.</div>';
}

ng dùng cho \"lý do\".","fixed":true},{"s":"That is the hotel ___ we stayed last summer.","a":"where","o":["where","which","who","that"],"src":"Tự soạn","vi":"Đó là khách sạn nơi chúng tôi đã ở vào mùa hè năm ngoái.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>where</b> = \"nơi mà\", thay cho địa điểm. Dùng <b>which/that</b> thì phải có giới từ (which we stayed <i>at</i>).","fixed":true},{"s":"Everything ___ he said was completely true.","a":"that","o":["that","who","what","whose"],"src":"Tự soạn","vi":"Mọi điều anh ấy nói đều hoàn toàn đúng.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"Sau <b>everything / all / something</b> dùng <b>that</b>. <b>what</b> không dùng làm đại từ quan hệ sau danh từ.","fixed":true},{"s":"The students ___ finished early may leave the room.","a":"who","o":["who","which","whose","where"],"src":"Tự soạn","vi":"Những học sinh làm xong sớm có thể rời phòng.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>who</b> thay cho <b>người</b> (the students) và làm chủ ngữ cho động từ finished.","fixed":true}]},{"h":"2. Câu nối lý do — because / since / as","rule":"Luôn thêm <b>lý do</b> sau ý chính, giám khảo chấm rất cao. <b>since</b> nghe học thuật hơn <b>because</b>.","egs":[{"s":"Woman: Oh, that's <b>because you</b> are boring!","src":"Listening"},{"s":"Saturday is out <b>because I</b>'ve got a family event.","src":"Listening"},{"s":"I love it <b>because I</b> can see many beautiful locations.","src":"Reading"},{"s":"I felt really nervous<b>, since I</b> had to redo everything.","src":"Writing"}],"quiz":[{"s":"Oh, that's ___ you are boring!","a":"because","o":["because","although","however","therefore"],"src":"Listening","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"Chọn <b>because</b> vì phần sau nêu <b>lý do</b> cho ý phía trước (because = since, since nghe học t  một câu như vậy.","vi":"Lúc đầu, tôi hơi mệt, vì chúng tôi khởi hành rất sớm."},{"s":"I fell in love with this sport ever ___ my first attempt.","a":"since","o":["since","although","however","therefore"],"src":"Reading","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"Chọn <b>since</b> vì phần sau nêu <b>lý do</b> cho ý phía trước (because = since, since nghe học thuật hơn). <b>although</b> nghĩa \"mặc dù\" → ngược nghĩa; <b>however</b> và <b>therefore</b> là trạng từ nối, không nối trực tiếp hai mệnh đề trong cùng một câu như vậy.","vi":"Tôi đã yêu môn thể thao này ngay từ lần thử đầu tiên."},{"s":"___ of the heavy rain, we decided to stay at home.","a":"Because","o":["Because","Since","Although","Therefore"],"src":"Tự soạn","vi":"Vì mưa lớn, chúng tôi quyết định ở nhà.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>Because of</b> + <b>danh từ</b> (the heavy rain). Lưu ý: <b>because</b> đứng một mình thì đi với <b>mệnh đề</b>, còn <b>because of</b> đi với danh từ.","fixed":true},{"s":"We cancelled the trip ___ to the bad weather.","a":"due","o":["due","because","since","although"],"src":"Tự soạn","vi":"Chúng tôi huỷ chuyến đi do thời tiết xấu.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>due to</b> + danh từ = \"do, bởi vì\". <b>because/since</b> phải đi với cả mệnh đề, không đi với \"to\".","fixed":true},{"s":"___ it was getting late, we took a taxi home.","a":"As","o":["As","Despite","However","Therefore"],"src":"Tự soạn","vi":"Vì trời đã muộn, chúng tôi bắt taxi về nhà.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>As</b> ở đầu câu cũng có nghĩa \"vì\" (giống because/since). <b>Despite</b> nghĩa \"mặc dù\"; <b>However/Therefore</b> không nối trực tiếp hai mệnh đề như vậy.","fixed":true},{"s":"He was late ___ the traffic was terrible.","a":"because","o":["because","despite","however","therefore"],"src":"Tự soạn","vi":"Anh ấy đến muộn vì giao thông quá tệ.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>because</b> + mệnh đề nêu lý do. <b>despite</b> ngược nghĩa; <b>however/therefore</b> sai ngữ pháp ở vị trí này.","fixed":true},{"s":"I could not attend ___ of a family emergency.","a":"because","o":["because","since","although","due"],"src":"Tự soạn","vi":"Tôi không thể tham dự vì có việc gia đình khẩn cấp.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"Chỉ <b>because of</b> mới ghép được với \"of\". <b>due</b> cần \"to\" chứ không phải \"of\".","fixed":true},{"s":"___ she had studied hard, she passed the exam easily.","a":"Since","o":["Since","Despite","However","Whereas"],"src":"Tự soạn","vi":"Vì đã học chăm chỉ nên cô ấy vượt qua kỳ thi dễ dàng.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>Since</b> đầu câu = \"vì\". <b>Despite</b> cần danh từ và ngược nghĩa; <b>Whereas</b> chỉ sự đối lập.","fixed":true},{"s":"The shop closed early ___ to the power cut.","a":"due","o":["due","because","since","as"],"src":"Tự soạn","vi":"Cửa hàng đóng cửa sớm do mất điện.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>due to</b> + danh từ (the power cut). Các liên từ còn lại không kết hợp với \"to\".","fixed":true},{"s":"We took the train ___ the roads were flooded.","a":"because","o":["because","despite","therefore","however"],"src":"Tự soạn","vi":"Chúng tôi đi tàu vì đường bị ngập.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>because</b> nối mệnh đề chỉ lý do. <b>therefore/however</b> là trạng từ nối, không dùng giữa câu như vậy.","fixed":true},{"s":"___ of his hard work, he got a promotion.","a":"Because","o":["Because","Although","However","Whereas"],"src":"Tự soạn","vi":"Nhờ làm việc chăm chỉ, anh ấy được thăng chức.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>Because of</b> + danh từ (his hard work). Các từ còn lại không đi với \"of\".","fixed":true},{"s":"She stayed at home ___ she was feeling unwell.","a":"as","o":["as","despite","however","therefore"],"src":"Tự soạn","vi":"Cô ấy ở nhà vì thấy không khoẻ.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>as</b> = \"vì\" (trang trọng hơn because một chút). Ba lựa chọn kia đều sai nghĩa hoặc sai ngữ pháp.","fixed":true}]},{"h":"3. Tương phản — however / although / whereas","rule":"Nêu 2 mặt để câu trả lời \"chín\" hơn. <b>However</b> đứng đầu câu + dấu phẩy. <b>Although</b> + mệnh đề đầy đủ. <b>, while</b> = \"trong khi đó\" (đối lập).","egs":[{"s":"<b>However</b>, the bus service is not very frequent.","src":"Reading"},{"s":"<b>However</b>, the furniture you see isn't original.","src":"Listening"},{"s":"<b>However</b>, I have never enjoyed those activities.","src":"Reading"},{"s":"<b>However</b>, a train never gets stuck in heavy traffic.","src":"Speaking"}],"quiz":[{"s":"___, there is a small issue.","a":"However","o":["However","Because","Therefore","So"],"src":"Listening","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, có một vấn đề nhỏ."},{"s":"___, there are also some risks.","a":"However","o":["However","Because","Therefore","So"],"src":"Reading","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, cũng có một vài rủi ro."},{"s":"___, the drinks here were great.","a":"However","o":["However","Because","Therefore","So"],"src":"Reading","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, đồ uống ở đây thì tuyệt."},{"s":"___, this view is quite misleading.","a":"However","o":["However","Because","Therefore","So"],"src":"Listening","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, quan điểm này khá dễ gây hiểu lầm."},{"s":"___, the bus service is not very frequent.","a":"However","o":["However","Because","Therefore","So"],"src":"Reading","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, dịch vụ xe buýt không chạy thường xuyên lắm."},{"s":"___, the furniture you see isn't original.","a":"However","o":["However","Because","Therefore","So"],"src":"Listening","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, đồ nội thất bạn thấy không phải đồ nguyên bản."},{"s":"___, I have never enjoyed those activities.","a":"However","o":["However","Because","Therefore","So"],"src":"Reading","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, tôi chưa bao giờ thích những hoạt động đó."},{"s":"___, a train never gets stuck in heavy traffic.","a":"However","o":["However","Because","Therefore","So"],"src":"Speaking","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – gược</b>. <b>so/therefore</b> chỉ kết quả; <b>because</b> chỉ nguyên nhân.","fixed":true},{"s":"My brother likes football, ___ I prefer swimming.","a":"whereas","o":["whereas","because","so","therefore"],"src":"Tự soạn","vi":"Anh trai tôi thích bóng đá, còn tôi thì thích bơi hơn.","gp":"Từ nối chỉ tương phản.","why":"<b>whereas</b> = \"trong khi đó\", dùng để <b>so sánh đối lập</b> hai vế.","fixed":true},{"s":"In ___ of the traffic, we arrived on time.","a":"spite","o":["spite","despite","although","however"],"src":"Tự soạn","vi":"Bất chấp giao thông đông đúc, chúng tôi vẫn đến đúng giờ.","gp":"Từ nối chỉ tương phản.","why":"Cụm cố định là <b>in spite of</b> + danh từ. Không nói \"in despite of\"; <b>although</b> đi với mệnh đề.","fixed":true},{"s":"He is very rich. ___, he lives very simply.","a":"However","o":["However","Because","Therefore","So"],"src":"Tự soạn","vi":"Ông ấy rất giàu. Tuy nhiên, ông sống rất giản dị.","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu mới + dấu phẩy</b>, tương phản với câu trước. <b>Therefore/So</b> chỉ kết quả.","fixed":true},{"s":"___ being tired, she finished the report on time.","a":"Despite","o":["Despite","Although","Because","However"],"src":"Tự soạn","vi":"Dù mệt, cô ấy vẫn hoàn thành báo cáo đúng hạn.","gp":"Từ nối chỉ tương phản.","why":"<b>Despite</b> + <b>V-ing</b> (being tired). <b>Although</b> cần mệnh đề đầy đủ (Although she was tired…).","fixed":true},{"s":"The hotel was cheap, ___ the service was excellent.","a":"but","o":["but","so","because","therefore"],"src":"Tự soạn","vi":"Khách sạn rẻ, nhưng dịch vụ lại tuyệt vời.","gp":"Từ nối chỉ tương phản.","why":"<b>but</b> nối hai ý trái chiều (rẻ ↔ dịch vụ tốt).","fixed":true},{"s":"___ he studied very hard, he did not pass the test.","a":"Although","o":["Although","Despite","Because","So"],"src":"Tự soạn","vi":"Mặc dù đã học rất chăm, anh ấy vẫn không qua bài kiểm tra.","gp":"Từ nối chỉ tương phản.","why":"<b>Although</b> + mệnh đề, nghĩa \"mặc dù\" a \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Dù vậy tôi tin điều đó xảy ra nhanh hơn ta tưởng."},{"s":"On top of that, it is better for the environment ___ flying.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Hơn nữa, nó tốt cho môi trường hơn là đi máy bay."},{"s":"On top of that, it is cheaper ___ flying for short distances.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Hơn nữa, nó rẻ hơn đi máy bay với quãng đường ngắn."},{"s":"First of all, it is cheaper ___ driving your own car every day.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Trước hết, nó rẻ hơn việc lái xe riêng mỗi ngày."},{"s":"That's why I think playing together is better ___ playing alone.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Đó là lý do tôi nghĩ chơi cùng nhau tốt hơn chơi một mình."},{"s":"This is ___ film I have ever seen.","a":"the best","o":["the best","better","best","the better"],"src":"Tự soạn","vi":"Đây là bộ phim hay nhất mà tôi từng xem.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"So sánh nhất phải có <b>the</b>: <b>the best</b>. <b>better</b> là so sánh hơn (cần \"than\").","fixed":true},{"s":"She is as tall ___ her brother.","a":"as","o":["as","than","so","like"],"src":"Tự soạn","vi":"Cô ấy cao bằng anh trai mình.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Cấu trúc so sánh bằng là <b>as + tính từ + as</b>. <b>than</b> chỉ dùng cho so sánh hơn.","fixed":true},{"s":"My new phone is ___ than the old one.","a":"better","o":["better","gooder","best","more good"],"src":"Tự soạn","vi":"Điện thoại mới của tôi tốt hơn cái cũ.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"<b>good</b> là bất quy tắc: so sánh hơn là <b>better</b> (không có \"gooder\"/\"more good\").","fixed":true},{"s":"This restaurant is ___ expensive in town.","a":"the most","o":["the most","most","more","much"],"src":"Tự soạn","vi":"Nhà hàng này đắt nhất thị trấn.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Tính từ dài ở so sánh nhất: <b>the most</b> + tính từ. Thiếu \"the\" là sai.","fixed":true},{"s":"The traffic today is ___ than yesterday.","a":"worse","o":["worse","worst","badder","more bad"],"src":"Tự soạn","vi":"Giao thông hôm nay tệ hơn hôm qua.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"<b>bad</b> bất quy tắc: so sánh hơn là <b>worse</b>, so sánh nhất là \"the worst\".","fixed":true},{"s":"My bag is the same ___ yours.","a":"as","o":["as","than","like","with"],"src":"Tự soạn","vi":"Túi của tôi giống hệt túi của bạn.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Cụm cố định <b>the same as</b> = \"giống như\".","fixed":true},{"s":"He runs ___ faster than I do.","a":"much","o":["much","very","too","so"],"src":"Tự soạn","vi":"Anh ấy chạy nhanh hơn tôi nhiều.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Để nhấn mạnh so sánh hơn dùng <b>much/far/a lot</b> + so sánh hơn. Không dùng <b>very</b> trước dạng so sánh hơn.","fixed":true},{"s":"It was ___ day of my life.","a":"the happiest","o":["the happiest","happiest","more happy","the more happy"],"src":"Tự soạn","vi":"Đó là ngày hạnh phúc nhất đời tôi.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Tính từ ngắn ở so sánh nhất: <b>the + tính từ + -est</b> (the happiest).","fixed":true},{"s":"This book is not as interesting ___ the last one.","a":"as","o":["as","than","so","like"],"src":"Tự soạn","vi":"Cuốn sách này không thú vị bằng cuốn trước.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Dạng phủ định của so sánh bằng vẫn giữ <b>as … as</b>.","fixed":true},{"s":"Of the three routes, this one is ___.","a":"the shortest","o":["the shortest","shorter","shortest","more short"],"src":"Tự soạn","vi":"Trong ba tuyến đường, tuyến này ngắn nhất.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"So sánh nhất trong nhóm ≥3 → <b>the shortest</b> (phải có \"the\").","fixed":true}]},{"h":"8. Động từ khuyết thiếu — should / can / would / must","rule":"<b>should</b> = nên (đề xuất) · <b>can/could</b> = có thể · <b>would</b> = sẽ (giả định, lịch sự) · <b>must</b> = phải. Sau chúng luôn là <b>động từ nguyên mẫu</b>.","egs":[{"s":"What <b>can we</b> do to help him?","src":"Listening"},{"s":"Is there anything that I <b>could do</b>?","src":"Listening"},{"s":"It <b>would help</b> us keep training safely.","src":"Writing"},{"s":"It <b>would help</b> more people still visit.","src":"Writing"}],"quiz":[{"s":"You ___ wear a helmet — it is the law here.","a":"must","o":["must","might","could","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh diễn tả <b>bắt buộc</b> hoặc suy đoán chắc chắn. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn phải đội mũ bảo hiểm — ở đây đó là luật."},{"s":"It looks cloudy, so it ___ rain this afternoon.","a":"might","o":["might","must","should","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>might</b> vì ngữ cảnh chỉ <b>khả năng không chắc chắn</b> (\"có thể\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Trời có vẻ nhiều mây, nên chiều nay có thể mưa."},{"s":"___ you help me carry these boxes, please?","a":"Could","o":["Could","Must","Should","Would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>Could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn giúp tôi khiêng mấy cái hộp này được không?"},{"s":"You ___ eat so much fast food — it is bad for your health.","a":"shouldn’t","o":["shouldn’t","mustn’t","couldn’t","wouldn’t"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>shouldn’t</b> vì ngữ cảnh phù hợp nhất với nghĩa của câu. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn không nên ăn quá nhiều đồ ăn nhanh — nó có hại cho sức khoẻ."},{"s":"I ___ swim when I was five years old.","a":"could","o":["could","must","should","might"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Tôi đã biết bơi từ khi năm tuổi."},{"s":"Students ___ not use their phones during the exam.","a":"must","o":["must","might","would","could"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh d ght","o":["might","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>might</b> vì ngữ cảnh chỉ <b>khả năng không chắc chắn</b> (\"có thể\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Tôi không chắc, nhưng cuộc họp có thể bắt đầu lúc chín giờ."},{"s":"You ___ book a ticket in advance if you want a good seat.","a":"should","o":["should","must","might","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>should</b> vì ngữ cảnh đưa ra <b>lời khuyên</b> (\"nên\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn nên đặt vé trước nếu muốn có chỗ ngồi tốt."},{"s":"He ___ not come to the party because he was ill.","a":"could","o":["could","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Anh ấy đã không thể đến bữa tiệc vì bị ốm."},{"s":"___ you like a cup of tea?","a":"Would","o":["Would","Must","Should","Might"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>Would</b> vì ngữ cảnh dùng cho <b>giả định</b> hoặc lời mời lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn có muốn dùng một tách trà không?"},{"s":"Visitors ___ not take photographs inside the museum.","a":"must","o":["must","might","would","could"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh diễn tả <b>bắt buộc</b> hoặc suy đoán chắc chắn. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Khách tham quan không được chụp ảnh bên trong bảo tàng."},{"s":"If I had more free time, I ___ learn another language.","a":"would","o":["would","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>would</b> vì ngữ cảnh dùng cho <b>giả định</b> hoặc lời mời lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Nếu có nhiều thời gian rảnh hơn, tôi sẽ học thêm một ngoại ngữ."},{"s":"You ___ ask a colleague if you do not understand the task.","a":"can","o":["can","must","might","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>can</b> vì ngữ cảnh chỉ <b>khả năng / được phép</b> ở hiện tại. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn có thể hỏi đồng nghiệp nếu không hiểu nhiệm vụ."},{"s":"It is a good film — you ___ watch it this weekend.","a":"should","o":["should","must","might","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>should</b> vì ngữ cảnh đưa ra <b>lời khuyên</b> (\"nên\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Đó là một bộ phim hay — bạn nên xem nó vào cuối tuần này."},{"s":"Sorry, I ___ not hear you — the room was too noisy.","a":"could","o":["could","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Xin lỗi, tôi đã không nghe rõ bạn nói — phòng ồn quá."},{"s":"We ___ save money by cooking at home instead of eating out.","a":"can","o":["can","must","shall","might"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>can</b> vì ngữ cảnh chỉ <b>khả năng / được phép</b> ở hiện tại. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Chúng ta có thể tiết kiệm tiền bằng cách nấu ăn ở nhà thay vì ăn ngoài."},{"s":"You ___ to wear a uniform at this school.","a":"have","o":["have","must","should","can"],"src":"Tự soạn","vi":"Bạn phải mặc đồng phục ở trường này.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>have to</b> = \"phải\" (quy định bên ngoài). <b>must/should/can</b> <u>không</u> đi kèm \"to\".","fixed":true},{"s":"We ___ not have to pay — entry is free.","a":"do","o":["do","must","should","can"],"src":"Tự soạn","vi":"Chúng ta không phải trả tiền — vào cửa miễn phí.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Phủ định của \"have to\" là <b>do not have to</b> = \"không cần phải\". (Khác \"must not\" = \"cấm\".)","fixed":true},{"s":"___ I use your phone for a moment?","a":"May","o":["May","Must","Should","Would"],"src":"Tự soạn","vi":"Tôi dùng nhờ điện thoại của bạn một lát được không?","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>May I…?</b> = xin phép một cách lịch sự. <b>Must/Should</b> không dùng để xin phép.","fixed":true},{"s":"You ___ to check the timetable before you leave.","a":"ought","o":["ought","must","should","can"],"src":"Tự soạn","vi":"Bạn nên kiểm tra lịch trình trước khi đi.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>ought to</b> = \"nên\" (giống should) — đây là modal <u>duy nhất</u> đi kèm \"to\".","fixed":true},{"s":"I ___ to play football every weekend when I was young.","a":"used","o":["used","use","using","am used"],"src":"Tự soạn","vi":"Hồi trẻ tôi thường chơi bóng đá mỗi cuối tuần.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>used to</b> + nguyên mẫu = thói quen <b>trong quá khứ</b> nay không còn.","fixed":true},{"s":"Students ___ to submit the assignment by Friday.","a":"have","o":["have","must","should","can"],"src":"Tự soạn","vi":"Sinh viên phải nộp bài trước thứ Sáu.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>have to</b> = bắt buộc theo quy định. Các modal khác không đi với \"to\".","fixed":true},{"s":"She ___ be at work — her car is outside.","a":"must","o":["must","should","might","would"],"src":"Tự soạn","vi":"Chắc chắn cô ấy đang ở chỗ làm — xe của cô ấy đậu ngoài kia.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>must</b> ở đây là <b>suy đoán chắc chắn</b> (\"hẳn là\") dựa trên bằng chứng.","fixed":true},{"s":"You ___ not have to come if you are busy.","a":"do","o":["do","must","should","can"],"src":"Tự soạn","vi":"Bạn không cần phải đến nếu đang bận.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>do not have to</b> = \"không cần\". Nếu dùng \"must not\" thì thành \"cấm đến\" — sai nghĩa.","fixed":true},{"s":"___ you mind opening the window?","a":"Would","o":["Would","Should","Must","May"],"src":"Tự soạn","vi":"Bạn có phiền mở giúp cửa sổ không?","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Cụm cố định <b>Would you mind + V-ing?</b> để nhờ vả lịch sự.","fixed":true},{"s":"He ___ to walk to school every day as a child.","a":"used","o":["used","use","uses","using"],"src":"Tự soạn","vi":"Hồi nhỏ anh ấy thường đi bộ đến trường mỗi ngày.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>used to</b> + nguyên mẫu diễn tả thói quen đã chấm dứt trong quá khứ.","fixed":true}]},{"h":"9. Nêu ý kiến & đề xuất (cụm cố định)","rule":"Học thuộc nguyên cụm — dùng được cho <b>Speaking Part 4</b> và <b>Writing Q3/Q4</b>.","egs":[{"s":" of"],"src":"Speaking","gp":"Liên từ chỉ thời gian — nối hai mệnh đề theo trình tự thời gian.","why":"Chọn <b>when</b> vì sau nó là <b>một mệnh đề</b> (có chủ ngữ + động từ). <b>during</b>, <b>despite</b> và <b>because of</b> là <b>giới từ</b>, bắt buộc đi với <b>danh từ</b>, nên đứng trước mệnh đề là sai ngữ pháp.","vi":"Nhưng khi quản lý bắt tay tôi, tôi thấy thực sự hạnh phúc."},{"s":"I will call you ___ soon as I arrive.","a":"as","o":["as","so","by","until"],"src":"Tự soạn","vi":"Tôi sẽ gọi cho bạn ngay khi đến nơi.","gp":"Liên từ chỉ thời gian — nối hai mệnh đề theo trình tự thời gian.","why":"Cụm <b>as soon as</b> = \"ngay khi\". Lưu ý mệnh đề thời gian dùng hiện tại (arrive), không dùng \"will\".","fixed":true},{"s":"Please wait here ___ I come back.","a":"until","o":["until","since","during","by"],"src":"Tự soạn","vi":"Hãy đợi ở đây cho đến khi tôi quay lại.","gp":"Liên từ chỉ thời gian — nối hai mệnh đề theo trình tự thời gian.","why":"<b>until</b> + mệnh đề = \"cho đến khi\". <b>during</b> phải đi với danh từ.","fixed":true},{"s":"___ the time we arrived, the shop had closed.","a":"By","o":["By","Until","Since","During"],"src":"Tự soạn","vi":"Đến lúc chúng tôi tới thì cửa hàng đã đóng.","gp":"Liên từ chỉ thời gian — nối hai mệnh đề theo trình tự thời gian.","why":"Cụm <b>by the time</b> + mệnh đề = \"đến lúc mà\".","fixed":true},{"s":"___ I feel stressed, I go for a long walk.","a":"Whenever","o":["Whenever","Whereas","However","Despite"],"src":"Tự soạn","vi":"Mỗi khi thấy căng thẳng, tôi lại đi bộ thật lâu.","gp":"Liên từ chỉ thời gian — nối hai mệnh đề theo trình tự thời gian.","why":"<b>Whenever</b> = \"mỗi khi, bất cứ lúc nào\". Ba từ kia không chỉ thời gian.","fixed":true},{"s":"She has not called me ___ last Monday.","a":"since","o":["since","for","until","during"],"src":"Tự soạn","vi":"Cô ấy chưa gọi cho tôi kể từ thứ Hai tuần trước.","gp":"Liên từ chỉ thời gian — nối hai mệnh đề theo trình tự thời gian.","why":"<b>since</b> + mốc thời gian, đi cùng ons, who will</b>?","src":"Listening"},{"s":"Usually, <b>if it's delayed, it could</b> leave as late as 10:00.","src":"Listening"},{"s":"<b>If you would</b> like to listen to his talk, it is in the midhall.","src":"Reading"}],"quiz":[{"s":"Let me know ___ you're around!","a":"if","o":["if","unless","although","whether"],"src":"Listening","gp":"Câu điều kiện với \"if\" — nêu điều kiện và kết quả.","why":"<b>If</b> nghĩa \"nếu\", nêu điều kiện để kết quả xảy ra. <b>Unless</b> nghĩa \"trừ khi\" (mang sẵn nghĩa phủ định → ngược ý); <b>Although</b> nghĩa \"mặc dù\"; <b>Whether</b> nghĩa \"liệu có… hay không\".","vi":"Nếu bạn ở gần đây thì báo tôi nhé!"},{"s":"I'm not sure ___ I'll return to it.","a":"if","o":["if","unless","although","whether"],"src":"Reading","gp":"Câu điều kiện với \"if\" — nêu điều kiện và kết quả.","why":"<b>If</b> nghĩa \"nếu\", nêu điều kiện để kết quả xảy ra. <b>Unless</b> nghĩa \"trừ khi\" (mang sẵn nghĩa phủ định → ngược ý); <b>Although</b> nghĩa \"mặc dù\"; <b>Whether</b> nghĩa \"liệu có… hay không\".","vi":"Tôi không chắc liệu mình có quay lại với nó không."},{"s":"Let me know ___ that works for you.","a":"if","o":["if","unless","although","whether"],"src":"Listening","gp":"Câu điều kiện với \"if\" — nêu điều kiện và kết quả.","why":"<b>If</b> nghĩa \"nếu\", nêu điều kiện để kết quả xảy ra. <b>Unless</b> nghĩa \"trừ khi\" (mang sẵn nghĩa phủ định → ngược ý); <b>Although</b> nghĩa \"mặc dù\"; <b>Whether</b> nghĩa \"liệu có… hay không\".","vi":"Nếu như vậy hợp với bạn thì báo tôi nhé."},{"s":"Let me know ___ 5:30 works for you.","a":"if","o":["if","unless","although","whether"],"src":"Listening","gp":"Câu điều kiện với \"if\" — nêu điều kiện và kết quả.","why":"<b>If</b> nghĩa \"nếu\", nêu điều kiện để kết quả xảy ra. <b>Unless</b> nghĩa \"trừ khi\" (mang sẵn nghĩa phủ định → ngược ý); <b>Although</b> nghĩa \"mặc dù\"; <b>Whether</b> nghĩa \"liệu có… hay không\".","vi":"Nếu 5 giờ 30 hợp với bạn thì báo tôi nhé."},{"s":"___ you see her, just hand ứ phân từ (V3)</b> của break là <b>broken</b>, không phải \"broke\".","fixed":true},{"s":"Our office is ___ near the train station.","a":"located","o":["located","locating","locate","locates"],"src":"Tự soạn","vi":"Văn phòng của chúng tôi nằm gần nhà ga.","gp":"Câu bị động — be + V3, dùng khi chủ ngữ chịu tác động hoặc không cần nêu ai làm.","why":"<b>be located</b> = \"toạ lạc, nằm ở\" — dạng bị động cố định.","fixed":true}]},{"h":"15. Lượng từ — many / much / a lot of / a few","rule":"<b>many + đếm được</b> · <b>much + không đếm được</b> · <b>a lot of</b> dùng cho cả hai · <b>a few</b> = một vài · <b>a little</b> = một chút.","egs":[{"s":"How <b>many people</b> live in the town?","src":"Listening"},{"s":"<b>Many think</b> cars make the air bad.","src":"Listening"},{"s":"Who paid <b>a lot of money</b> on transport?","src":"Reading"},{"s":"For me, cycling has <b>a lot of advantages</b>.","src":"Speaking"}],"quiz":[{"s":"How ___ money do you need for the trip?","a":"much","o":["much","many","a few","a lot"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Bạn cần bao nhiêu tiền cho chuyến đi?"},{"s":"There are ___ interesting places to visit in my town.","a":"many","o":["many","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>many</b> đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Có nhiều nơi thú vị để tham quan trong thị trấn của tôi."},{"s":"I do not have ___ free time this week.","a":"much","o":["much","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Tuần này tôi không có nhiều thời gian rảnh."},{"s":"She has ___ colleagues who work in the city centre.","a":"several","o":["several","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>several</b> = \"vài\", đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Cô ấy có vài đồng nghiệp làm việc ở trung tâm thành phố."},{"s":"We only need ___ information before we decide.","a":"a little","o":["a little","a few","many","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a little</b> = \"một chút\", đi với danh từ <b>KHÔNG đếm được</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Chúng tôi chỉ cần một chút thông tin trước khi quyết định."},{"s":"___ students in my class come from the countryside.","a":"Many","o":["Many","Much","A little","Less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>many</b> đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Nhiều bạn học trong lớp tôi đến từ vùng quê."},{"s":"He drinks too ___ coffee every morning.","a":"much","o":["much","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Anh ấy uống quá nhiều cà phê mỗi sáng."},{"s":"There were only ___ people at the concert last night.","a":"a few","o":["a few","a little","much","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a few</b> = \"một vài\", đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại ng khớp tính đếm được</b> của danh từ đi sau.","vi":"Phần lớn bạn bè tôi thích xem phim trực tuyến."},{"s":"We bought ___ vegetables at the local market.","a":"some","o":["some","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>some</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Chúng tôi mua ít rau ở chợ địa phương."},{"s":"I have ___ energy after a good night’s sleep.","a":"plenty of","o":["plenty of","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>plenty of</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Tôi tràn đầy năng lượng sau một giấc ngủ ngon."},{"s":"Only ___ members came to the meeting last Monday.","a":"a few","o":["a few","a little","much","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a few</b> = \"một vài\", đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Chỉ có vài thành viên đến dự họp hôm thứ Hai tuần trước."},{"s":"He does not eat ___ fast food these days.","a":"much","o":["much","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Dạo này anh ấy không ăn nhiều đồ ăn nhanh."},{"s":"There are ___ good reasons to exercise regularly.","a":"many","o":["many","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>many</b> đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ b> + tính từ = \"quá… (đến mức không ổn)\".","fixed":true},{"s":"___ of my parents work in a hospital.","a":"Both","o":["Both","All","Every","Each"],"src":"Tự soạn","vi":"Cả bố và mẹ tôi đều làm ở bệnh viện.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>Both</b> dùng cho <b>đúng 2 người/vật</b>. <b>All</b> dùng cho từ 3 trở lên.","fixed":true},{"s":"___ of the students passed the final exam.","a":"All","o":["All","Both","Every","Each"],"src":"Tự soạn","vi":"Tất cả học sinh đều đỗ kỳ thi cuối kỳ.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>All of</b> + danh từ số nhiều. <b>Every/Each</b> đi trực tiếp với danh từ số ít (every student).","fixed":true},{"s":"___ of my friends came — they were all busy.","a":"None","o":["None","Any","No","Both"],"src":"Tự soạn","vi":"Không có người bạn nào của tôi đến — họ đều bận.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>None of</b> = \"không ai trong số…\". <b>No</b> đi thẳng với danh từ (no friends).","fixed":true},{"s":"She has ___ experience to do this job.","a":"enough","o":["enough","too","many","a few"],"src":"Tự soạn","vi":"Cô ấy có đủ kinh nghiệm để làm công việc này.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>enough</b> + danh từ không đếm được (experience).","fixed":true},{"s":"I bought ___ bread and some eggs.","a":"some","o":["some","any","many","a few"],"src":"Tự soạn","vi":"Tôi đã mua ít bánh mì và vài quả trứng.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"Câu khẳng định dùng <b>some</b>; \"bread\" không đếm được nên không dùng \"many/a few\".","fixed":true},{"s":"There are hardly ___ people in the park today.","a":"any","o":["any","some","much","a little"],"src":"Tự soạn","vi":"Hôm nay công viên hầu như chẳng có ai.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"Sau <b>hardly</b> (mang nghĩa phủ định) dùng <b>any</b>.","fixed":true}]},{"h" :"Tự soạn","vi":"Có thể sẽ có một vài chậm trễ do trời mưa.","gp":"Cấu trúc There is / There are — giới thiệu sự tồn tại.","why":"Sau modal (<b>may</b>) là <b>there may be</b>, giữ nguyên \"be\".","fixed":true},{"s":"There ___ a small shop here before they built the mall.","a":"was","o":["was","were","is","has"],"src":"Tự soạn","vi":"Trước khi họ xây trung tâm thương mại thì ở đây có một cửa hàng nhỏ.","gp":"Cấu trúc There is / There are — giới thiệu sự tồn tại.","why":"\"a small shop\" số ít + quá khứ → <b>there was</b>.","fixed":true},{"s":"There ___ several reasons why I chose this course.","a":"are","o":["are","is","was","has"],"src":"Tự soạn","vi":"Có vài lý do khiến tôi chọn khoá học này.","gp":"Cấu trúc There is / There are — giới thiệu sự tồn tại.","why":"\"several reasons\" số nhiều, hiện tại → <b>there are</b>.","fixed":true}]}];
/* ---- tiến độ ngữ pháp (dùng chung, mục PROG.grammar) ---- */
function gRec(i){ return (PROG.grammar||{})['p'+i]||null; }
function gLevel(i){ const r=gRec(i); if(!r||!r.seen) return -1; const a=r.correct/r.seen;
  return a>=1?5:a>=.9?4:a>=.8?3:a>=.7?2:a>=.6?1:0; }
function gBadge(i){ const l=gLevel(i);
  return l<0?'<span class="lv lvnew">chưa luyện</span>':'<span class="lv lv'+l+'" title="'+LVNAME[l]+'">Lv'+l+'</span>'; }
function gRecord(i, ok){
  if(!PROG.grammar)PROG.grammar={};
  const k='p'+i; const r=PROG.grammar[k]||{seen:0,correct:0};
  r.seen++; if(ok)r.correct++; PROG.grammar[k]=r; progSave(); return r;
}
/* ---- cấp độ TỪNG CÂU (giống từ vựng) ---- */
function gqKey(pi,qi){ return 'p'+pi+'q'+qi; }
function gqRec(pi,qi){ return (PROG.grammar||{})[gqKey(pi,qi)]||null; }
function gqLevel(pi,qi){
  const r=gqRec(pi,qi); if(!r||!r.seen) return -1;
  const a=r.correct/r.seen;
  return a>=1?5:a>=.9?4:a>=.8?3:a>=.7?2:a>=.6?1:0;
}
function gqBadge(pi,qi){
  const l=gqLevel(pi,qi);
  return l<0?'<span class="lv lvnew">câu mới</span>':'<span class="lv lv'+l+'" title="'+LVNAME[l]+'">Lv'+l+'</span>';
}
function gqRecord(pi,qi,ok){
  if(!PROG.grammar)PROG.grammar={};
  const k=gqKey(pi,qi); const r=PROG.grammar[k]||{seen:0,correct:0};
  r.seen++; if(ok)r.correct++; PROG.grammar[k]=r; return r;   // progSave do gRecord gọi
}
// đếm phân bố cấp của toàn bộ câu
function gStats(){
  const c=[0,0,0,0,0,0]; let neu=0, total=0;
  GRAMMAR.forEach((g,i)=>(g.quiz||[]).forEach((q,j)=>{
    total++; const l=gqLevel(i,j); if(l<0)neu++; else c[l]++;
  }));
  return {c:c, neu:neu, total:total};
}
/* ---- bộ chạy luyện tập ngữ pháp ---- */
let gq={pool:[],order:[],oi:0,cur:null,answered:false,done:0,right:0,title:''};
function startGrammar(idx, weakOnly){
  let pool=[];
  if(idx==null) GRAMMAR.forEach((g,i)=>(g.quiz||[]).forEach((q,j)=>pool.push({q:q,pi:i,qi:j})));
  else (GRAMMAR[idx].quiz||[]).forEach((q,j)=>pool.push({q:q,pi:idx,qi:j}));
  if(weakOnly){
    const w=pool.filter(x=>{const l=gqLevel(x.pi,x.qi); return l<0||l<=2;});
    if(w.length) pool=w;
  }
  if(!pool.length)return;
  gq.pool=pool; gq.order=shuffle(pool.map((_,i)=>i)); gq.oi=0; gq.done=0; gq.right=0;
  gq.title = idx==null ? ('🎲 Trộn tất cả — '+pool.length+' câu') : GRAMMAR[idx].h;
  $('gTrainer').classList.remove('hide'); $('grammar').classList.add('hide');
  gNext();
  try{ $('gTrainer').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
}
function endGrammar(){ $('gTrainer').classList.add('hide'); $('grammar').classList.remove('hide'); renderGrammar(); }
function gNext(){
  if(gq.oi>=gq.order.length){ gEnd(); return; }
  gq.cur=gq.pool[gq.order[gq.oi]]; gq.oi++; gq.answered=false; gRenderQ();
}
function gEnd(){
  const pct=gq.done?Math.round(gq.right/gq.done*100):0;
  $('gTrainer').innerHTML='<div class="dash-h">🏁 Xong!</div>'
    +'<div class="qz-prompt">'+gq.right+' / '+gq.done+'  ('+pct+'%)</div>'
    +'<div class="btnrow" style="justify-content:center;margin-top:16px">'
    +'<button class="btn primary" id="gAgain">Làm lại</button><button class="btn" id="gBack">‹ Về danh sách</button></div>';
  $('gAgain').onclick=()=>{ gq.order=shuffle(gq.pool.map((_,i)=>i)); gq.oi=0; gq.done=0; gq.right=0; gNext(); };
  $('gBack').onclick=endGrammar;
}
function gRenderQ(){
  const it=gq.cur, q=it.q;
  $('gTrainer').innerHTML='<div class="qz-top"><span class="qz-mode">'+esc(gq.title.replace(/^\d+\.\s*/,''))+'</span>'
    +'<span class="qz-prog">'+gq.oi+'/'+gq.order.length+' · đúng '+gq.right+'/'+gq.done
    +' <button class="fchip" id="gExit" style="margin-left:6px">Thoát</button></span></div><div id="gBody"></div>';
  $('gExit').onclick=endGrammar;
  const b=$('gBody');
  b.innerHTML='<div class="qz-q">Chọn đáp án đúng điền vào chỗ trống</div>'
    +'<div class="qz-sent" style="text-align:center">'+esc(q.s).replace('___','<span class="qz-blank">_____</span>')+'</div>'
    +'<div class="qz-opts" id="gOpts"></div><div id="gFb"></div>';
  const box=$('gOpts');
  shuffle(q.o.slice()).forEach(o=>{
    const btn=document.createElement('button'); btn.className='qz-opt'; btn.textContent=o;
    btn.onclick=()=>{
      if(gq.answered)return; gq.answered=true;
      const ok=o===q.a;
      Array.prototype.forEach.call(box.children,x=>{ x.disabled=true; if(x.textContent===q.a)x.classList.add('correct'); });
      if(!ok)btn.classList.add('wrong');
      gq.done++; if(ok)gq.right++;
      const qr=gqRecord(it.pi, it.qi, ok);      // cấp độ riêng của câu này
      const r=gRecord(it.pi, ok);               // cấp độ chung của mục
      $('gFb').innerHTML='<div class="qz-fb '+(ok?'ok':'no')+'">'+(ok?'✓ Chính xác!':'✗ Đáp án đúng: <span class="ans">'+esc(q.a)+'</span>')+'</div>'
        +'<div class="qz-sent" style="text-align:center;font-size:.95rem">'+esc(q.s.replace('___',q.a))+'</div>'
        +(q.vi?'<div class="gr-vi">🇻🇳 '+esc(q.vi)+'</div>':'')
        +(q.gp?'<div class="gr-gp">📘 '+esc(q.gp)+'</div>':'')
        +(q.why?'<div class="gr-why">💡 '+q.why+'</div>':'')
        +'<div class="qz-meta">Câu này: '+gqBadge(it.pi,it.qi)+' (đúng '+qr.correct+'/'+qr.seen+')'
          +' · cả mục: '+gBadge(it.pi)+' '+r.correct+'/'+r.seen+'</div>'
        +'<div class="qz-meta">'+esc(GRAMMAR[it.pi].h)+' · nguồn '+esc(q.src)+'</div>'
        +'<button class="qz-next" id="gNextBtn">Tiếp →</button>';
      $('gNextBtn').onclick=gNext;
      setTimeout(()=>{try{$('gNextBtn').focus();}catch(e){}},30);
    };
    box.appendChild(btn);
  });
}
function renderGrammar(){
  const totalQ=GRAMMAR.reduce((a,g)=>a+(g.quiz?g.quiz.length:0),0);
  $('grammar').innerHTML='<div class="dash-h">📖 Ngữ pháp B2 trọng tâm — '+GRAMMAR.length+' điểm</div>'
    +'<div class="dash-s">Mỗi điểm kèm <b>câu thật lấy từ chính đề</b> bạn đang ôn — nhãn màu cho biết câu đó ở kỹ năng nào '
    +'(<span class="gr-src src-Speaking">Speaking</span><span class="gr-src src-Writing">Writing</span>'
    +'<span class="gr-src src-Reading">Reading</span><span class="gr-src src-Listening">Listening</span>). '
    +'Phần <b>bôi vàng</b> là cấu trúc cần nhớ.</div>'
    +(function(){
       const st=gStats(); let bars='';
       for(let l=5;l>=0;l--){ const p=st.total?Math.round(st.c[l]/st.total*100):0;
         bars+='<div class="lvrow"><span class="nm">Lv'+l+' · '+LVNAME[l].split(' — ')[0]+'</span>'
           +'<span class="bar"><span class="b'+l+'" style="width:'+p+'%"></span></span><span class="n">'+st.c[l]+'</span></div>'; }
       const pn=st.total?Math.round(st.neu/st.total*100):0;
       bars+='<div class="lvrow"><span class="nm">chưa luyện</span><span class="bar"><span class="bnew" style="width:'+pn+'%"></span></span><span class="n">'+st.neu+'</span></div>';
       return '<div class="dash-s">Mỗi câu có <b>cấp thuần thục riêng</b> (Lv0–5) theo % trả lời đúng — giống từ vựng. '
         +'Đã luyện <b>'+(st.total-st.neu)+'</b>/'+st.total+' câu · thuần thục (Lv4–5) <b>'+(st.c[4]+st.c[5])+'</b></div>'
         +'<div class="lvbars">'+bars+'</div>';
     })()
    +'<div class="btnrow" style="margin-bottom:18px"><button class="btn primary" id="gAll">🎲 Trộn tất cả — luyện '+totalQ+' câu</button>'
    +'<button class="btn" id="gWeak">⚠️ Luyện câu yếu (Lv0–2 + chưa làm)</button></div>'
    +GRAMMAR.map((g,i)=>{ const r=gRec(i);
      return '<div class="gr-block"><div class="gr-h">'+g.h+' '+gBadge(i)+'</div><div class="gr-rule">'+g.rule+'</div>'
      +g.egs.map(e=>'<div class="gr-eg"><span class="gr-src src-'+e.src+'">'+e.src+'</span>'+e.s+'</div>').join('')
      +'<div class="btnrow" style="margin-top:10px"><button class="btn gp" data-gi="'+i+'">🎯 Luyện '+(g.quiz?g.quiz.length:0)+' câu</button>'
      +(r?'<span class="gr-count" style="align-self:center">đã làm '+r.seen+' · đúng '+Math.round(r.correct/r.seen*100)+'%</span>':'')
      +'</div></div>'; }).join('');
  $('gAll').onclick=()=>startGrammar(null);
  $('gWeak').onclick=()=>startGrammar(null,true);
  document.querySelectorAll('.btn.gp').forEach(b=>b.onclick=()=>startGrammar(+b.dataset.gi));
}

/* ============ tabs + khởi động ============ */
document.querySelectorAll('.maintab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.maintab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    const mt=t.dataset.mt;
    $('vocabTab').classList.toggle('hide', mt!=='vocab');
    $('grammarTab').classList.toggle('hide', mt!=='grammar');
    if(mt==='vocab'){ renderDash(); renderList(); }
    if(mt==='grammar' && $('gTrainer').classList.contains('hide')) renderGrammar();
    if(synth)synth.cancel();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});
// tiêu đề tự tính theo dữ liệu thật -> không bao giờ lệch số
(function(){
  const nq=GRAMMAR.reduce((a,g)=>a+(g.quiz?g.quiz.length:0),0);
  const el=$('subLine');
  if(el) el.innerHTML='<b>'+VOCAB.length+' từ B2</b> (gom từ Speaking · Writing · Reading · Listening) · '
    +'<b>'+GRAMMAR.length+' điểm ngữ pháp</b> · <b>'+nq+' câu luyện tập</b>';
})();
setSaveBar(); renderGrammar();
progLoad().then(()=>{ renderDash(); renderList(); renderGrammar(); });
</script>
