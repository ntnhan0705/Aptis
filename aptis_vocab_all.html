<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptis — Từ vựng & Ngữ pháp</title>
<style>
  :root{
    --ink:#1b2a2f; --paper:#fbf7ef; --card:#ffffff; --line:#d8cdb8;
    --accent:#c0392b; --accent-soft:#f6e3df;
    --green:#2e7d52; --green-soft:#e3f0e8; --muted:#7a7264;
    --gold:#f0b429; --gold-soft:#fdf0c8; --blue:#2e6fb0; --blue-soft:#e2edf7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  .wrap{max-width:700px;margin:0 auto;padding:26px 18px 80px;}
  header.top{border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:14px;}
  .eyebrow{font-family:"SF Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;}
  h1{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.01em;}
  .sub{margin:0;color:var(--muted);font-size:.88rem;}
  .savebar{font-family:"SF Mono",monospace;font-size:.7rem;text-align:center;margin:12px 0;padding:7px 11px;border-radius:9px;background:var(--green-soft);color:#1f7a52;border:1px solid #cfe6d6;}
  .savebar.local{background:var(--gold-soft);color:#8a6d00;border-color:var(--gold);}
  .maintabs{display:flex;gap:8px;margin:0 0 16px;}
  .maintab{flex:1;text-align:center;padding:11px 8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-family:"SF Mono",monospace;font-size:.78rem;color:var(--muted);}
  .maintab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .hide{display:none;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px;}
  /* dashboard */
  .dash-h{font-size:1.05rem;font-weight:800;margin-bottom:4px;}
  .dash-s{font-size:.84rem;color:var(--muted);margin-bottom:14px;}
  .lvbars{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .lvrow{display:flex;align-items:center;gap:10px;font-size:.8rem;}
  .lvrow .nm{width:118px;flex:none;font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);}
  .lvrow .bar{flex:1;height:14px;background:#efe8da;border-radius:99px;overflow:hidden;}
  .lvrow .bar>span{display:block;height:100%;border-radius:99px;}
  .lvrow .n{width:34px;text-align:right;font-weight:700;font-family:"SF Mono",monospace;font-size:.74rem;}
  .b5{background:var(--green);} .b4{background:#5aa77c;} .b3{background:#9dbf6a;}
  .b2{background:var(--gold);} .b1{background:#e2953f;} .b0{background:var(--accent);} .bnew{background:#c3bbaa;}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;}
  .btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 18px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn:hover{opacity:.9;} .btn:disabled{opacity:.45;cursor:default;}
  .lv{font-size:.6rem;font-weight:800;border-radius:99px;padding:2px 7px;white-space:nowrap;}
  .lvnew{background:#eee7d8;color:var(--muted);} .lv0{background:var(--accent-soft);color:var(--accent);}
  .lv1{background:#fbe6cf;color:#a15c00;} .lv2{background:var(--gold-soft);color:#8a6d00;}
  .lv3{background:#eaf2dc;color:#5a7d1e;} .lv4{background:var(--green-soft);color:var(--green);} .lv5{background:var(--green);color:#fff;}
  /* trainer */
  .qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .qz-mode{font-family:"SF Mono",monospace;font-size:.68rem;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:3px 10px;}
  .qz-prog{font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .qz-q{font-family:"SF Mono",monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .qz-prompt{font-size:1.4rem;font-weight:800;text-align:center;margin:10px 0 4px;line-height:1.35;}
  .qz-sent{font-size:1.05rem;line-height:1.85;margin:8px 0;}
  .qz-blank{display:inline-block;min-width:92px;border-bottom:2.5px solid var(--accent);color:var(--accent);text-align:center;font-weight:800;}
  .qz-vi{text-align:center;color:var(--muted);font-size:.85rem;margin-top:6px;}
  .qz-play{display:inline-flex;gap:6px;border:none;background:var(--blue);color:#fff;border-radius:10px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:700;font-size:.88rem;margin:4px 0 8px;}
  .qz-opts{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .qz-optrow{display:flex;gap:8px;align-items:stretch;}
  .qz-optrow .qz-opt{flex:1;}
  .qz-optplay{flex:none;border:1.5px solid var(--line);background:var(--blue-soft);color:var(--blue);
    border-radius:10px;width:46px;font-size:1.05rem;cursor:pointer;}
  .qz-optplay:hover{background:var(--blue);color:#fff;}
  .qz-opt{text-align:left;padding:12px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font:inherit;font-size:1rem;color:var(--ink);}
  .qz-opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft);}
  .qz-opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:800;}
  .qz-opt.wrong{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .qz-opt:disabled{cursor:default;}
  .qz-inrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .qz-in{flex:1;min-width:170px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:1.05rem;}
  .qz-in.ok{border-color:var(--green);background:var(--green-soft);} .qz-in.no{border-color:var(--accent);background:var(--accent-soft);}
  .qz-fb{margin-top:14px;text-align:center;font-size:1rem;font-weight:700;}
  .qz-fb.ok{color:var(--green);} .qz-fb.no{color:var(--accent);}
  .qz-fb .ans{font-weight:900;text-decoration:underline;}
  .qz-meta{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .qz-next{display:block;margin:16px auto 0;border:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 30px;cursor:pointer;font:inherit;font-weight:800;font-size:.95rem;}
  .qz-hintwrap{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;}
  .fam-box{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);}
  .fam-h{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .fam-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .fam-cell{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:8px;background:var(--card);}
  .fam-cell.fam-empty{opacity:.45;}
  .fam-lbl{font-size:.64rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;}
  .fam-w{font-size:.9rem;font-weight:700;color:var(--ink);}
  .fam-suf{font-size:.7rem;color:var(--muted);}
  @media(max-width:480px){.fam-grid{grid-template-columns:1fr;}}
  /* word list */
  .wl{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
  .wrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);flex-wrap:wrap;}
  .wrow .wen{font-weight:700;font-size:.92rem;min-width:140px;}
  .wrow .wipa{font-family:ui-monospace,monospace;font-size:.76rem;color:var(--muted);flex:1;min-width:110px;}
  .wrow .wvi{font-size:.85rem;color:#4a4438;flex:1;min-width:100px;}
  .wrow .wstat{font-family:"SF Mono",monospace;font-size:.68rem;color:var(--muted);}
  .wpos{font-family:"SF Mono",monospace;font-size:.66rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;white-space:nowrap;}
  .wplay{border:none;background:var(--accent-soft);color:var(--accent);border-radius:8px;width:32px;height:32px;cursor:pointer;}
  .filt{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;}
  .fchip{padding:6px 13px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);}
  .fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  /* grammar */
  .gr-block{margin-bottom:20px;}
  .gr-h{font-size:1.02rem;font-weight:800;margin-bottom:6px;}
  .gr-rule{font-size:.86rem;line-height:1.65;color:#4a4438;background:var(--blue-soft);border:1px solid #cfe0ef;border-radius:9px;padding:10px 13px;margin-bottom:8px;}
  .gr-rule b{color:var(--ink);}
  .gr-eg{font-size:.94rem;line-height:1.7;padding:7px 12px;border-left:2px solid var(--line);margin:5px 0;}
  .gr-eg b{background:var(--gold-soft);border-radius:3px;padding:0 3px;color:#5a4600;}
  .gr-src{display:inline-block;font-family:"SF Mono",monospace;font-size:.58rem;font-weight:700;border-radius:99px;padding:1px 7px;margin-right:7px;vertical-align:middle;}
  .src-Speaking{background:#e9e2f7;color:#5b3fa8;} .src-Writing{background:var(--accent-soft);color:var(--accent);}
  .src-Reading{background:var(--gold-soft);color:#8a6d00;} .src-Listening{background:var(--blue-soft);color:var(--blue);}
  .gr-count{font-family:"SF Mono",monospace;font-size:.62rem;color:var(--muted);}
  .gr-vi{margin-top:10px;font-size:.94rem;line-height:1.6;color:#4a4438;background:var(--paper);
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;text-align:left;}
  .gr-gp{margin-top:8px;font-size:.86rem;line-height:1.6;color:#1d4f7a;background:var(--blue-soft);
    border:1px solid #cfe0ef;border-radius:9px;padding:9px 12px;text-align:left;font-weight:600;}
  .gr-why{margin-top:8px;font-size:.88rem;line-height:1.75;color:#4a4438;background:var(--gold-soft);
    border:1px solid var(--gold);border-radius:9px;padding:10px 13px;text-align:left;}
  .gr-why b{color:#5a4600;}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Aptis General</p>
    <h1>Từ vựng &amp; Ngữ pháp</h1>
    <p class="sub"><span id="subLine">Đang tải…</span></p>

  <div class="savebar" id="savebar">Đang kiểm tra chế độ lưu…</div>

  <div class="maintabs">

    <div class="maintab" data-mt="grammar">📖 Ngữ pháp</div>

  <div id="vocabTab">
    <div class="card" id="dash"></div>
    <div class="card hide" id="trainer"></div>
    <div class="card" id="listCard">

      <div class="filt" id="filt"></div>
      <div class="wl" id="wl"></div>
    </div>
  </div>

  <div id="grammarTab" class="hide">
    <div class="card hide" id="gTrainer"></div>
    <div class="card" id="grammar"></div>
  </div>

  <footer>Tiến độ lưu chung ở <b>aptis_progress.json</b> · mục <b>vocab</b></footer>
</div>

window.ACLOUD=window.ACLOUD||(function(){
  var API='/progress',CK='aptis_sync_code',t=null;
  function code(){try{return localStorage.getItem(CK)||'';}catch(e){return'';}}
  function setCode(c){try{localStorage.setItem(CK,c||'');}catch(e){}}
  function clear(){try{localStorage.removeItem(CK);}catch(e){}}
  function on(){return !!code();}
  function isMap(x){return x&&typeof x==='object'&&!Array.isArray(x);}
  function score(r){if(!isMap(r))return 0;return (r.attempts||0)*1000+(r.seen||0)*10+(r.correct||0)+((r.history&&r.history.length)||0);}
  function mm(a,b){a=isMap(a)?a:{};b=isMap(b)?b:{};var o={},ks={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ks[k]=1;});
    Object.keys(ks).forEach(function(k){var av=a[k],bv=b[k];
      if(av===undefined){o[k]=bv;return;}if(bv===undefined){o[k]=av;return;}
      if(isMap(av)&&isMap(bv)&&!('seen'in av)&&!('attempts'in av)&&!('correct'in av)){o[k]=mm(av,bv);}
      else{o[k]=score(bv)>=score(av)?bv:av;}});return o;}
  function merge(a,b){a=isMap(a)?a:{};b=isMap(b)?b:{};var o={},ks={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ks[k]=1;});
    Object.keys(ks).forEach(function(k){if(k==='updated'){o.updated=((a.updated||'')>(b.updated||''))?a.updated:b.updated;return;}
      var av=a[k],bv=b[k];if(isMap(av)||isMap(bv)){o[k]=mm(av,bv);}else{o[k]=(bv!==undefined?bv:av);}});return o;}
  function u(){return API+'?code='+encodeURIComponent(code());}
  function pull(){if(!code())return Promise.resolve(null);
    return fetch(u(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
  function pushNow(data){if(!code())return Promise.resolve(false);
    return fetch(u(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.ok;}).catch(function(){return false;});}
  function push(data){if(!code())return;clearTimeout(t);t=setTimeout(function(){pushNow(data);},1200);}
  function syncOnLoad(local){if(!code())return Promise.resolve(local);
    return pull().then(function(remote){return remote===null?local:merge(local||{},remote||{});});}
  return {code:code,setCode:setCode,clear:clear,on:on,merge:merge,pull:pull,push:push,pushNow:pushNow,syncOnLoad:syncOnLoad,API:API};
})();
const SERVED = /^https?:$/.test(location.protocol);
let PROG = {};
function lsGet(){ try{ return JSON.parse(localStorage.getItem('aptis_progress')||'{}'); }catch(e){ return {}; } }
async function progLoad(){
  let d={};
  if(SERVED){ try{ const r=await fetch('/api/progress',{cache:'no-store'}); d=await r.json(); }catch(e){ d=lsGet(); } }
  else d=lsGet();
  d=d||{};
  if(ACLOUD.on()){try{const m=await ACLOUD.syncOnLoad(d);if(m){d=m;
    try{localStorage.setItem('aptis_progress',JSON.stringify(d));}catch(e){}
    if(SERVED){try{await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch(e){}}
    ACLOUD.push(d);}}catch(e){}}
  PROG=d||{}; if(!PROG.vocab)PROG.vocab={};
}
let saveT=null;
function progSave(){
  PROG.updated=new Date().toISOString();
  try{ localStorage.setItem('aptis_progress',JSON.stringify(PROG)); }catch(e){}
  if(SERVED){ clearTimeout(saveT); saveT=setTimeout(()=>{
    fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(PROG)}).catch(()=>{});
  },250); }
  ACLOUD.push(PROG);
}

/* ============ mastery ============ */
const KEY = en => en.toLowerCase();
function vRec(en){ return PROG.vocab[KEY(en)]||null; }
function vLevel(en){
  const r=vRec(en); if(!r||!r.seen) return -1;      // -1 = chưa học
  const a=r.correct/r.seen;
  return a>=1?5 : a>=.9?4 : a>=.8?3 : a>=.7?2 : a>=.6?1 : 0;
}
const LVNAME=['<60% — chưa nhớ','60% — mới nhớ','70% — lõm bõm','80% — khá','90% — tốt','100% — thuần thục'];
function levelBadge(en){
  const l=vLevel(en);
  if(l<0) return '<span class="lv lvnew">chưa học</span>';
  return '<span class="lv lv'+l+'" title="'+LVNAME[l]+'">Lv'+l+'</span>';
}
// Máy trạng thái: M1 --3 đúng liên tiếp--> M2 --3 đúng liên tiếp--> M3
//                 M2 <--quá 3 sai liên tiếp-- M3 ; M1 <--quá 3 sai liên tiếp-- M2
function vRecord(en, ok){
  const k=KEY(en);
  const r=PROG.vocab[k]||{en:en,seen:0,correct:0,mode:1,sc:0,sw:0};
  r.seen++;
  if(ok){ r.correct++; r.sc++; r.sw=0; } else { r.sw++; r.sc=0; }
  const before=r.mode;
  if(r.mode===1){ if(r.sc>=3){ r.mode=2; r.sc=0; r.sw=0; } }
  else if(r.mode===2){ if(r.sc>=3){ r.mode=3; r.sc=0; r.sw=0; } else if(r.sw>3){ r.mode=1; r.sc=0; r.sw=0; } }
  else if(r.mode===3){ if(r.sw>3){ r.mode=2; r.sc=0; r.sw=0; } }
  r.moved = r.mode!==before ? (r.mode>before?'up':'down') : '';
  PROG.vocab[k]=r; progSave(); return r;
}

// tìm cụm (cho phép biến thể s/es/ing/ed) trong câu -> {idx,len,matched}
function findInEg(eg, en){
  const c=coreOf(en); const parts=c.split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const last=parts.pop();
  const pat=parts.map(p=>p+'\\s+').join('')+last+'(s|es|ing|ed)?';
  try{ const m=eg.match(new RegExp('\\b'+pat+'\\b','i')); if(m) return {idx:m.index,len:m[0].length,matched:m[0]}; }catch(e){}
  return null;
}
// câu ví dụ, in đậm từ đang học + kèm bản dịch tiếng Việt (nếu có)
function egHTML(v){
  const f=findInEg(v.eg,v.en);
  const sent=f?esc(v.eg.slice(0,f.idx))+'<b>'+esc(v.eg.slice(f.idx,f.idx+f.len))+'</b>'+esc(v.eg.slice(f.idx+f.len)):esc(v.eg);
  return '<div class="qz-sent" style="font-size:.92rem;text-align:center;color:var(--muted)">'+sent+'</div>'
    +(v.egVi?'<div class="qz-sent" style="font-size:.86rem;text-align:center;color:var(--muted);font-style:italic">'+esc(v.egVi)+'</div>':'');
}

/* ============ trainer ============ */
let qz={pool:[],order:[],oi:0,cur:null,mode:1,answered:false,done:0,right:0};
function startQuiz(pool){
  qz.pool=pool; if(!qz.pool.length)return;
  qz.order=shuffle(qz.pool.map((_,i)=>i)); qz.oi=0; qz.done=0; qz.right=0;
  $('trainer').classList.remove('hide'); $('listCard').classList.add('hide');
  nextQ();
  try{ $('trainer').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
}
function endQuiz(){ if(synth)synth.cancel(); $('trainer').classList.add('hide'); $('listCard').classList.remove('hide'); renderDash(); renderList(); }
function nextQ(){
  if(qz.oi>=qz.order.length){ qz.order=shuffle(qz.pool.map((_,i)=>i)); qz.oi=0; }
  qz.cur=qz.pool[qz.order[qz.oi]]; qz.oi++;
  const r=vRec(qz.cur.en); let m=r?r.mode:1;
  if(!qz.cur.gap) m=1;                 // từ không tách được chỗ trống -> chỉ chế độ 1
  qz.mode=m; qz.answered=false; renderQ();
}
function distractors(en,n){
  const pool=(VOCAB.length>=n+1?VOCAB:qz.pool).map(v=>v.en).filter(e=>e.toLowerCase()!==en.toLowerCase());
  return shuffle(pool).slice(0,n);
}
function renderQ(){
  const v=qz.cur, m=qz.mode;
  const mname=m===1?'Chế độ 1 · Nghĩa → chọn từ':m===2?'Chế độ 2 · Điền vào câu':'Chế độ 3 · Nghe & gõ';
  let head='<div class="qz-top"><span class="qz-mode">'+mname+'</span>'
    +'<span class="qz-prog">'+levelBadge(v.en)+' · đúng '+qz.right+'/'+qz.done
    +' <button class="fchip" id="qzExit" style="margin-left:6px">Thoát</button></span></div><div id="qzBody"></div>';
  $('trainer').innerHTML=head;
  $('qzExit').onclick=endQuiz;
  const b=$('qzBody');
  if(m===1)mode1(b,v); else if(m===2)mode2(b,v); else mode3(b,v);
}
function optionBox(b, correctEn, v){

  const box=document.createElement('div'); box.className='qz-opts';

  opts.forEach(en=>{
    const row=document.createElement('div'); row.className='qz-optrow';
    const btn=document.createElement('button'); btn.className='qz-opt'; btn.textContent=en;
    const play=document.createElement('button'); play.className='qz-optplay'; play.textContent='🔊';
    play.title='Nghe lại'; play.style.display='none';
    play.onclick=(e)=>{ e.stopPropagation(); say(en); };
    btn.onclick=()=>{
      if(qz.answered)return; qz.answered=true;
      const ok=en.toLowerCase()===correctEn.toLowerCase();
      rows.forEach(r=>{ r.btn.disabled=true; r.play.style.display='';    // hiện nút nghe lại cho mọi đáp án
        if(r.btn.textContent.toLowerCase()===correctEn.toLowerCase())r.btn.classList.add('correct'); });
      if(!ok)btn.classList.add('wrong');
      finish(ok,v);
    };
    row.appendChild(btn); row.appendChild(play); box.appendChild(row);
    rows.push({btn:btn, play:play});
  });
  b.appendChild(box);
  const fb=document.createElement('div'); fb.id='qzFb'; b.appendChild(fb);
}
function mode1(b,v){
  b.innerHTML='<div class="qz-q">Nghĩa tiếng Việt — chọn từ tiếng Anh đúng</div>'
    +'<div class="qz-prompt">'+esc(v.vi)+'</div>';
  optionBox(b, v.en, v);
}
function mode2(b,v){
  const f=findInEg(v.eg,v.en);
  const sent=f?esc(v.eg.slice(0,f.idx))+'<span class="qz-blank">_____</span>'+esc(v.eg.slice(f.idx+f.len)):esc(v.eg);
  b.innerHTML='<div class="qz-q">Điền vào chỗ trống — chọn từ đúng</div>'
    +'<div class="qz-sent">'+sent+'</div><div class="qz-vi">'+esc(v.vi)+'</div>';
  optionBox(b, v.en, v);
}
function mode3(b,v){
  const f=findInEg(v.eg,v.en);
  let hint='';
  if(f){
    const before=v.eg.slice(0,f.idx).trim().split(/\s+/).slice(-4).join(' ');
    const after=v.eg.slice(f.idx+f.len).trim().split(/\s+/).slice(0,4).join(' ');
    hint='<div class="qz-hintwrap"><div class="qz-sent" style="margin:0">'
      +(before?'… '+esc(before)+' ':'')+'<span class="qz-blank">_____</span>'+(after?' '+esc(after)+' …':'')+'</div></div>';
  }
  b.innerHTML='<div class="qz-q">Nghe câu — gõ đúng chính tả từ còn thiếu</div>'
    +'<div style="text-align:center"><button class="qz-play" id="qzPlay">🔊 Nghe lại câu</button></div>'
    +hint+'<div class="qz-vi">'+esc(v.vi)+'</div>'
    +'<div class="qz-inrow"><input class="qz-in" id="qzIn" placeholder="Gõ từ còn thiếu…" autocomplete="off" spellcheck="false">'
    +'<button class="btn" id="qzChk">Kiểm tra</button></div><div id="qzFb"></div>';
  $('qzPlay').onclick=()=>say(v.eg);
  say(v.eg);
  const inp=$('qzIn');
  const submit=()=>{
    if(qz.answered)return; const t=inp.value.trim(); if(!t)return;
    const cand=[v.en, coreOf(v.en)]; if(f)cand.push(f.matched);
    const ok=cand.some(c=>normW(t)===normW(c) || t.toLowerCase().trim()===c.toLowerCase().trim());
    qz.answered=true; inp.className='qz-in '+(ok?'ok':'no'); inp.disabled=true;
    finish(ok,v);
  };
  $('qzChk').onclick=submit;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')submit(); });
  setTimeout(()=>{ try{inp.focus();}catch(e){} },50);
}
function finish(ok,v){
  qz.done++; if(ok)qz.right++;
  say(v.en);                    // tự phát âm đáp án đúng khi hiện đáp án
  const r=vRecord(v.en, ok);
  const moved = r.moved==='up' ? ' <b style="color:var(--green)">▲ lên chế độ '+r.mode+'</b>'
              : r.moved==='down' ? ' <b style="color:var(--accent)">▼ về chế độ '+r.mode+'</b>' : '';
  const fb=$('qzFb');
  fb.innerHTML='<div class="qz-fb '+(ok?'ok':'no')+'">'
      +(ok?'✓ Chính xác!':'✗ Chưa đúng — đáp án: <span class="ans">'+esc(v.en)+'</span>')+'</div>'
    +'<div class="qz-meta"><button class="qz-optplay" id="qzSay" title="Nghe lại đáp án">🔊</button> <b style="color:var(--ink)">'+esc(v.en)+'</b> '+posBadge(v.pos)+' · '+esc(v.ipa||'')+' · '+esc(v.vi)+' · '+levelBadge(v.en)
      +' · đúng '+r.correct+'/'+r.seen+' · chế độ '+r.mode+moved+'</div>'
    +egHTML(v)
    +familyHTML(v.family)
    +'<button class="qz-next" id="qzNext">Tiếp →</button>';
  const _say=$('qzSay'); if(_say)_say.onclick=()=>say(v.en);
  $('qzNext').onclick=nextQ;
  setTimeout(()=>{ try{$('qzNext').focus();}catch(e){} },30);
}

/* ============ danh sách từ ============ */
let filt='all';
function renderList(){
  const f=$('filt'); f.innerHTML='';
  [['all','Tất cả'],['new','Chưa học'],['weak','Yếu (Lv0–2)'],['good','Tốt (Lv3–5)']].forEach(function(p){
    const c=document.createElement('button'); c.className='fchip'+(filt===p[0]?' on':''); c.textContent=p[1];
    c.onclick=()=>{ filt=p[0]; renderList(); }; f.appendChild(c);
  });
  const wl=$('wl'); wl.innerHTML='';
  VOCAB.filter(v=>{ const l=vLevel(v.en);
    return filt==='all'||(filt==='new'&&l<0)||(filt==='weak'&&l>=0&&l<=2)||(filt==='good'&&l>=3);
  }).forEach(v=>{
    const r=vRec(v.en);
    const row=document.createElement('div'); row.className='wrow';
    row.innerHTML='<span class="wen">'+esc(v.en)+'</span>'+posBadge(v.pos)+'<span class="wipa">'+esc(v.ipa||'')+'</span>'
      +'<span class="wvi">'+esc(v.vi)+'</span>'+levelBadge(v.en)
      +'<span class="wstat">'+(r?('đúng '+r.correct+'/'+r.seen+' · M'+r.mode):'—')+'</span>';
    const p=document.createElement('button'); p.className='wplay'; p.textContent='🔊'; p.onclick=()=>say(v.en);
    row.appendChild(p); wl.appendChild(row);
  });
  if(!wl.children.length) wl.innerHTML='<div class="qz-vi">Không có từ nào trong nhóm này.</div>';
}

>which</b> ở đây sẽ thiếu giới từ (which we met <i>in</i>).","fixed":true},{"s":"I still remember the day ___ we moved to this city.","a":"when","o":["when","where","who","whose"],"src":"Tự soạn","vi":"Tôi vẫn nhớ cái ngày chúng tôi chuyển đến thành phố này.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>when</b> thay cho <b>thời gian</b> (the day). <b>where</b> dùng cho nơi chốn, <b>who</b> cho người.","fixed":true},{"s":"It is the best film ___ I have ever seen.","a":"that","o":["that","who","where","whose"],"src":"Tự soạn","vi":"Đó là bộ phim hay nhất mà tôi từng xem.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"Sau <b>so sánh nhất</b> (the best) người ta dùng <b>that</b>, không dùng which. <b>who</b> chỉ dùng cho người.","fixed":true},{"s":"The man ___ car was stolen called the police.","a":"whose","o":["whose","who","which","that"],"src":"Tự soạn","vi":"Người đàn ông bị mất trộm xe đã gọi cảnh sát.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>whose</b> chỉ <b>sở hữu</b> và đi liền trước danh từ (whose car). Nếu dùng <b>who</b> thì phải theo sau là động từ.","fixed":true},{"s":"She works for a company ___ produces solar panels.","a":"which","o":["which","who","whose","where"],"src":"Tự soạn","vi":"Cô ấy làm cho một công ty sản xuất tấm pin mặt trời.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>which</b> thay cho <b>vật/tổ chức</b> (a company) và làm chủ ngữ cho động từ produces. <b>who</b> chỉ dùng cho người.","fixed":true},{"s":"Do you know the reason ___ he left so early?","a":"why","o":["why","who","which","whose"],"src":"Tự soạn","vi":"Bạn có biết lý do vì sao anh ấy về sớm vậy không?","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>why</b> đi sau <b>the reason</b> để nêu nguyên nhân. Các đại từ quan hệ khác không dùng cho \"lý do\".","fixed":true},{"s":"That is the hotel ___ we stayed last summer.","a":"where","o":["where","which","who","that"],"src":"Tự soạn","vi":"Đó là khách sạn nơi chúng tôi đã ở vào mùa hè năm ngoái.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>where</b> = \"nơi mà\", thay cho địa điểm. Dùng <b>which/that</b> thì phải có giới từ (which we stayed <i>at</i>).","fixed":true},{"s":"Everything ___ he said was completely true.","a":"that","o":["that","who","what","whose"],"src":"Tự soạn","vi":"Mọi điều anh ấy nói đều hoàn toàn đúng.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"Sau <b>everything / all / something</b> dùng <b>that</b>. <b>what</b> không dùng làm đại từ quan hệ sau danh từ.","fixed":true},{"s":"The students ___ finished early may leave the room.","a":"who","o":["who","which","whose","where"],"src":"Tự soạn","vi":"Những học sinh làm xong sớm có thể rời phòng.","gp":"Mệnh đề quan hệ — đại từ quan hệ đứng ngay sau danh từ và thay cho danh từ đó.","why":"<b>who</b> thay cho <b>người</b> (the students) và làm chủ ngữ cho động từ finished.","fixed":true}]},{"h":"2. Câu nối lý do — because / since / as","rule":"Luôn thêm <b>lý do</b> sau ý chính, giám khảo chấm rất cao. <b>since</b> nghe học thuật hơn <b>because</b>.","egs":[{"s":"Woman: Oh, that's <b>because you</b> are boring!","src":"Listening"},{"s":"Saturday is out <b>because I</b>'ve got a family event.","src":"Listening"},{"s":"I love it <b>because I</b> can see many beautiful locations.","src":"Reading"},{"s":"I felt really nervous<b>, since I</b> had to redo everything.","src":"Writing"}],"quiz":[{"s":"Oh, that's ___ you are boring!","a":"because","o":["because","although","however","therefore"],"src":"Listening","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"Chọn <b>because</b> vì phần sau nêu <b>lý do</b> cho ý phía trước (because = since, since nghe học t ":"Anh ấy đến muộn vì giao thông quá tệ.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>because</b> + mệnh đề nêu lý do. <b>despite</b> ngược nghĩa; <b>however/therefore</b> sai ngữ pháp ở vị trí này.","fixed":true},{"s":"I could not attend ___ of a family emergency.","a":"because","o":["because","since","although","due"],"src":"Tự soạn","vi":"Tôi không thể tham dự vì có việc gia đình khẩn cấp.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"Chỉ <b>because of</b> mới ghép được với \"of\". <b>due</b> cần \"to\" chứ không phải \"of\".","fixed":true},{"s":"___ she had studied hard, she passed the exam easily.","a":"Since","o":["Since","Despite","However","Whereas"],"src":"Tự soạn","vi":"Vì đã học chăm chỉ nên cô ấy vượt qua kỳ thi dễ dàng.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>Since</b> đầu câu = \"vì\". <b>Despite</b> cần danh từ và ngược nghĩa; <b>Whereas</b> chỉ sự đối lập.","fixed":true},{"s":"The shop closed early ___ to the power cut.","a":"due","o":["due","because","since","as"],"src":"Tự soạn","vi":"Cửa hàng đóng cửa sớm do mất điện.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>due to</b> + danh từ (the power cut). Các liên từ còn lại không kết hợp với \"to\".","fixed":true},{"s":"We took the train ___ the roads were flooded.","a":"because","o":["because","despite","therefore","however"],"src":"Tự soạn","vi":"Chúng tôi đi tàu vì đường bị ngập.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>because</b> nối mệnh đề chỉ lý do. <b>therefore/however</b> là trạng từ nối, không dùng giữa câu như vậy.","fixed":true},{"s":"___ of his hard work, he got a promotion.","a":"Because","o":["Because","Although","However","Whereas"],"src":"Tự soạn","vi":"Nhờ làm việc chăm chỉ, anh ấy được thăng chức.","gp":"Liên từ chỉ lý do — nối mệnh đề chính với mệnh đề nêu nguyên nhân.","why":"<b>  kết quả, không phải tương phản.","vi":"Tuy nhiên, tàu hoả thì không bao giờ bị kẹt trong dòng xe đông."},{"s":"___, in tennis you rely only on your own skill.","a":"However","o":["However","Because","Therefore","So"],"src":"Speaking","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, trong quần vợt bạn chỉ dựa vào kỹ năng của chính mình."},{"s":"___, a good story matters more than the language.","a":"However","o":["However","Because","Therefore","So"],"src":"Writing","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, một câu chuyện hay quan trọng hơn ngôn ngữ."},{"s":"___, I want to discuss this with my friend first.","a":"However","o":["However","Because","Therefore","So"],"src":"Listening","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, tôi muốn bàn chuyện này với bạn tôi trước đã."},{"s":"___, I got distracted by dirty laundry and dishes.","a":"However","o":["However","Because","Therefore","So"],"src":"Listening","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, tôi bị phân tâm bởi đống đồ bẩn và chén đĩa."},{"s":"___, the most attractive part of all is the words.","a":"However","o":["However","Because","Therefore","So"],"src":"Listening","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>becau u phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, ở môn nhảy cao thì mọi thứ phụ thuộc vào một mình bạn."},{"s":"___, I ended up feeling bored while watching the film.","a":"However","o":["However","Because","Therefore","So"],"src":"Reading","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, rốt cuộc tôi lại thấy chán khi xem bộ phim đó."},{"s":"___, now that I'm retired, my preferences have changed.","a":"However","o":["However","Because","Therefore","So"],"src":"Reading","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu + dấu phẩy</b>, tương phản với câu ngay trước. <b>because</b>/<b>therefore</b>/<b>so</b> diễn tả nguyên nhân – kết quả, không phải tương phản.","vi":"Tuy nhiên, giờ tôi đã nghỉ hưu nên sở thích của tôi đã thay đổi."},{"s":"___ the high price, the phone sells very well.","a":"Despite","o":["Despite","Although","Because","Therefore"],"src":"Tự soạn","vi":"Dù giá cao, chiếc điện thoại vẫn bán rất chạy.","gp":"Từ nối chỉ tương phản.","why":"<b>Despite</b> + <b>danh từ</b> (the high price). Nếu muốn dùng <b>Although</b> thì phải theo sau là mệnh đề (Although it is expensive…).","fixed":true},{"s":"___ it was raining, we went for a walk.","a":"Although","o":["Although","Despite","Because","Therefore"],"src":"Tự soạn","vi":"Mặc dù trời mưa, chúng tôi vẫn đi dạo.","gp":"Từ nối chỉ tương phản.","why":"<b>Although</b> + <b>mệnh đề</b> (it was raining). <b>Despite</b> phải đi với danh từ hoặc V-ing.","fixed":true},{"s":"The film was very long, ___ I enjoyed every minute.","a":"but","o":["but","so","because","therefore"],"src":"Tự soạn","vi":"Bộ phim rất dài, nhưng tôi thích từng phút một.","gp":"Từ nối chỉ tương phản.","why":"<b>but</b> nối hai mệnh đề <b>trái ngược</b>. <b>so/therefore</b> chỉ kết quả; <b>because</b> chỉ nguyên nhân.","fixed":true},{"s":"My brother likes football, ___ I prefer swimming.","a":"whereas","o":["whereas","because","so","therefore"],"src":"Tự soạn","vi":"Anh trai tôi thích bóng đá, còn tôi thì thích bơi hơn.","gp":"Từ nối chỉ tương phản.","why":"<b>whereas</b> = \"trong khi đó\", dùng để <b>so sánh đối lập</b> hai vế.","fixed":true},{"s":"In ___ of the traffic, we arrived on time.","a":"spite","o":["spite","despite","although","however"],"src":"Tự soạn","vi":"Bất chấp giao thông đông đúc, chúng tôi vẫn đến đúng giờ.","gp":"Từ nối chỉ tương phản.","why":"Cụm cố định là <b>in spite of</b> + danh từ. Không nói \"in despite of\"; <b>although</b> đi với mệnh đề.","fixed":true},{"s":"He is very rich. ___, he lives very simply.","a":"However","o":["However","Because","Therefore","So"],"src":"Tự soạn","vi":"Ông ấy rất giàu. Tuy nhiên, ông sống rất giản dị.","gp":"Từ nối chỉ tương phản.","why":"<b>However</b> đứng <b>đầu câu mới + dấu phẩy</b>, tương phản với câu trước. <b>Therefore/So</b> chỉ kết quả.","fixed":true},{"s":"___ being tired, she finished the report on time.","a":"Despite","o":["Despite","Although","Because","However"],"src":"Tự soạn","vi":"Dù mệt, cô ấy vẫn hoàn thành báo cáo đúng hạn.","gp":"Từ nối chỉ tương phản.","why":"<b>Despite</b> + <b>V-ing</b> (being tired). <b>Although</b> cần mệnh đề đầy đủ (Although she was tired…).","fixed":true},{"s":"The hotel was cheap, ___ the service was excellent.","a":"but","o":["but","so","because","therefore"],"src":"Tự soạn","vi":"Khách sạn rẻ, nhưng dịch vụ lại tuyệt vời.","gp":"Từ nối chỉ tương phản.","why":"<b>but</b> nối hai ý trái chiều (rẻ ↔ dịch vụ tốt).","fixed":true},{"s":"___ he studied very hard, he did not pass the test.","a":"Although","o":["Although","Despite","Because","So"],"src":"Tự soạn","vi":"Mặc dù đã học rất chăm, anh ấy vẫn không qua bài kiểm tra.","gp":"Từ nối chỉ tương phản.","why":"<b>Although</b> + mệnh đề, nghĩa \"mặc dù\" ":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Con chim trở nên năng động hơn nhiều so với bình thường."},{"s":"It's not more of a textbook ___ a biography.","a":"than","o":["than","as","then","from"],"src":"Listening","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Nó không giống sách giáo khoa hơn là một cuốn tiểu sử."},{"s":"It's older ___ many famous cities in the world!","a":"than","o":["than","as","then","from"],"src":"Listening","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Nó còn cổ hơn nhiều thành phố nổi tiếng trên thế giới!"},{"s":"There's nothing better ___ running by the seaside.","a":"than","o":["than","as","then","from"],"src":"Listening","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Không gì tuyệt hơn việc chạy bộ bên bờ biển."},{"s":"However, a good story matters more ___ the language.","a":"than","o":["than","as","then","from"],"src":"Writing","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Tuy nhiên, một câu chuyện hay quan trọng hơn ngôn ngữ."},{"s":"Looking back, now I use the program faster ___ before.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Nhìn lại, giờ tôi dùng phần mềm đó nhanh hơn trước."},{"s":"It was definitely better on the page ___ on the screen.","a":"than","o":["than","as","then","from"],"src":"Reading","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Đọc trên giấy chắc chắn hay hơn xem trên màn hình."},{"s":"It's definitely not more of a textbook ___ a biography.","a":"than","o":["than","as","then","from"],"src":"Listening","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Nó chắc chắn không giống sách giáo khoa hơn là một cuốn tiểu sử."},{"s":"That's why I prefer eating with others rather ___ alone.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Đó là lý do tôi thích ăn cùng người khác hơn là ăn một mình."},{"s":"In the end, I went home feeling much happier ___ before.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Cuối cùng, tôi về nhà với tâm trạng vui hơn nhiều so với trước đó."},{"s":"My speech lasted about 15 minutes, shorter ___ expected.","a":"than","o":["than","as","then","from"],"src":"Listening","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Bài nói của tôi kéo dài khoảng 15 phút, ngắn hơn dự kiến."},{"s":"Looking back, I enjoy these small trips more ___ long ones.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Nhìn lại, tôi thích những chuyến đi ngắn này hơn những chuyến dài."},{"s":"It can become more about marketing ___ genuine improvement.","a":"than","o":["than","as","then","from"],"src":"Listening","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Nó có thể thiên về tiếp thị hơn là cải tiến thực sự."},{"s":"Though I believe that it happens more quickly ___ we think.","a":"than","o":["than","as","then","from"],"src":"Listening","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Dù vậy tôi tin điều đó xảy ra nhanh hơn ta tưởng."},{"s":"On top of that, it is better for the environment ___ flying.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Hơn nữa, nó tốt cho môi trường hơn là đi máy bay."},{"s":"On top of that, it is cheaper ___ flying for short distances.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Hơn nữa, nó rẻ hơn đi máy bay với quãng đường ngắn."},{"s":"First of all, it is cheaper ___ driving your own car every day.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Trước hết, nó rẻ hơn việc lái xe riêng mỗi ngày."},{"s":"That's why I think playing together is better ___ playing alone.","a":"than","o":["than","as","then","from"],"src":"Speaking","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Sau tính từ so sánh hơn bắt buộc có <b>than</b> để nêu vế được đem ra so sánh. <b>as</b> chỉ dùng trong cấu trúc so sánh bằng \"as … as\"; <b>then</b> nghĩa \"sau đó\"; <b>from</b> nghĩa \"từ\".","vi":"Đó là lý do tôi nghĩ chơi cùng nhau tốt hơn chơi một mình."},{"s":"This is ___ film I have ever seen.","a":"the best","o":["the best","better","best","the better"],"src":"Tự soạn","vi":"Đây là bộ phim hay nhất mà tôi từng xem.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"So sánh nhất phải có <b>the</b>: <b>the best</b>. <b>better</b> là so sánh hơn (cần \"than\").","fixed":true},{"s":"She is as tall ___ her brother.","a":"as","o":["as","than","so","like"],"src":"Tự soạn","vi":"Cô ấy cao bằng anh trai mình.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Cấu trúc so sánh bằng là <b>as + tính từ + as</b>. <b>than</b> chỉ dùng cho so sánh hơn.","fixed":true},{"s":"My new phone is ___ than the old one.","a":"better","o":["better","gooder","best","more good"],"src":"Tự soạn","vi":"Điện thoại mới của tôi tốt hơn cái cũ.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"<b>good</b> là bất quy tắc: so sánh hơn là <b>better</b> (không có \"gooder\"/\"more good\").","fixed":true},{"s":"This restaurant is ___ expensive in town.","a":"the most","o":["the most","most","more","much"],"src":"Tự soạn","vi":"Nhà hàng này đắt nhất thị trấn.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Tính từ dài ở so sánh nhất: <b>the most</b> + tính từ. Thiếu \"the\" là sai.","fixed":true},{"s":"The traffic today is ___ than yesterday.","a":"worse","o":["worse","worst","badder","more bad"],"src":"Tự soạn","vi":"Giao thông hôm nay tệ hơn hôm qua.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"<b>bad</b> bất quy tắc: so sánh hơn là <b>worse</b>, so sánh nhất là \"the worst\".","fixed":true},{"s":"My bag is the same ___ yours.","a":"as","o":["as","than","like","with"],"src":"Tự soạn","vi":"Túi của tôi giống hệt túi của bạn.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Cụm cố định <b>the same as</b> = \"giống như\".","fixed":true},{"s":"He runs ___ faster than I do.","a":"much","o":["much","very","too","so"],"src":"Tự soạn","vi":"Anh ấy chạy nhanh hơn tôi nhiều.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Để nhấn mạnh so sánh hơn dùng <b>much/far/a lot</b> + so sánh hơn. Không dùng <b>very</b> trước dạng so sánh hơn.","fixed":true},{"s":"It was ___ day of my life.","a":"the happiest","o":["the happiest","happiest","more happy","the more happy"],"src":"Tự soạn","vi":"Đó là ngày hạnh phúc nhất đời tôi.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Tính từ ngắn ở so sánh nhất: <b>the + tính từ + -est</b> (the happiest).","fixed":true},{"s":"This book is not as interesting ___ the last one.","a":"as","o":["as","than","so","like"],"src":"Tự soạn","vi":"Cuốn sách này không thú vị bằng cuốn trước.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"Dạng phủ định của so sánh bằng vẫn giữ <b>as … as</b>.","fixed":true},{"s":"Of the three routes, this one is ___.","a":"the shortest","o":["the shortest","shorter","shortest","more short"],"src":"Tự soạn","vi":"Trong ba tuyến đường, tuyến này ngắn nhất.","gp":"So sánh hơn — tính từ so sánh (-er / more…) + than.","why":"So sánh nhất trong nhóm ≥3 → <b>the shortest</b> (phải có \"the\").","fixed":true}]},{"h":"8. Động từ khuyết thiếu — should / can / would / must","rule":"<b>should</b> = nên (đề xuất) · <b>can/could</b> = có thể · <b>would</b> = sẽ (giả định, lịch sự) · <b>must</b> = phải. Sau chúng luôn là <b>động từ nguyên mẫu</b>.","egs":[{"s":"What <b>can we</b> do to help him?","src":"Listening"},{"s":"Is there anything that I <b>could do</b>?","src":"Listening"},{"s":"It <b>would help</b> us keep training safely.","src":"Writing"},{"s":"It <b>would help</b> more people still visit.","src":"Writing"}],"quiz":[{"s":"You ___ wear a helmet — it is the law here.","a":"must","o":["must","might","could","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh diễn tả <b>bắt buộc</b> hoặc suy đoán chắc chắn. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn phải đội mũ bảo hiểm — ở đây đó là luật."},{"s":"It looks cloudy, so it ___ rain this afternoon.","a":"might","o":["might","must","should","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>might</b> vì ngữ cảnh chỉ <b>khả năng không chắc chắn</b> (\"có thể\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Trời có vẻ nhiều mây, nên chiều nay có thể mưa."},{"s":"___ you help me carry these boxes, please?","a":"Could","o":["Could","Must","Should","Would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>Could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn giúp tôi khiêng mấy cái hộp này được không?"},{"s":"You ___ eat so much fast food — it is bad for your health.","a":"shouldn’t","o":["shouldn’t","mustn’t","couldn’t","wouldn’t"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>shouldn’t</b> vì ngữ cảnh phù hợp nhất với nghĩa của câu. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn không nên ăn quá nhiều đồ ăn nhanh — nó có hại cho sức khoẻ."},{"s":"I ___ swim when I was five years old.","a":"could","o":["could","must","should","might"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Tôi đã biết bơi từ khi năm tuổi."},{"s":"Students ___ not use their phones during the exam.","a":"must","o":["must","might","would","could"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh diễn tả <b>bắt buộc</b> hoặc suy đoán chắc chắn. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Học sinh không được dùng điện thoại trong giờ thi."},{"s":"If you feel stressed, you ___ try exercising regularly.","a":"should","o":["should","must","might","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>should</b> vì ngữ cảnh đưa ra <b>lời khuyên</b> (\"nên\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Nếu thấy căng thẳng, bạn nên thử tập thể dục đều đặn."},{"s":"She speaks four languages, so she ___ be very talented.","a":"must","o":["must","should","might","could"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh diễn tả <b>bắt buộc</b> hoặc suy đoán chắc chắn. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Cô ấy nói được bốn thứ tiếng, nên hẳn là rất có năng khiếu."},{"s":"___ I open the window? It is very warm in here.","a":"Shall","o":["Shall","Must","Would","Should"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>Shall</b> vì ngữ cảnh dùng khi <b>đề nghị</b> (\"Shall I…?\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Tôi mở cửa sổ nhé? Trong này nóng quá."},{"s":"We ___ finish the report before Friday — the deadline is fixed.","a":"must","o":["must","might","could","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh diễn tả <b>bắt buộc</b> hoặc suy đoán chắc chắn. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Chúng ta phải hoàn thành báo cáo trước thứ Sáu — hạn chót đã cố định."},{"s":"I am not sure, but the meeting ___ start at nine.","a":"might","o":["might","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>might</b> vì ngữ cảnh chỉ <b>khả năng không chắc chắn</b> (\"có thể\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Tôi không chắc, nhưng cuộc họp có thể bắt đầu lúc chín giờ."},{"s":"You ___ book a ticket in advance if you want a good seat.","a":"should","o":["should","must","might","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>should</b> vì ngữ cảnh đưa ra <b>lời khuyên</b> (\"nên\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn nên đặt vé trước nếu muốn có chỗ ngồi tốt."},{"s":"He ___ not come to the party because he was ill.","a":"could","o":["could","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Anh ấy đã không thể đến bữa tiệc vì bị ốm."},{"s":"___ you like a cup of tea?","a":"Would","o":["Would","Must","Should","Might"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>Would</b> vì ngữ cảnh dùng cho <b>giả định</b> hoặc lời mời lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn có muốn dùng một tách trà không?"},{"s":"Visitors ___ not take photographs inside the museum.","a":"must","o":["must","might","would","could"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>must</b> vì ngữ cảnh diễn tả <b>bắt buộc</b> hoặc suy đoán chắc chắn. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Khách tham quan không được chụp ảnh bên trong bảo tàng."},{"s":"If I had more free time, I ___ learn another language.","a":"would","o":["would","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>would</b> vì ngữ cảnh dùng cho <b>giả định</b> hoặc lời mời lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Nếu có nhiều thời gian rảnh hơn, tôi sẽ học thêm một ngoại ngữ."},{"s":"You ___ ask a colleague if you do not understand the task.","a":"can","o":["can","must","might","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>can</b> vì ngữ cảnh chỉ <b>khả năng / được phép</b> ở hiện tại. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Bạn có thể hỏi đồng nghiệp nếu không hiểu nhiệm vụ."},{"s":"It is a good film — you ___ watch it this weekend.","a":"should","o":["should","must","might","would"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>should</b> vì ngữ cảnh đưa ra <b>lời khuyên</b> (\"nên\"). Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Đó là một bộ phim hay — bạn nên xem nó vào cuối tuần này."},{"s":"Sorry, I ___ not hear you — the room was too noisy.","a":"could","o":["could","must","should","shall"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>could</b> vì ngữ cảnh chỉ <b>khả năng trong quá khứ</b> hoặc đề nghị lịch sự. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Xin lỗi, tôi đã không nghe rõ bạn nói — phòng ồn quá."},{"s":"We ___ save money by cooking at home instead of eating out.","a":"can","o":["can","must","shall","might"],"src":"Tự soạn","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Chọn <b>can</b> vì ngữ cảnh chỉ <b>khả năng / được phép</b> ở hiện tại. Các modal còn lại đúng ngữ pháp nhưng <b>sai nghĩa</b> trong tình huống này.","vi":"Chúng ta có thể tiết kiệm tiền bằng cách nấu ăn ở nhà thay vì ăn ngoài."},{"s":"You ___ to wear a uniform at this school.","a":"have","o":["have","must","should","can"],"src":"Tự soạn","vi":"Bạn phải mặc đồng phục ở trường này.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>have to</b> = \"phải\" (quy định bên ngoài). <b>must/should/can</b> <u>không</u> đi kèm \"to\".","fixed":true},{"s":"We ___ not have to pay — entry is free.","a":"do","o":["do","must","should","can"],"src":"Tự soạn","vi":"Chúng ta không phải trả tiền — vào cửa miễn phí.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Phủ định của \"have to\" là <b>do not have to</b> = \"không cần phải\". (Khác \"must not\" = \"cấm\".)","fixed":true},{"s":"___ I use your phone for a moment?","a":"May","o":["May","Must","Should","Would"],"src":"Tự soạn","vi":"Tôi dùng nhờ điện thoại của bạn một lát được không?","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>May I…?</b> = xin phép một cách lịch sự. <b>Must/Should</b> không dùng để xin phép.","fixed":true},{"s":"You ___ to check the timetable before you leave.","a":"ought","o":["ought","must","should","can"],"src":"Tự soạn","vi":"Bạn nên kiểm tra lịch trình trước khi đi.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>ought to</b> = \"nên\" (giống should) — đây là modal <u>duy nhất</u> đi kèm \"to\".","fixed":true},{"s":"I ___ to play football every weekend when I was young.","a":"used","o":["used","use","using","am used"],"src":"Tự soạn","vi":"Hồi trẻ tôi thường chơi bóng đá mỗi cuối tuần.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>used to</b> + nguyên mẫu = thói quen <b>trong quá khứ</b> nay không còn.","fixed":true},{"s":"Students ___ to submit the assignment by Friday.","a":"have","o":["have","must","should","can"],"src":"Tự soạn","vi":"Sinh viên phải nộp bài trước thứ Sáu.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>have to</b> = bắt buộc theo quy định. Các modal khác không đi với \"to\".","fixed":true},{"s":"She ___ be at work — her car is outside.","a":"must","o":["must","should","might","would"],"src":"Tự soạn","vi":"Chắc chắn cô ấy đang ở chỗ làm — xe của cô ấy đậu ngoài kia.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>must</b> ở đây là <b>suy đoán chắc chắn</b> (\"hẳn là\") dựa trên bằng chứng.","fixed":true},{"s":"You ___ not have to come if you are busy.","a":"do","o":["do","must","should","can"],"src":"Tự soạn","vi":"Bạn không cần phải đến nếu đang bận.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>do not have to</b> = \"không cần\". Nếu dùng \"must not\" thì thành \"cấm đến\" — sai nghĩa.","fixed":true},{"s":"___ you mind opening the window?","a":"Would","o":["Would","Should","Must","May"],"src":"Tự soạn","vi":"Bạn có phiền mở giúp cửa sổ không?","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"Cụm cố định <b>Would you mind + V-ing?</b> để nhờ vả lịch sự.","fixed":true},{"s":"He ___ to walk to school every day as a child.","a":"used","o":["used","use","uses","using"],"src":"Tự soạn","vi":"Hồi nhỏ anh ấy thường đi bộ đến trường mỗi ngày.","gp":"Động từ khuyết thiếu (modal) — theo sau luôn là động từ nguyên mẫu, không chia.","why":"<b>used to</b> + nguyên mẫu diễn tả thói quen đã chấm dứt trong quá khứ.","fixed":true}]},{"h":"9. Nêu ý kiến & đề xuất (cụm cố định)","rule":"Học thuộc nguyên cụm — dùng được cho <b>Speaking Part 4</b> và <b>Writing Q3/Q4</b>.","egs":[{"s":"Still, <b>I believe</b> it was very worthwhile.","src":"Reading"},{"s":"<b>I partly agree</b> that this is a good thing.","src":"Writing"},{"s":"<b>To be honest</b>, I prefer reading science books.","src":"Writing"},{"s":"<b>To be honest</b>, I wish I hadn't wasted my money!","src":"Reading"}],"quiz":[{"s":"In my ___, the countryside is more peaceful than the city.","a":"opinion","o":["opinion","idea","mind","thought"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>opinion</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Theo tôi, vùng quê yên bình hơn thành phố."},{"s":"To be ___, I prefer reading books late in the evening.","a":"honest","o":["honest","true","real","sure"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>honest</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Thành thật mà nói, tôi thích đọc sách vào buổi tối muộn."},{"s":"I completely ___ with your idea about the new website.","a":"agree","o":["agree","accept","approve","admit"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>agree</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi hoàn toàn đồng ý với ý tưởng của bạn về trang web mới."},{"s":"I ___ organising a friendly competition for young members.","a":"suggest","o":["suggest","say","tell","talk"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>suggest</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi đề xuất tổ chức một cuộc thi thân thiện cho các thành viên trẻ."},{"s":"I partly ___ with this opinion, but there is another side.","a":"agree","o":["agree","accept","approve","admit"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>agree</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi đồng ý một phần với ý kiến này, nhưng còn một mặt khác nữa."},{"s":"From my point of ___, technology makes our lives easier.","a":"view","o":["view","opinion","idea","side"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>view</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Theo quan điểm của tôi, công nghệ làm cuộc sống của chúng ta dễ dàng hơn."},{"s":"As ___ as I am concerned, street food is part of local culture.","a":"far","o":["far","long","much","soon"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>far</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Theo như tôi thấy, đồ ăn vỉa hè là một phần của văn hoá địa phương."},{"s":"I ___ that learning a new skill takes time and patience.","a":"believe","o":["believe","trust","hope","wish"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>believe</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi tin rằng học một kỹ năng mới cần thời gian và sự kiên nhẫn."},{"s":"Personally ___, I think the club should promote events online.","a":"speaking","o":["speaking","saying","telling","talking"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>speaking</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Nói riêng cá nhân tôi, tôi nghĩ câu lạc bộ nên quảng bá sự kiện trực tuyến."},{"s":"It seems ___ me that the fee is too high for students.","a":"to","o":["to","for","at","on"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>to</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Với tôi thì có vẻ mức phí đó quá cao đối với sinh viên."},{"s":"I would ___ that we invite a popular local speaker.","a":"suggest","o":["suggest","tell","say","talk"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>suggest</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi xin đề xuất rằng chúng ta mời một diễn giả địa phương nổi tiếng."},{"s":"In my ___, a healthy meal is better than fast food.","a":"view","o":["view","idea","mind","thought"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>view</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Theo tôi, một bữa ăn lành mạnh tốt hơn đồ ăn nhanh."},{"s":"I am ___ that this plan will attract more young members.","a":"convinced","o":["convinced","agreed","decided","suggested"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>convinced</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi tin chắc rằng kế hoạch này sẽ thu hút thêm nhiều thành viên trẻ."},{"s":"There is no ___ that exercising regularly reduces stress.","a":"doubt","o":["doubt","question","idea","opinion"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>doubt</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Không nghi ngờ gì việc tập thể dục đều đặn giúp giảm căng thẳng."},{"s":"I ___ strongly that museums should stay free for students.","a":"feel","o":["feel","think","say","tell"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>feel</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi thấy rất rõ rằng bảo tàng nên miễn phí cho sinh viên."},{"s":"If you ___ me, the cafe is more useful than the shop.","a":"ask","o":["ask","tell","say","talk"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>ask</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Nếu hỏi tôi thì quán cà phê hữu ích hơn cửa hàng."},{"s":"I would ___ to share a few thoughts about the new plan.","a":"like","o":["like","want","wish","hope"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>like</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Tôi muốn chia sẻ một vài suy nghĩ về kế hoạch mới."},{"s":"On the ___ hand, online shopping is much more convenient.","a":"one","o":["one","first","other","another"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>one</b>. Đây là <b>cụm cố định</b>, không thay từ khác được dù nghĩa gần giống — thay từ là sai chuẩn tiếng Anh.","vi":"Một mặt, mua sắm trực tuyến tiện lợi hơn nhiều."},{"s":"On the other ___, a real camera still takes better photos.","a":"hand","o":["hand","side","way","part"],"src":"Tự soạn","gp":"Cụm cố định (collocation) dùng để nêu ý kiến — phải thuộc nguyên cụm.","why":"Cụm đúng là <b>hand</b>. Đây là <b>cụm c ứ phân từ (V3)</b> của break là <b>broken</b>, không phải \"broke\".","fixed":true},{"s":"Our office is ___ near the train station.","a":"located","o":["located","locating","locate","locates"],"src":"Tự soạn","vi":"Văn phòng của chúng tôi nằm gần nhà ga.","gp":"Câu bị động — be + V3, dùng khi chủ ngữ chịu tác động hoặc không cần nêu ai làm.","why":"<b>be located</b> = \"toạ lạc, nằm ở\" — dạng bị động cố định.","fixed":true}]},{"h":"15. Lượng từ — many / much / a lot of / a few","rule":"<b>many + đếm được</b> · <b>much + không đếm được</b> · <b>a lot of</b> dùng cho cả hai · <b>a few</b> = một vài · <b>a little</b> = một chút.","egs":[{"s":"How <b>many people</b> live in the town?","src":"Listening"},{"s":"<b>Many think</b> cars make the air bad.","src":"Listening"},{"s":"Who paid <b>a lot of money</b> on transport?","src":"Reading"},{"s":"For me, cycling has <b>a lot of advantages</b>.","src":"Speaking"}],"quiz":[{"s":"How ___ money do you need for the trip?","a":"much","o":["much","many","a few","a lot"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Bạn cần bao nhiêu tiền cho chuyến đi?"},{"s":"There are ___ interesting places to visit in my town.","a":"many","o":["many","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>many</b> đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Có nhiều nơi thú vị để tham quan trong thị trấn của tôi."},{"s":"I do not have ___ free time this week.","a":"much","o":["much","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Tuần này tôi không có nhiều thời gian rảnh."},{"s":"She has ___ colleagues who work in the city centre.","a":"several","o":["several","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>several</b> = \"vài\", đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Cô ấy có vài đồng nghiệp làm việc ở trung tâm thành phố."},{"s":"We only need ___ information before we decide.","a":"a little","o":["a little","a few","many","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a little</b> = \"một chút\", đi với danh từ <b>KHÔNG đếm được</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Chúng tôi chỉ cần một chút thông tin trước khi quyết định."},{"s":"___ students in my class come from the countryside.","a":"Many","o":["Many","Much","A little","Less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>many</b> đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Nhiều bạn học trong lớp tôi đến từ vùng quê."},{"s":"He drinks too ___ coffee every morning.","a":"much","o":["much","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Anh ấy uống quá nhiều cà phê mỗi sáng."},{"s":"There were only ___ people at the concert last night.","a":"a few","o":["a few","a little","much","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a few</b> = \"một vài\", đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Tối qua chỉ có vài người đến buổi hoà nhạc."},{"s":"I spent ___ time preparing for the presentation.","a":"a lot of","o":["a lot of","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a lot of</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Tôi đã dành rất nhiều thời gian chuẩn bị cho bài thuyết trình."},{"s":"How ___ photographs did you take on the trip?","a":"many","o":["many","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>many</b> đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Bạn đã chụp bao nhiêu tấm ảnh trong chuyến đi?"},{"s":"She gave me ___ useful advice about learning English.","a":"some","o":["some","a few","many","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>some</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Cô ấy cho tôi vài lời khuyên hữu ích về việc học tiếng Anh."},{"s":"There is not ___ noise in the countryside at night.","a":"much","o":["much","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Ở vùng quê ban đêm không có nhiều tiếng ồn."},{"s":"___ of my friends prefer watching films online.","a":"Most","o":["Most","Much","A little","Less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>Most</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Phần lớn bạn bè tôi thích xem phim trực tuyến."},{"s":"We bought ___ vegetables at the local market.","a":"some","o":["some","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>some</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Chúng tôi mua ít rau ở chợ địa phương."},{"s":"I have ___ energy after a good night’s sleep.","a":"plenty of","o":["plenty of","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>plenty of</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Tôi tràn đầy năng lượng sau một giấc ngủ ngon."},{"s":"Only ___ members came to the meeting last Monday.","a":"a few","o":["a few","a little","much","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a few</b> = \"một vài\", đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Chỉ có vài thành viên đến dự họp hôm thứ Hai tuần trước."},{"s":"He does not eat ___ fast food these days.","a":"much","o":["much","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>much</b> đi với danh từ <b>KHÔNG đếm được</b> (money, time, information…). Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Dạo này anh ấy không ăn nhiều đồ ăn nhanh."},{"s":"There are ___ good reasons to exercise regularly.","a":"many","o":["many","much","a little","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>many</b> đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Có nhiều lý do chính đáng để tập thể dục đều đặn."},{"s":"She needs ___ practice before the speaking test.","a":"more","o":["more","many","a few","several"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>more</b> phù hợp với danh từ đi sau và nghĩa của câu. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Cô ấy cần luyện tập nhiều hơn trước kỳ thi nói."},{"s":"I only had ___ minutes to finish the last question.","a":"a few","o":["a few","a little","much","less"],"src":"Tự soạn","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>a few</b> = \"một vài\", đi với danh từ <b>đếm được số nhiều</b>. Các lựa chọn còn lại sai vì <b>không khớp tính đếm được</b> của danh từ đi sau.","vi":"Tôi chỉ còn vài phút để làm nốt câu cuối."},{"s":"There is not ___ milk left in the fridge.","a":"any","o":["any","some","many","a few"],"src":"Tự soạn","vi":"Trong tủ lạnh không còn chút sữa nào.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"Câu <b>phủ định</b> dùng <b>any</b>. <b>some</b> chủ yếu dùng trong câu khẳng định.","fixed":true},{"s":"Would you like ___ coffee?","a":"some","o":["some","any","many","a few"],"src":"Tự soạn","vi":"Bạn có muốn dùng chút cà phê không?","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"Trong <b>lời mời/đề nghị</b> vẫn dùng <b>some</b> dù là câu hỏi.","fixed":true},{"s":"We do not have ___ chairs for everyone.","a":"enough","o":["enough","too","very","much"],"src":"Tự soạn","vi":"Chúng ta không có đủ ghế cho mọi người.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>enough</b> = \"đủ\", đứng <b>trước danh từ</b> (enough chairs).","fixed":true},{"s":"This soup is ___ salty for me.","a":"too","o":["too","enough","very much","many"],"src":"Tự soạn","vi":"Món súp này mặn quá với tôi.","gp":"Lượng từ — chọn theo danh từ đếm được hay không đếm được.","why":"<b>too</ :"16. There is / There are","rule":"Giới thiệu <b>sự tồn tại</b>. <b>There is</b> + số ít / không đếm được · <b>There are</b> + số nhiều.","egs":[{"s":"Well, <b>there are</b> a few things you can do.","src":"Listening"},{"s":"<b>There are</b> several types of vegetarian diets.","src":"Reading"},{"s":"<b>There is</b> no one to share so the cost is high.","src":"Reading"},{"s":"<b>There are</b> a few things you can do to save money.","src":"Listening"}],"quiz":[{"s":"However, there ___ a small issue.","a":"is","o":["is","are","was","be"],"src":"Listening","gp":"Cấu trúc There is / There are — giới thiệu sự tồn tại.","why":"Chọn <b>is</b>: dùng <b>is/was</b> khi danh từ theo sau <b>số ít hoặc không đếm được</b>, <b>are/were</b> khi <b>số nhiều</b>; chọn thì hiện tại hay quá khứ theo ngữ cảnh câu. <b>be</b> (nguyên mẫu) không dùng ở vị trí này.","vi":"Tuy nhiên, có một vấn đề nhỏ."},{"s":"However, there ___ also some risks.","a":"are","o":["are","is","was","be"],"src":"Reading","gp":"Cấu trúc There is / There are — giới thiệu sự tồn tại.","why":"Chọn <b>are</b>: dùng <b>is/was</b> khi danh từ theo sau <b>số ít hoặc không đếm được</b>, <b>are/were</b> khi <b>số nhiều</b>; chọn thì hiện tại hay quá khứ theo ngữ cảnh câu. <b>be</b> (nguyên mẫu) không dùng ở vị trí này.","vi":"Tuy nhiên, cũng có một vài rủi ro."},{"s":"Well, there ___ a few things you can do.","a":"are","o":["are","is","was","be"],"src":"Listening","gp":"Cấu trúc There is / There are — giới thiệu sự tồn tại.","why":"Chọn <b>are</b>: dùng <b>is/was</b> khi danh từ theo sau <b>số ít hoặc không đếm được</b>, <b>are/were</b> khi <b>số nhiều</b>; chọn thì hiện tại hay quá khứ theo ngữ cảnh câu. <b>be</b> (nguyên mẫu) không dùng ở vị trí này.","vi":"À, có vài cách bạn có thể làm."},{"s":"There ___ several types of vegetarian diets.","a":"are","o":["are","is","was","be"],"src":"Reading","gp":"Cấu trúc There is / There are — giới thiệu sự tồn tại.","why":"Chọn <b>are</b>: dùng <b>is/was</b> khi danh từ theo sau <b>
