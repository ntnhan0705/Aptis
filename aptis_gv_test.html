{id:'t9',name:'Đề 9 — Aptis General practice',ext:{d:'2026-11-19',g:16,v:15,wrong:['g7','g10','g11','g13','g16','g17','g19','g20','g22','v1_3','v2_0','v2_1','v2_2','v3_4','v4_0','v4_1','v4_2','v4_3','v4_4']},
notes:[
"Dự đoán có <b>bằng chứng trước mắt</b> (Look at the dark clouds!) → <b>be going to</b>; dự đoán theo ý kiến (I think…) → <i>will</i>.",
"<b>such + a + tính từ + danh từ</b> (such a good time); <b>so + tính từ</b> (so good); <i>a very good time</i> — very đứng sau a.",
"<b>much / far / a lot + so sánh hơn</b> (much older). Không bao giờ <i>more older</i>.",
"Tính từ cực mạnh (boiling, freezing, starving, amazing…) → <b>absolutely</b>, không dùng <i>very</i>.",
"Câu hỏi gián tiếp: động từ thiếu tân ngữ (eat <b>what</b>?) → <b>what</b>; câu hỏi Có/Không → if / whether.",
"<b>can't stand / enjoy / mind / avoid / finish + V-ing</b>; <b>promise / want / decide / hope + to V</b>.",
"Mức độ chắc chắn: <b>must</b> (chắc chắn đúng — You look just like her!) &gt; may / might / could &gt; <b>can't</b> (chắc chắn không).",
"Bị động tiếp diễn: <b>is being + V3</b> (The event is being broadcast today).",
"<b>depend on / rely on / count on</b>; <b>take after</b> = giống; look after = chăm sóc.",
"<b>advice / equipment / information</b> không đếm được — không có <i>a/an</i>.",
"Từ vựng: <b>assist</b> = help (≠ donate = quyên góp); <b>conceal</b> = hide (≠ lie); <b>muddy</b> (sau mưa) ≠ messy; eye-catching <b>logo</b>.",
"Collocation: <b>reduced price</b>, <b>sentimental value</b>, <b>immediate family</b>, <b>white-water rafting</b>, <b>semi-precious jewels</b>. Ô có gạch nối bị cắt chữ → đoán phần còn lại."
],
gram:[
{s:"My best friend, ___ is from Australia, is coming to visit me next week.",vi:"Bạn thân tôi, người đến từ Úc, sẽ đến thăm tôi tuần sau.",o:["who","which","that"],a:"who",why:"Có dấu phẩy + người → <b>who</b> (không dùng <i>that</i>)."},
{s:"We'll go to the beach ___ it rains tomorrow.",vi:"Chúng tôi sẽ đi biển trừ khi ngày mai trời mưa.",o:["but","if","unless"],a:"unless",why:"<b>unless</b> = if … not = trừ khi."},
{s:"When I was a teenager, I ___ have purple hair.",vi:"Hồi tuổi teen tôi từng để tóc tím.",o:["used to","would","was used to"],a:"used to",why:"Trạng thái quá khứ → <b>used to</b>. <i>would</i> không dùng cho trạng thái; <i>was used to</i> = quen với."},
{s:"Person A: I ate too many sweets. Person B: You ___ have done that! Now, you'll have a stomach ache.",vi:"A: Tôi ăn nhiều kẹo quá. B: Lẽ ra bạn không nên làm thế! Giờ thì sẽ bị đau bụng.",o:["couldn't","shouldn't","wouldn't"],a:"shouldn't",why:"<b>shouldn't have + V3</b> = trách việc đã làm."},
{s:"My older sister always gives me ___ advice when I need help.",vi:"Chị gái tôi luôn cho tôi lời khuyên khi tôi cần giúp đỡ.",o:["-","an","the"],a:"-",why:"<i>advice</i> không đếm được → không <i>a/an</i>; nói chung → không <i>the</i>."},
{s:"We spend a lot of time together, ___ we have only known each other for a year.",vi:"Chúng tôi dành nhiều thời gian bên nhau, dù mới quen nhau được một năm.",o:["However","Although","Whereas"],a:"Although",why:"<b>although + mệnh đề</b> nối được sau dấu phẩy. <i>However</i> cần dấu chấm / chấm phẩy; <i>whereas</i> dùng để đối chiếu hai thứ."},
{s:"He ___ the message before he found out the truth.",vi:"Anh ấy đã gửi tin nhắn trước khi biết sự thật.",o:["sent","had sent","was sending"],a:"had sent",why:"Xảy ra <b>trước</b> việc khác trong quá khứ → <b>had + V3</b>."},
{s:"Look at the dark clouds! It ___ rain tomorrow.",vi:"Nhìn mây đen kìa! Mai trời sẽ mưa.",o:["will","will be","is going to"],a:"is going to",why:"Dự đoán có <b>bằng chứng trước mắt</b> → <b>be going to</b>. <i>will</i> = dự đoán theo ý kiến."},
{s:"I am so thirsty! I don't have ___ water in my bottle.",vi:"Tôi khát quá! Chai tôi chẳng còn tí nước nào.",o:["any","some","the"],a:"any",why:"Phủ định + danh từ không đếm được → <b>any</b>."},
{s:"The stranger ___ me that he liked my jacket.",vi:"Người lạ nói với tôi rằng anh ta thích áo khoác của tôi.",o:["said","told","asked"],a:"told",why:"<b>tell + người</b> (told me). <i>say</i> không đi trực tiếp với người (said to me)."},
{s:"We had ___ a good time at the concert.",vi:"Chúng tôi đã có khoảng thời gian rất vui ở buổi hòa nhạc.",o:["so","such","very"],a:"such",why:"<b>such + a + adj + noun</b> (such a good time). <i>very</i> đứng sau a (a very good time); <i>so</i> + adj."},
{s:"My brother is ___ older than his girlfriend.",vi:"Anh tôi lớn tuổi hơn bạn gái nhiều.",o:["more","such","much"],a:"much",why:"<i>older</i> đã là so sánh hơn → nhấn mạnh bằng <b>much</b>. <i>more older</i> sai."},
{s:"We are eating out tonight, ___ we?",vi:"Tối nay mình đi ăn ngoài, đúng không?",o:["don't","doesn't","aren't"],a:"aren't",why:"<i>are eating</i> → câu hỏi đuôi <b>aren't we?</b>"},
{s:"The sun was ___ boiling this afternoon.",vi:"Chiều nay nắng nóng như thiêu.",o:["absolutely","very","really"],a:"absolutely",why:"Tính từ cực mạnh (<i>boiling</i>) → <b>absolutely</b>. <i>very</i> không đi với tính từ cực mạnh. (<i>really</i> cũng dùng được trong thực tế, nhưng đáp án chuẩn là <i>absolutely</i>.)"},
{s:"We ___ buy our tickets before they sell out.",vi:"Chúng ta nên mua vé trước khi hết.",o:["should","can","could"],a:"should",why:"Lời khuyên → <b>should</b>."},
{s:"If I were taller, I ___ be better at basketball.",vi:"Nếu tôi cao hơn thì tôi đã chơi bóng rổ giỏi hơn.",o:["had","would","can"],a:"would",why:"Điều kiện loại 2 → <b>would + V</b>."},
{s:"Jessica asked ___ you would like to eat for dinner.",vi:"Jessica hỏi bạn muốn ăn gì cho bữa tối.",o:["whether","if","what"],a:"what",why:"<i>eat</i> thiếu tân ngữ (ăn <b>cái gì</b>) → <b>what</b>. <i>if / whether</i> chỉ cho câu hỏi Có/Không."},
{s:"I can't stand ___ in long queues.",vi:"Tôi không chịu nổi việc xếp hàng dài.",o:["wait","to wait","waiting"],a:"waiting",why:"<b>can't stand + V-ing</b>."},
{s:"You promised ___ me with my homework.",vi:"Bạn đã hứa giúp tôi làm bài tập.",o:["to help","help","helping"],a:"to help",why:"<b>promise + to V</b>."},
{s:"You ___ be Sonia's sister. You look just like her!",vi:"Chắc chắn bạn là em gái Sonia. Trông bạn giống hệt cô ấy!",o:["must","can","may"],a:"must",why:"Bằng chứng rõ (<i>look just like her</i>) → phỏng đoán chắc chắn <b>must be</b>. <i>may</i> chỉ là 'có thể'."},
{s:"The event ___ broadcasted today in over 50 countries!",vi:"Sự kiện đang được phát sóng hôm nay tại hơn 50 quốc gia!",o:["is","is being","has been"],a:"is being",why:"Đang <b>được</b> phát (bị động, diễn ra hôm nay) → <b>is being + V3</b>."},
{s:"My cousin takes ___ my aunt. They are quite similar.",vi:"Em họ tôi giống dì tôi. Họ khá giống nhau.",o:["after","up","off"],a:"after",why:"<b>take after</b> = giống (người thân)."},
{s:"I can always depend ___ my mother.",vi:"Tôi luôn có thể dựa vào mẹ.",o:["in","on","for"],a:"on",why:"<b>depend on</b> = rely on = count on."},
{s:"I can't make ___ what's written, I need a glasses.",vi:"Tôi không đọc ra được chữ viết gì, tôi cần kính.",o:["up","out","down"],a:"out",why:"<b>make out</b> = đọc ra, nhìn ra."},
{s:"I ___ my eyes aren't as good as they used to.",vi:"Tôi thừa nhận là mắt tôi không còn tốt như trước.",o:["was admitting","am admitting","admit"],a:"admit",why:"<b>I admit (that)…</b> — hiện tại đơn."}

{id:'t10',name:'Đề 10 — Aptis General practice',ext:{d:'2026-11-19',g:20,v:21,wrong:['g3','g10','g15','g19','g20','v2_2','v2_4','v3_2','v4_4']},
notes:[

"Sau <b>so sánh nhất</b> → <b>have (ever) + V3</b>: the most beautiful city I <b>have</b> visited. Chỗ trống ngay trước V3 → phải là <b>have</b>.",

"<b>by + mốc tương lai</b> + bị động → <b>will have been + V3</b> (will have been sold by December).",

{s:"In those old days, my father ___ never eat dinner after eight o'clock.",vi:"Hồi đó bố tôi không bao giờ ăn tối sau tám giờ.",o:["would","will","used to"],a:"would",why:"<b>would never eat</b> = thói quen lặp lại trong quá khứ. <i>used to never eat</i> sai trật tự."},

{s:"I'm ___ happy with my new car. It's brilliant!",vi:"Tôi rất hài lòng với chiếc xe mới. Nó tuyệt vời!",o:["so","quite","a bit"],a:"so",why:"<b>so + tính từ</b> = rất; <i>It's brilliant!</i> → mạnh, nên không dùng quite / a bit."},

{s:"Why ___ you apply for the job, you've got the experience.",vi:"Sao bạn không nộp đơn xin việc đó, bạn có kinh nghiệm mà.",o:["are","don't","not"],a:"don't",why:"<b>Why don't you + V?</b> = gợi ý, khuyên."},
{s:"I ___ London but it's expensive.",vi:"Tôi thích London nhưng nó đắt đỏ.",o:["likes","like","liking"],a:"like",why:"<i>I</i> + V nguyên mẫu (hiện tại đơn)."},

{s:"San Francisco is the most beautiful city I ___ visited.",vi:"San Francisco là thành phố đẹp nhất tôi từng đến.",o:["ever","have","had"],a:"have",why:"Sau <b>so sánh nhất</b> → <b>have (ever) + V3</b>. Chỗ trống ngay trước <i>visited</i> → bắt buộc <b>have</b>; chỉ <i>ever</i> thì thiếu trợ động từ."},
{s:"I'm sorry to let you ___, but I can't come to your party.",vi:"Xin lỗi đã làm bạn thất vọng, nhưng tôi không đến dự tiệc được.",o:["down","on","under"],a:"down",why:"<b>let someone down</b> = làm ai thất vọng."},
{s:"You missed a great party on Saturday night. You ___ have come.",vi:"Bạn bỏ lỡ một bữa tiệc tuyệt vời tối thứ Bảy. Lẽ ra bạn nên đến.",o:["must","ought","should"],a:"should",why:"<b>should have + V3</b> = lẽ ra nên. <i>ought</i> thiếu <i>to</i>; <i>must have</i> = chắc hẳn đã."},
{s:"___ the cold weather, she went swimming.",vi:"Mặc dù trời lạnh, cô ấy vẫn đi bơi.",o:["although","despite","in spite"],a:"despite",why:"<b>despite + danh từ</b>. <i>although</i> + mệnh đề; <i>in spite</i> thiếu <i>of</i>."},
{s:"He had been working for hours when he ___ asleep.",vi:"Anh ấy đã làm việc hàng giờ liền thì ngủ thiếp đi.",o:["Has fallen","falls","fell"],a:"fell",why:"<b>had been V-ing … when</b> + <b>quá khứ đơn</b>: fall – <b>fell</b> – fallen."},
{s:"Before she got married, she ___ go out most evenings.",vi:"Trước khi lấy chồng, tối nào cô ấy cũng hay đi chơi.",o:["should","would","must"],a:"would",why:"Thói quen lặp lại trong quá khứ (<i>most evenings</i>) → <b>would + V</b>."},
{s:"It ___ been snowing heavily, so we decided to go skiing.",vi:"Trời đã (không) có tuyết rơi dày, nên chúng tôi quyết định đi trượt tuyết.",o:["Has n't","hadn't","wouldn't have"],a:"hadn't",why:"Trước <i>decided</i> (quá khứ) → <b>quá khứ hoàn thành tiếp diễn</b>; chỉ <i>hadn't</i> đúng thì. (Về nghĩa lẽ ra là <i>had been snowing</i>, nhưng đề không có lựa chọn này.)"},
{s:"It is expected that two million copies of the novel ___ sold by December.",vi:"Người ta dự kiến đến tháng Mười Hai sẽ bán được hai triệu bản cuốn tiểu thuyết.",o:["Will have been","have been","will have being"],a:"Will have been",why:"<b>by December</b> + sách <b>được</b> bán → <b>tương lai hoàn thành bị động: will have been + V3</b>."},
{s:"If I ___ harder at school, I wouldn't be doing this job now.",vi:"Nếu hồi đi học tôi chăm chỉ hơn thì giờ tôi đã không phải làm công việc này.",o:["Has worked","have worked","had worked"],a:"had worked",why:"Điều kiện hỗn hợp: if + <b>had V3</b> (quá khứ), vế sau <i>wouldn't be … now</i>."},
{s:"The way I see it, you ___ have sold the land then -- prices are higher now.",vi:"Theo tôi thấy, lẽ ra hồi đó bạn không nên bán đất — giờ giá cao hơn rồi.",o:["Mustn't","shouldn't","can't"],a:"shouldn't",why:"<b>shouldn't have + V3</b> = lẽ ra không nên."}
],
voc:[
{h:"Select a word from each drop-down list on the right that has the same or a very similar meaning to each word on the left.",vi:"Từ đồng nghĩa",
 opts:["assume","choose","join","tell","disagree","realise","accept","set free","doubt","finish"],
 items:[{l:"oppose",a:"disagree",vi:"phản đối"},{l:"untie",a:"set free",vi:"cởi trói, thả ra"},{l:"complete",a:"finish",vi:"hoàn thành"},{l:"say",a:"tell",vi:"nói"},{l:"vote",a:"choose",vi:"bầu chọn"}]},
{h:"Complete each definition using a word from the drop-down list.",vi:"Định nghĩa",
 opts:["estimate","observe","cover","refuse","improve","measure","follow","instruct","like","share"],
 items:[{l:"To say no is to",a:"refuse",vi:"từ chối"},{l:"To look at something is to",a:"observe",vi:"quan sát"},{l:"To wrap something is to",a:"cover",vi:"bọc, che phủ"},{l:"To give orders is to",a:"instruct",vi:"ra lệnh, chỉ thị"},{l:"To guess something is to",a:"estimate",vi:"ước tính"}]},
{h:"Complete each sentence using a word from each drop-down list.",vi:"Điền từ vào câu — absolutely + tính từ cực mạnh",
 opts:["catch","organic","vocal","furious","extravagant","secret","calm","ripe","swift","vicious"],
 items:[{l:"I don't buy ___ food because it's expensive and I think it's a waste of money.",a:"organic",vi:"hữu cơ"},{l:"You can collect ___ fruit in the garden.",a:"ripe",vi:"chín"},{l:"The crime was so ___ that even the police were scared of him.",a:"vicious",vi:"tàn bạo (tả tội ác)"},{l:"They'd spent a huge amount of money on the wedding. It was very ___.",a:"extravagant",vi:"xa hoa, phung phí"},{l:"When the player found out he'd lost the point, he was absolutely ___.",a:"furious",vi:"giận điên lên (absolutely + tính từ cực mạnh)"}]},
{h:"Select a word from each drop-down list on the right that has the same or a very similar meaning to each word on the left.",vi:"Từ đồng nghĩa — grant = allow!",
 opts:["expect","tell","collect","allow","match","propose","look","build","function","debate"],
 items:[{l:"Argue",a:"debate",vi:"tranh luận"},{l:"Suggest",a:"propose",vi:"đề xuất"},{l:"Grant",a:"allow",vi:"cho phép (grant permission)"},{l:"Operate",a:"function",vi:"vận hành"},{l:"Inform",a:"tell",vi:"thông báo"}]},
{h:"Select a word from each drop-down list on the right that is most often used with each word on the left.",vi:"Collocation — cụm từ hay đi cùng",
 opts:["artist","magazine","opening","beginnings","coffee","smile","energy","steam","sunshine","row"],
 items:[{l:"Thermal",a:"energy",vi:"thermal energy = nhiệt năng"},{l:"Solo",a:"artist",vi:"solo artist = nghệ sĩ đơn ca"},{l:"Glossy",a:"magazine",vi:"glossy magazine = tạp chí giấy bóng"},{l:"Humble",a:"beginnings",vi:"humble beginnings = khởi đầu khiêm tốn"},{l:"Furious",a:"row",vi:"furious row = trận cãi nhau dữ dội"}]}

]}];

/* ============ bộ chạy đề ============ */
let tv={on:false,ti:0,only:null,done:false};
function tRec(id){ return ((PROG.gvtest||{})[id])||null; }
/* ---- ghi thành tích làm ở web khác (t.ext) vào tiến độ — chỉ ghi 1 lần mỗi đề ---- */
function seedExt(){
  let ch=false; if(!PROG.gvtest)PROG.gvtest={};
  GVTESTS.forEach(t=>{ if(!t.ext)return;
    const e=t.ext, tot=e.g+e.v, r=PROG.gvtest[t.id]||{attempts:0,best:0,last:0,history:[]};
    if(r.ext)return;
    r.ext=true; r.attempts=(r.attempts||0)+1; r.best=Math.max(r.best||0,tot);
    r.history=[{d:e.d,g:e.g,v:e.v,ext:true}].concat(r.history||[]);
    if(r.attempts===1){ r.last=tot; r.lastScore=Math.round(tot/50*100); r.lastDate=e.d+'T12:00:00.000Z'; r.wrong=e.wrong.slice(); }
    PROG.gvtest[t.id]=r; ch=true; });
  if(ch)progSave();
}
/* ---- bảng kết quả tổng hợp ---- */
function resultsHTML(){
  const rows=[]; GVTESTS.forEach(t=>{ const r=tRec(t.id); ((r&&r.history)||[]).forEach((x,k)=>rows.push({t:t,k:k,d:x.d,g:x.g,v:x.v,ext:x.ext})); });
  if(!rows.length) return '<div class="dash-h">📊 Kết quả</div><div class="dash-s">Chưa có lần làm nào.</div>';
  rows.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const n=rows.length, avg=f=>Math.round(rows.reduce((s,x)=>s+f(x),0)/n*10)/10;
  const aT=avg(x=>x.g+x.v), aG=avg(x=>x.g), aV=avg(x=>x.v), best=Math.max(...rows.map(x=>x.g+x.v));
  const first=rows[0], lastR=rows[n-1], delta=(lastR.g+lastR.v)-(first.g+first.v);
  const fmtD=d=>d.slice(8,10)+'/'+d.slice(5,7);
  let tb='<table class="rtab"><tr><th>Đề</th><th>Ngày</th><th>Grammar</th><th>Vocab</th><th>Tổng</th></tr>'
    +rows.map(x=>'<tr><td>'+esc(x.t.name.split(' — ')[0])+(x.ext?' <span class="rext">web khác</span>':'')+'</td><td>'+fmtD(x.d)+'</td><td>'+x.g+'/25</td><td>'+x.v+'/25</td><td><b>'+(x.g+x.v)+'/50</b> · '+Math.round((x.g+x.v)*2)+'%</td></tr>').join('')
    +'<tr class="ravg"><td colspan="2">Trung bình '+n+' lần</td><td>'+aG+'</td><td>'+aV+'</td><td><b>'+aT+'/50</b> · '+Math.round(aT*2)+'%</td></tr></table>';
  // lỗi lặp lại: cùng một câu (theo nội dung) sai ở ≥2 đề / lần
  const cnt={}, seen={}, nk=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  GVTESTS.forEach(t=>{ const r=tRec(t.id); if(!r)return;
    t.gram.forEach((q,i)=>{ const key='G|'+nk(q.s); seen[key]=(seen[key]||0)+1; if((r.wrong||[]).includes('g'+i)){ cnt[key]=(cnt[key]||{n:0,a:q.a,s:q.s}); cnt[key].n++; } });
    t.voc.forEach((v,vi)=>v.items.forEach((it,k)=>{ const key='V|'+nk(it.l)+'|'+nk(it.a); seen[key]=(seen[key]||0)+1; if((r.wrong||[]).includes('v'+vi+'_'+k)){ cnt[key]=(cnt[key]||{n:0,a:it.a,s:it.l}); cnt[key].n++; } }));
  });
  const rep=Object.keys(cnt).filter(k=>cnt[k].n>=2).map(k=>'<li>'+esc(cnt[k].s).replace('___','<b>…</b>')+' → <b>'+esc(cnt[k].a)+'</b> <span class="rext">sai '+cnt[k].n+'/'+seen[k]+' lần gặp</span></li>');
  const weak=aG<aV?'Grammar':aV<aG?'Vocabulary':'';
  return '<div class="dash-h">📊 Kết quả ('+n+' lần làm)</div>'
    +'<div class="tscore"><div><b>'+aT+'</b><span>TB /50 · '+Math.round(aT*2)+'%</span></div><div><b>'+best+'</b><span>cao nhất /50</span></div>'
    +'<div><b>'+(delta>=0?'▲ +':'▼ ')+delta+'</b><span>lần cuối so với lần đầu</span></div></div>'
    +tb
    +'<div class="dash-s" style="margin-top:8px">TB grammar <b>'+aG+'/25</b> · vocab <b>'+aV+'/25</b>'+(weak?' → phần yếu hơn: <b>'+weak+'</b>':'')+'. '
    +'Phần Grammar &amp; Vocabulary không quy ra CEFR riêng; mục tiêu tham khảo nên đạt ≥ 40/50 (80%).</div>'
    +(rep.length?'<div class="dash-h" style="font-size:.95rem;margin-top:12px">🔁 Câu sai lặp lại (gặp lại vẫn sai)</div><ul class="rrep">'+rep.join('')+'</ul>':'');
}
function renderTests(){
  tv.on=false;
  $('gvtest').innerHTML='<div class="dash-s">Giống bài thi thật: <b>25 câu ngữ pháp</b> (1 điểm/câu) + <b>5 nhóm từ vựng</b> × 5 từ (1 điểm/từ) = <b>50 điểm</b>. Làm hết rồi bấm <b>Nộp bài</b> — mỗi câu hiện đáp án, <b>nghĩa tiếng Việt</b> và <b>giải thích</b>.</div>'
    +resultsHTML()
    +'<div class="dash-h" style="margin-top:20px">📝 Danh sách đề</div>'
    +GVTESTS.map((t,i)=>{ const r=tRec(t.id), wrong=r&&r.wrong?r.wrong.length:0;
      return '<div class="gr-block" style="margin-top:14px"><div class="gr-h">'+esc(t.name)+'</div>'
        +'<div class="gr-count">'+(r?'đã làm '+r.attempts+' lần · cao nhất '+r.best+'/50 · gần nhất '+r.last+'/50':'chưa làm trên app')
        +(t.ext?' · lần đầu (web khác): '+(t.ext.g+t.ext.v)+'/50':'')+'</div>'
        +(t.notes?'<details class="gnotes"><summary>📌 Ghi nhớ ('+t.notes.length+')</summary><ul>'+t.notes.map(x=>'<li>'+x+'</li>').join('')+'</ul></details>':'')
        +'<div class="btnrow" style="margin-top:10px"><button class="btn primary" data-ts="'+i+'">▶ Làm cả đề</button>'
        +(wrong?'<button class="btn" data-tw="'+i+'">⚠️ Làm lại '+wrong+' câu sai</button>':'')+'</div></div>'; }).join('');
  document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>startTest(+b.dataset.ts,null));
  document.querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>{ const t=GVTESTS[+b.dataset.tw]; startTest(+b.dataset.tw,new Set(tRec(t.id).wrong)); });
}
function startTest(ti,only){
  tv={on:true,ti:ti,only:only,done:false};
  const t=GVTESTS[ti], keep=k=>!only||only.has(k);
  let h='<div class="qz-top"><span class="qz-mode">'+esc(t.name)+(only?' · câu sai':'')+'</span>'
    +'<span class="qz-prog"><button class="fchip" id="tExit">Thoát</button></span></div><div id="tScore"></div>';
  t.gram.forEach((q,i)=>{ if(!keep('g'+i))return;
    h+='<div class="tq" data-k="g'+i+'"><div class="tq-n">Question '+(i+1)+' of 30 · Grammar</div>'
      +'<div class="tq-s">'+esc(q.s).replace('___','<b>…</b>')+'</div><div class="qz-opts">'
      +q.o.map((o,j)=>'<button class="qz-opt" data-o="'+esc(o)+'"><span class="L">'+'ABC'[j]+'</span>'+esc(o)+'</button>').join('')
      +'</div><div class="tfb"></div></div>'; });
  t.voc.forEach((v,vi)=>{ const its=v.items.map((it,k)=>({it,k})).filter(x=>keep('v'+vi+'_'+x.k)); if(!its.length)return;
    h+='<div class="tq"><div class="tq-n">Question '+(26+vi)+' of 30 · Vocabulary — '+esc(v.vi)+'</div>'
      +'<div class="tq-s" style="font-weight:700;font-size:.92rem">'+esc(v.h)+'</div>'
      +its.map(x=>'<div class="tm-row" data-k="v'+vi+'_'+x.k+'"><div class="tm-l">'+esc(x.it.l).replace('___','<b>…</b>')+'</div>'
        +'<select><option value=""></option>'+v.opts.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select></div>').join('')
      +'</div>'; });
  h+='<div class="tbar"><button class="btn primary" id="tSubmit">Nộp bài</button><span class="gr-count" id="tLeft"></span></div>';
  $('gvtest').innerHTML=h;
  $('tExit').onclick=renderTests;
  const box=$('gvtest');
  box.querySelectorAll('.tq[data-k] .qz-opt').forEach(b=>b.onclick=()=>{ if(tv.done)return;
    b.parentNode.querySelectorAll('.qz-opt').forEach(x=>x.classList.remove('pick')); b.classList.add('pick'); tLeft(); });
  box.querySelectorAll('select').forEach(s=>s.onchange=tLeft);
  $('tSubmit').onclick=submitTest; tLeft();
  window.scrollTo({top:0,behavior:'smooth'});
}
function tLeft(){
  const box=$('gvtest'); let n=0;
  box.querySelectorAll('.tq[data-k]').forEach(q=>{ if(!q.querySelector('.pick'))n++; });
  box.querySelectorAll('.tm-row select').forEach(s=>{ if(!s.value)n++; });
  const el=$('tLeft'); if(el) el.textContent=n?'còn '+n+' chỗ chưa chọn':'đã chọn hết ✓';
}
function submitTest(){
  if(tv.done)return;
  const box=$('gvtest'), t=GVTESTS[tv.ti]; let g=0,gn=0,v=0,vn=0; const wrong=[];
  box.querySelectorAll('.tq[data-k]').forEach(el=>{ const i=+el.dataset.k.slice(1), q=t.gram[i], p=el.querySelector('.pick'), ok=!!p&&p.dataset.o===q.a;
    gn++; if(ok)g++; else wrong.push('g'+i);
    el.querySelectorAll('.qz-opt').forEach(b=>{ b.disabled=true; if(b.dataset.o===q.a)b.classList.add('correct'); else if(b===p)b.classList.add('wrong'); });
    el.querySelector('.tfb').innerHTML=(ok?'<div class="qz-fb ok">✓ Đúng</div>':'<div class="qz-fb no">✗ '+(p?'Bạn chọn <b>'+esc(p.dataset.o)+'</b> — ':'Bỏ trống — ')+'đáp án: <span class="ans">'+esc(q.a)+'</span></div>')
      +'<div class="gr-vi">🇻🇳 '+esc(q.vi)+'</div><div class="gr-why">💡 '+q.why+'</div>'; });
  box.querySelectorAll('.tm-row').forEach(el=>{ const m=el.dataset.k.match(/^v(\d+)_(\d+)$/), it=t.voc[+m[1]].items[+m[2]], s=el.querySelector('select'), ok=s.value===it.a;
    vn++; if(ok)v++; else wrong.push(el.dataset.k);
    s.disabled=true; s.classList.add(ok?'ok':'no');
    el.insertAdjacentHTML('beforeend','<div class="tm-fix">'+(ok?'✓ ':'✗ '+(s.value?'bạn chọn <s>'+esc(s.value)+'</s> → ':'bỏ trống → '))
      +'<b>'+esc(it.a)+'</b> — '+esc(it.vi)+'</div>'); });
  tv.done=true;
  const tot=g+v, max=gn+vn;
  if(!tv.only){                                   // chỉ tính điểm khi làm cả đề
    if(!PROG.gvtest)PROG.gvtest={};
    const r=PROG.gvtest[t.id]||{attempts:0,best:0,last:0,history:[]};
    r.attempts++; r.last=tot; r.best=Math.max(r.best||0,tot); r.wrong=wrong;
    r.lastScore=Math.round(tot/max*100); r.lastDate=new Date().toISOString();
    r.history=(r.history||[]).concat([{d:todayStr(),g:g,v:v}]); PROG.gvtest[t.id]=r; progSave();
  } else if(PROG.gvtest&&PROG.gvtest[t.id]){       // làm lại câu sai: câu nào đúng thì gỡ khỏi danh sách sai
    const r=PROG.gvtest[t.id]; r.wrong=(r.wrong||[]).filter(k=>wrong.includes(k)); progSave();
  }
  $('tScore').innerHTML='<div class="tscore"><div><b>'+tot+'/'+max+'</b><span>tổng · '+Math.round(tot/max*100)+'%</span></div>'
    +'<div><b>'+g+'/'+gn+'</b><span>grammar</span></div><div><b>'+v+'/'+vn+'</b><span>vocabulary</span></div></div>'
    +'<div class="dash-s">Đáp án, nghĩa tiếng Việt và giải thích nằm ngay dưới từng câu. Câu sai được lưu lại để bấm <b>⚠️ Làm lại câu sai</b>.</div>';
  $('tSubmit').outerHTML='<button class="btn primary" id="tAgain">Làm lại</button><button class="btn" id="tBack">‹ Về danh sách đề</button>';
  $('tAgain').onclick=()=>startTest(tv.ti,tv.only); $('tBack').onclick=renderTests; $('tLeft').textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
}

setSaveBar(); renderTests();
// ?de=N (từ lộ trình ôn) → mở thẳng Đề N
const DE_Q=+(new URLSearchParams(location.search).get('de')||0);
if(DE_Q>=1&&DE_Q<=GVTESTS.length) startTest(DE_Q-1);
progLoad().then(()=>{ seedExt(); if(!tv.on) renderTests(); });
</script>
