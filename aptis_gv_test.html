<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptis — Đề Grammar & Vocabulary</title>
<style>
  :root{
    --ink:#1b2a2f; --paper:#fbf7ef; --card:#ffffff; --line:#d8cdb8;
    --accent:#c0392b; --accent-soft:#f6e3df;
    --green:#2e7d52; --green-soft:#e3f0e8; --muted:#7a7264;
    --gold:#f0b429; --gold-soft:#fdf0c8; --blue:#2e6fb0; --blue-soft:#e2edf7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.5;}
  .wrap{max-width:700px;margin:0 auto;padding:26px 18px 80px;}
  header.top{border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:14px;}
  .eyebrow{font-family:"SF Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;}
  h1{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.01em;}
  .sub{margin:0;color:var(--muted);font-size:.88rem;}
  .savebar{font-family:"SF Mono",monospace;font-size:.7rem;text-align:center;margin:12px 0;padding:7px 11px;border-radius:9px;background:var(--green-soft);color:#1f7a52;border:1px solid #cfe6d6;}
  .savebar.local{background:var(--gold-soft);color:#8a6d00;border-color:var(--gold);}
  .maintabs{display:flex;gap:8px;margin:0 0 16px;}
  .maintab{flex:1;text-align:center;padding:11px 8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-family:"SF Mono",monospace;font-size:.78rem;color:var(--muted);}
  .maintab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .hide{display:none;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px;}
  /* dashboard */
  .dash-h{font-size:1.05rem;font-weight:800;margin-bottom:4px;}
  .dash-s{font-size:.84rem;color:var(--muted);margin-bottom:14px;}
  .lvbars{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .lvrow{display:flex;align-items:center;gap:10px;font-size:.8rem;}
  .lvrow .nm{width:118px;flex:none;font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);}
  .lvrow .bar{flex:1;height:14px;background:#efe8da;border-radius:99px;overflow:hidden;}
  .lvrow .bar>span{display:block;height:100%;border-radius:99px;}
  .lvrow .n{width:34px;text-align:right;font-weight:700;font-family:"SF Mono",monospace;font-size:.74rem;}
  .b5{background:var(--green);} .b4{background:#5aa77c;} .b3{background:#9dbf6a;}
  .b2{background:var(--gold);} .b1{background:#e2953f;} .b0{background:var(--accent);} .bnew{background:#c3bbaa;}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;}
  .btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 18px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn:hover{opacity:.9;} .btn:disabled{opacity:.45;cursor:default;}
  .lv{font-size:.6rem;font-weight:800;border-radius:99px;padding:2px 7px;white-space:nowrap;}
  .lvnew{background:#eee7d8;color:var(--muted);} .lv0{background:var(--accent-soft);color:var(--accent);}
  .lv1{background:#fbe6cf;color:#a15c00;} .lv2{background:var(--gold-soft);color:#8a6d00;}
  .lv3{background:#eaf2dc;color:#5a7d1e;} .lv4{background:var(--green-soft);color:var(--green);} .lv5{background:var(--green);color:#fff;}
  /* trainer */
  .qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .qz-mode{font-family:"SF Mono",monospace;font-size:.68rem;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:3px 10px;}
  .qz-prog{font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .qz-q{font-family:"SF Mono",monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
  .qz-prompt{font-size:1.4rem;font-weight:800;text-align:center;margin:10px 0 4px;line-height:1.35;}
  .qz-sent{font-size:1.05rem;line-height:1.85;margin:8px 0;}
  .qz-blank{display:inline-block;min-width:92px;border-bottom:2.5px solid var(--accent);color:var(--accent);text-align:center;font-weight:800;}
  .qz-vi{text-align:center;color:var(--muted);font-size:.85rem;margin-top:6px;}
  .qz-play{display:inline-flex;gap:6px;border:none;background:var(--blue);color:#fff;border-radius:10px;padding:10px 18px;cursor:pointer;font:inherit;font-weight:700;font-size:.88rem;margin:4px 0 8px;}
  .qz-opts{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .qz-optrow{display:flex;gap:8px;align-items:stretch;}
  .qz-optrow .qz-opt{flex:1;}
  .qz-optplay{flex:none;border:1.5px solid var(--line);background:var(--blue-soft);color:var(--blue);
    border-radius:10px;width:46px;font-size:1.05rem;cursor:pointer;}
  .qz-optplay:hover{background:var(--blue);color:#fff;}
  .qz-opt{text-align:left;padding:12px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font:inherit;font-size:1rem;color:var(--ink);}
  .qz-opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft);}
  .qz-opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:800;}
  .qz-opt.wrong{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .qz-opt:disabled{cursor:default;}
  .qz-hints{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;}
  .qz-hl{font-size:.78rem;color:var(--muted);font-weight:700;margin-right:2px;}
  .qz-hint{font-size:.95rem;border:1.5px dashed var(--line);border-radius:99px;padding:4px 12px;background:var(--card);user-select:none;}
  .qz-hint.right{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:800;}
  .qz-hint.bad{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);text-decoration:line-through;}
  .qz-inrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .qz-in{flex:1;min-width:170px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:1.05rem;}
  .qz-in.ok{border-color:var(--green);background:var(--green-soft);} .qz-in.no{border-color:var(--accent);background:var(--accent-soft);}
  .qz-fb{margin-top:14px;text-align:center;font-size:1rem;font-weight:700;}
  .qz-fb.ok{color:var(--green);} .qz-fb.no{color:var(--accent);}
  .qz-fb .ans{font-weight:900;text-decoration:underline;}
  .qz-meta{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .qz-next{display:block;margin:16px auto 0;border:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 30px;cursor:pointer;font:inherit;font-weight:800;font-size:.95rem;}
  .qz-hintwrap{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;}
  .fam-box{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);}
  .fam-h{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .fam-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .fam-cell{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:8px;background:var(--card);}
  .fam-cell.fam-empty{opacity:.45;}
  .fam-lbl{font-size:.64rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;}
  .fam-w{font-size:.9rem;font-weight:700;color:var(--ink);}
  .fam-suf{font-size:.7rem;color:var(--muted);}
  @media(max-width:480px){.fam-grid{grid-template-columns:1fr;}}
  /* word list */
  .wl{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
  .wrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);flex-wrap:wrap;}
  .wrow .wen{font-weight:700;font-size:.92rem;min-width:140px;}
  .wrow .wipa{font-family:ui-monospace,monospace;font-size:.76rem;color:var(--muted);flex:1;min-width:110px;}
  .wrow .wvi{font-size:.85rem;color:#4a4438;flex:1;min-width:100px;}
  .wrow .wstat{font-family:"SF Mono",monospace;font-size:.68rem;color:var(--muted);}
  .wpos{font-family:"SF Mono",monospace;font-size:.66rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;white-space:nowrap;}
  .wplay{border:none;background:var(--accent-soft);color:var(--accent);border-radius:8px;width:32px;height:32px;cursor:pointer;}
  .filt{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;}
  .fchip{padding:6px 13px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-family:"SF Mono",monospace;font-size:.7rem;color:var(--muted);}
  .fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  /* grammar */
  .gr-block{margin-bottom:20px;}
  .gr-h{font-size:1.02rem;font-weight:800;margin-bottom:6px;}
  .gr-rule{font-size:.86rem;line-height:1.65;color:#4a4438;background:var(--blue-soft);border:1px solid #cfe0ef;border-radius:9px;padding:10px 13px;margin-bottom:8px;}
  .gr-rule b{color:var(--ink);}
  .gr-eg{font-size:.94rem;line-height:1.7;padding:7px 12px;border-left:2px solid var(--line);margin:5px 0;}
  .gr-eg b{background:var(--gold-soft);border-radius:3px;padding:0 3px;color:#5a4600;}
  .gr-src{display:inline-block;font-family:"SF Mono",monospace;font-size:.58rem;font-weight:700;border-radius:99px;padding:1px 7px;margin-right:7px;vertical-align:middle;}
  .src-Speaking{background:#e9e2f7;color:#5b3fa8;} .src-Writing{background:var(--accent-soft);color:var(--accent);}
  .src-Reading{background:var(--gold-soft);color:#8a6d00;} .src-Listening{background:var(--blue-soft);color:var(--blue);}
  .gr-count{font-family:"SF Mono",monospace;font-size:.62rem;color:var(--muted);}
  .gr-vi{margin-top:10px;font-size:.94rem;line-height:1.6;color:#4a4438;background:var(--paper);
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;text-align:left;}
  .gr-gp{margin-top:8px;font-size:.86rem;line-height:1.6;color:#1d4f7a;background:var(--blue-soft);
    border:1px solid #cfe0ef;border-radius:9px;padding:9px 12px;text-align:left;font-weight:600;}
  .gr-why{margin-top:8px;font-size:.88rem;line-height:1.75;color:#4a4438;background:var(--gold-soft);
    border:1px solid var(--gold);border-radius:9px;padding:10px 13px;text-align:left;}
  .gr-why b{color:#5a4600;}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:26px;}
.gchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:10px 0}
.gchip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.gchip b{font-size:15px}.gchip span{font-size:10.5px;color:var(--muted);font-family:'SF Mono',monospace}
.gchip.done{background:#e3f4ec;border-color:#bfe3cf}.gchip.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(224,83,61,.18)}
.qz-grp{display:inline-block;background:#fbe8e3;color:#b23a26;border-radius:99px;padding:1px 8px;margin-right:4px;font-weight:700}
.qz-letters{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:12px 0 6px}
.ql{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:32px;border-bottom:2px solid var(--ink);font-family:'SF Mono',ui-monospace,monospace;font-size:18px;font-weight:700}
.ql-blank{border-bottom-color:var(--muted)}
input.ql-in{width:28px;min-width:28px;padding:0;border:0;border-bottom:2px solid var(--muted);border-radius:0;background:transparent;text-align:center;color:var(--accent);outline:none;text-transform:lowercase}
input.ql-in:focus{border-bottom-color:var(--accent);background:var(--accent-soft)}
.ql-fix{color:var(--ink)!important}
input.ql-in.ql-fix{color:var(--muted)!important}
input.ql-in.ql-ok{color:var(--green)!important;border-bottom-color:var(--green)}
input.ql-in.ql-bad{color:#fff!important;background:var(--accent);border-bottom-color:var(--accent)}
.qz-letters.shake{animation:qlshake .3s}
@keyframes qlshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ql-gap{display:inline-block;width:14px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pchip{font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px}
.pchip em{font-style:normal;font-size:10px;font-weight:700;color:var(--muted);margin-left:5px}
.pchip i{font-style:normal;font-size:10px;font-weight:700;color:var(--accent);margin-left:5px;text-transform:uppercase}
.pchip.done{background:#e3f4ec;border-color:#bfe3cf;text-decoration:line-through;color:var(--muted)}
.desel{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff}
.wsrc{font-family:'SF Mono',ui-monospace,monospace;font-size:10.5px;color:var(--muted);margin-left:6px}
/* đề Grammar & Vocabulary */
.tq{border-top:1px solid var(--line);padding:16px 0 6px}
.tq-n{font-family:"SF Mono",ui-monospace,monospace;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.tq-s{font-size:1rem;line-height:1.6;margin-bottom:4px}
.tq .qz-opts{margin-top:10px;gap:6px}
.tq .qz-opt{padding:10px 14px;display:flex;gap:12px;align-items:center}
.tq .qz-opt .L{font-family:"SF Mono",ui-monospace,monospace;font-weight:700;color:var(--muted);width:14px}
.tq .qz-opt.pick{border-color:var(--ink);background:#eceaf6}
.tq .qz-fb{text-align:left}
.tm-row{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.tm-row:last-child{border-bottom:0}
.tm-l{font-size:.95rem;line-height:1.5}
.tm-row select{width:100%;padding:8px 9px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:.92rem;background:#fff;color:var(--ink)}
.tm-row select.ok{border-color:var(--green);background:var(--green-soft)}
.tm-row select.no{border-color:var(--accent);background:var(--accent-soft)}
.tm-fix{grid-column:1/-1;font-size:.86rem;line-height:1.55;color:#4a4438;padding:0 0 4px}
.tm-fix b{color:var(--green)}
.tscore{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.tscore div{flex:1;min-width:110px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;text-align:center}
.tscore b{display:block;font-size:1.5rem}
.tscore span{font-family:"SF Mono",ui-monospace,monospace;font-size:10.5px;color:var(--muted)}
.tbar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--line);margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.home{font-family:"SF Mono",monospace;font-size:.72rem;color:var(--muted);text-decoration:none}
@media (max-width:520px){.tm-row{grid-template-columns:1fr}}
.rtab{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:10px}
.rtab th,.rtab td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.rtab th{font-family:"SF Mono",ui-monospace,monospace;font-size:10.5px;color:var(--muted);font-weight:700}
.rtab .ravg td{background:var(--paper);font-weight:700}
.rext{font-family:"SF Mono",ui-monospace,monospace;font-size:10px;color:var(--muted)}
.rrep{margin:6px 0 0;padding-left:18px;font-size:.9rem;line-height:1.7}
.gnotes{margin-top:10px;font-size:.92rem}.gnotes summary{cursor:pointer;font-weight:600}.gnotes ul{margin:8px 0 0;padding-left:20px}.gnotes li{margin:4px 0;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="index.html">‹ Trang chủ</a>
  <header class="top">
    <p class="eyebrow">Aptis General</p>
    <h1>Đề Grammar &amp; Vocabulary</h1>
    <p class="sub">Làm đề như thi thật · 30 câu / 50 điểm · có đáp án, dịch và giải thích tiếng Việt</p>
  </header>

  <div class="savebar" id="savebar">Đang kiểm tra chế độ lưu…</div>

  <div class="card" id="gvtest"></div>

  <footer>Tiến độ lưu chung ở <b>aptis_progress.json</b> · mục <b>gvtest</b></footer>
</div>

<script>
/* ===== Đồng bộ đám mây — mã đồng bộ = ID blob (jsonblob). Dùng chung mọi app. ===== */
window.ACLOUD=window.ACLOUD||(function(){
  var API='/progress',CK='aptis_sync_code',t=null;
  function code(){try{return localStorage.getItem(CK)||'';}catch(e){return'';}}
  function setCode(c){try{localStorage.setItem(CK,c||'');}catch(e){}}
  function clear(){try{localStorage.removeItem(CK);}catch(e){}}
  function on(){return !!code();}
  function isMap(x){return x&&typeof x==='object'&&!Array.isArray(x);}
  function score(r){if(!isMap(r))return 0;return (r.attempts||0)*1000+(r.seen||0)*10+(r.correct||0)+((r.history&&r.history.length)||0);}
  function mm(a,b){a=isMap(a)?a:{};b=isMap(b)?b:{};var o={},ks={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ks[k]=1;});
    Object.keys(ks).forEach(function(k){var av=a[k],bv=b[k];
      if(av===undefined){o[k]=bv;return;}if(bv===undefined){o[k]=av;return;}
      if(isMap(av)&&isMap(bv)&&!('seen'in av)&&!('attempts'in av)&&!('correct'in av)){o[k]=mm(av,bv);}
      else{o[k]=score(bv)>=score(av)?bv:av;}});return o;}
  function merge(a,b){a=isMap(a)?a:{};b=isMap(b)?b:{};var o={},ks={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ks[k]=1;});
    Object.keys(ks).forEach(function(k){if(k==='updated'){o.updated=((a.updated||'')>(b.updated||''))?a.updated:b.updated;return;}
      var av=a[k],bv=b[k];if(isMap(av)||isMap(bv)){o[k]=mm(av,bv);}else{o[k]=(bv!==undefined?bv:av);}});return o;}
  function u(){return API+'?code='+encodeURIComponent(code());}
  function pull(){if(!code())return Promise.resolve(null);
    return fetch(u(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
  function pushNow(data){if(!code())return Promise.resolve(false);
    return fetch(u(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.ok;}).catch(function(){return false;});}
  function push(data){if(!code())return;clearTimeout(t);t=setTimeout(function(){pushNow(data);},1200);}
  function syncOnLoad(local){if(!code())return Promise.resolve(local);
    return pull().then(function(remote){return remote===null?local:merge(local||{},remote||{});});}
  return {code:code,setCode:setCode,clear:clear,on:on,merge:merge,pull:pull,push:push,pushNow:pushNow,syncOnLoad:syncOnLoad,API:API};
})();
const SERVED = /^https?:$/.test(location.protocol);
let PROG = {};
function lsGet(){ try{ return JSON.parse(localStorage.getItem('aptis_progress')||'{}'); }catch(e){ return {}; } }
async function progLoad(){
  let d={};
  if(SERVED){ try{ const r=await fetch('/api/progress',{cache:'no-store'}); d=await r.json(); }catch(e){ d=lsGet(); } }
  else d=lsGet();
  d=d||{};
  if(ACLOUD.on()){try{const m=await ACLOUD.syncOnLoad(d);if(m){d=m;
    try{localStorage.setItem('aptis_progress',JSON.stringify(d));}catch(e){}
    if(SERVED){try{await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});}catch(e){}}
    ACLOUD.push(d);}}catch(e){}}
  PROG=d||{}; if(!PROG.vocab)PROG.vocab={};
}
let saveT=null;
function progSave(){
  PROG.updated=new Date().toISOString();
  try{ localStorage.setItem('aptis_progress',JSON.stringify(PROG)); }catch(e){}
  if(SERVED){ clearTimeout(saveT); saveT=setTimeout(()=>{

  ACLOUD.push(PROG);
}

{s:"He emphasised in his speech that ___ education he received when younger had been excellent.",vi:"Ông nhấn mạnh trong bài phát biểu rằng nền giáo dục ông nhận được hồi trẻ rất tuyệt vời.",o:["a","an","the"],a:"the",why:"Danh từ đã được <b>xác định</b> bởi mệnh đề phía sau (<i>he received when younger</i> = nền giáo dục cụ thể nào) → dùng <b>the</b>. Ngoài ra <i>education</i> bắt đầu bằng âm phụ âm /e-dʒu/ nên không thể là <i>an</i>."},
{s:"We had ___ a good time at the concert.",vi:"Chúng tôi đã có một khoảng thời gian rất vui ở buổi hòa nhạc.",o:["so","such","very"],a:"such",why:"<b>such a + adj + N</b> (such a good time). <b>so + adj</b> khi không có danh từ (it was so good). <i>very</i> không đứng trước <i>a</i>."},
{s:"The concert was called ___ because the singer was sick.",vi:"Buổi hòa nhạc bị hủy vì ca sĩ bị ốm.",o:["off","on","in"],a:"off",why:"<b>call off</b> = hủy bỏ (cancel). <i>call on</i> = ghé thăm / kêu gọi; <i>call in</i> = gọi đến, triệu tập."},
{s:"My father, ___ is a dentist, told me not to drink sugary drinks.",vi:"Bố tôi, người là nha sĩ, bảo tôi đừng uống đồ uống có đường.",o:["who","which","that"],a:"who",why:"Chỉ <b>người</b> → <b>who</b> (<i>which</i> chỉ vật). Mệnh đề nằm giữa hai dấu phẩy (không xác định) thì <b>không</b> dùng <i>that</i>."},
{s:"My sister ___ the money.",vi:"Chị tôi thừa nhận đã lấy trộm tiền.",o:["admitted","to steal","admitted stealing"],a:"admitted stealing",why:"<b>admit + V-ing</b> = thừa nhận đã làm gì. Câu cần động từ chính nên <i>to steal</i> sai; <i>admitted</i> một mình thiếu nghĩa. Cùng nhóm + V-ing: <b>deny, enjoy, avoid, suggest, mind</b>."},
{s:"If you ___ a decision, I will support you.",vi:"Nếu bạn đưa ra quyết định, tôi sẽ ủng hộ bạn.",o:["make","made","could make"],a:"make",why:"Điều kiện loại 1 (có thật ở tương lai): <b>If + hiện tại đơn, will + V</b>. Thấy <i>will</i> ở vế sau → vế If dùng hiện tại đơn."},
{s:"Coffee ___ to be much cheaper a few years ago.",vi:"Cà phê từng rẻ hơn nhiều vài năm trước.",o:["would","has","used"],a:"used",why:"<b>used to + V</b> = trạng thái/thói quen trong quá khứ, nay không còn. <i>would</i> chỉ dùng cho hành động lặp lại, không dùng cho trạng thái (<i>be</i>). <i>has to be</i> sai thì (có <i>ago</i>)."},
{s:"A: I enjoy working on challenging projects at work. B: So ___ I!",vi:"A: Tôi thích làm các dự án thử thách ở công ty. B: Tôi cũng vậy!",o:["Can","Do","am"],a:"Do",why:"Đồng tình: <b>So + trợ động từ + I</b>. Câu gốc ở hiện tại đơn với động từ thường (<i>enjoy</i>) → <b>So do I</b>. (I am… → So am I · I can… → So can I)"},
{s:"You really should ___ to Barcelona – it's a wonderful city.",vi:"Bạn thật sự nên đến Barcelona – đó là một thành phố tuyệt vời.",o:["go","to go","going"],a:"go",why:"<b>should + V nguyên mẫu</b> (không <i>to</i>, không <i>-ing</i>)."},

{s:"If I hadn't gone out last night, I ___ be so tired now.",vi:"Nếu tối qua tôi không đi chơi, thì bây giờ tôi đã không mệt đến vậy.",o:["won't","wouldn't","hadn't"],a:"wouldn't",why:"Điều kiện <b>hỗn hợp</b>: điều kiện trong quá khứ (If + <b>had V3</b>, last night) → kết quả ở hiện tại (<b>would + V</b>, now)."},
{s:"Jake's car is in the garage. He ___ be home.",vi:"Xe của Jake đang ở trong gara. Chắc chắn anh ấy đang ở nhà.",o:["could","can","must"],a:"must",why:"<b>must</b> = suy luận <b>chắc chắn</b> dựa trên bằng chứng (xe đang ở nhà). <i>could</i> chỉ là có thể; <i>can</i> không dùng để suy đoán khẳng định."},

{s:"I don't really get ___ with my older sister. We always fight.",vi:"Tôi không thật sự hợp với chị gái. Chúng tôi lúc nào cũng cãi nhau.",o:["around","in","along"],a:"along",why:"<b>get along (with sb)</b> = hòa hợp với ai. <i>get around</i> = đi lại / lách (vấn đề); <i>get in</i> = vào trong."},
{s:"The way I see it, you ___ have sold the land then – prices are higher now.",vi:"Theo tôi thấy, lẽ ra lúc đó bạn không nên bán mảnh đất – giờ giá cao hơn rồi.",o:["mustn't","shouldn't","can't"],a:"shouldn't",why:"<b>shouldn't have + V3</b> = lẽ ra không nên (chê trách việc đã làm). <i>can't have + V3</i> = chắc chắn đã không xảy ra. <i>mustn't have</i> không dùng."},
{s:"When I lived in Colombia, I ___ drive to work.",vi:"Khi sống ở Colombia, tôi từng lái xe đi làm.",o:["was","was used to","used to"],a:"used to",why:"<b>used to + V</b> = thói quen trong quá khứ. Bẫy: <i>was used to + V-ing</i> = đã <b>quen với</b> (I was used to driving)."},

{s:"I live ___ Canada.",vi:"Tôi sống ở Canada.",o:["at","on","in"],a:"in",why:"<b>in</b> + quốc gia / thành phố. <i>at</i> + địa chỉ cụ thể; <i>on</i> + tên đường."},
{s:"I ___ London but it's expensive.",vi:"Tôi thích London nhưng ở đó đắt đỏ.",o:["likes","like","liking"],a:"like",why:"Chủ ngữ <b>I</b> + V nguyên mẫu (không thêm -s). <i>like</i> là động từ trạng thái, không chia tiếp diễn."},
{s:"We ___ have caught the early train, as the football match was delayed.",vi:"Lẽ ra chúng tôi không cần bắt chuyến tàu sớm, vì trận bóng bị hoãn.",o:["didn't","needn't","mustn't"],a:"needn't",why:"<b>needn't have + V3</b> = đã làm nhưng <b>hóa ra không cần</b>. <i>didn't have caught</i> sai ngữ pháp."},

gram:[
{s:"She'll call you once she ___ home, don't worry!",vi:"Cô ấy sẽ gọi cho bạn ngay khi về đến nhà, đừng lo!",o:["will get","gets","'s going to get"],a:"gets",why:"Sau từ chỉ thời gian <b>once / when / as soon as / after / before</b> dùng <b>hiện tại đơn</b> dù nói về tương lai. Không dùng <i>will</i> hay <i>going to</i> sau các từ này."},

{s:"He had been working for hours when he ___ asleep.",vi:"Anh ấy đã làm việc hàng giờ liền thì ngủ thiếp đi.",o:["has fallen","falls","fell"],a:"fell",why:"Câu kể chuyện quá khứ (<i>had been working</i>) → hành động xảy ra tiếp theo sau <i>when</i> dùng <b>quá khứ đơn</b>: fall → <b>fell</b> → fallen. Không dùng hiện tại hoàn thành trong câu chuyện quá khứ."},
{s:"John: I love riding bikes. Paul: ___? Me too!",vi:"John: Tôi thích đạp xe. Paul: Thật à? Tôi cũng vậy!",o:["really","right","anyway"],a:"really",why:"<b>Really?</b> = Thật à? — phản ứng ngạc nhiên, quan tâm khi nghe tin. <i>right</i> = đúng không; <i>anyway</i> = dù sao thì (chuyển chủ đề)."},
{s:"They ate their lunch while they ___ coming home from school.",vi:"Họ ăn trưa trong khi đang trên đường đi học về.",o:["were","was","are"],a:"were",why:"Chủ ngữ <b>they</b> → <b>were</b> (quá khứ tiếp diễn: were + V-ing). <i>was</i> chỉ đi với I / he / she / it. <i>are</i> sai thì (ate là quá khứ)."},
{s:"It ___ be meat free, it tastes just like chicken!",vi:"Không thể nào là đồ chay được, nó có vị y hệt thịt gà!",o:["could","can","can't"],a:"can't",why:"Suy luận dựa trên bằng chứng: <b>must</b> = chắc chắn đúng, <b>can't</b> = chắc chắn KHÔNG. Vị y hệt gà → chắc chắn không phải đồ chay → <b>can't</b>. <i>could</i> chỉ là \"có thể\", quá yếu."},
{s:"If only I ___ law instead of English when I was at university.",vi:"Giá mà hồi đại học tôi đã học luật thay vì tiếng Anh.",o:["studied","had studied","have studied"],a:"had studied",why:"<b>If only / wish + quá khứ hoàn thành (had V3)</b> = hối tiếc về chuyện đã qua (<i>when I was at university</i>). <i>If only + quá khứ đơn</i> dùng cho hiện tại."},
{s:"William ___ in South America now.",vi:"Hiện giờ William đang sống ở Nam Mỹ.",o:["is living","was living","will live"],a:"is living",why:"<b>now</b> → hiện tại tiếp diễn: tình huống đang diễn ra (tạm thời) ở hiện tại."},
{s:"In those old days, my father ___ never eat dinner after eight o'clock.",vi:"Ngày xưa, bố tôi không bao giờ ăn tối sau 8 giờ.",o:["would","will","used to"],a:"would",why:"<b>would + V</b> = thói quen lặp lại trong quá khứ → <b>would never eat</b>. Bẫy: <i>used to</i> thì <i>never</i> phải đứng TRƯỚC: <i>my father <b>never used to</b> eat</i>, nên <i>used to never eat</i> sai trật tự."},
{s:"___ you finish your work?",vi:"Bạn đã làm xong việc chưa?",o:["Did","Have","Are"],a:"Did",why:"Nhìn dạng động từ chính: <i>finish</i> là V nguyên mẫu → <b>Did</b>. <i>Have</i> cần V3 (finished); <i>Are</i> cần V-ing (finishing)."},

{s:"I have lived in Toronto ___ 3 months.",vi:"Tôi đã sống ở Toronto được 3 tháng.",o:["since","for","from"],a:"for",why:"<b>for</b> + khoảng thời gian (3 months). <b>since</b> + mốc thời gian (since May)."},

{s:"My sister ___ the money.",vi:"Chị tôi thừa nhận đã lấy trộm tiền.",o:["admitted","to steal","admitted stealing"],a:"admitted stealing",why:"<b>admit + V-ing</b>. Cùng nhóm + V-ing: deny, enjoy, avoid, suggest, mind."},
{s:"Chris is ___ by Vally this afternoon.",vi:"Chiều nay Chris được Vally cắt tóc cho.",o:["cutting her hair","having her hair cut","going to cut her hair"],a:"having her hair cut",why:"Thể nhờ / thuê người khác làm: <b>have / get + vật + V3</b>. Có <i>by Vally</i> → người khác cắt cho Chris → <b>having her hair cut</b>. Ví dụ: <i>I'm having my car repaired.</i>"},
{s:"We ate dinner and ___ we watched a film.",vi:"Chúng tôi ăn tối rồi sau đó xem phim.",o:["then","since","so"],a:"then",why:"<b>then</b> = sau đó (trình tự). <i>since</i> = vì / kể từ; <i>so</i> = vì vậy (kết quả)."},
{s:"My boss has just ___ to finish the report by the end of the day.",vi:"Sếp vừa bảo tôi phải hoàn thành báo cáo trước cuối ngày.",o:["said me","told me","told about"],a:"told me",why:"<b>tell + người + to V</b> (told me to finish). <b>say</b> không có người đứng ngay sau: ✗ said me → ✓ said <b>to</b> me / said that…"},
{s:"A: I enjoy working on challenging projects at work. B: So ___ I!",vi:"A: Tôi thích làm các dự án thử thách ở công ty. B: Tôi cũng vậy!",o:["Can","Do","am"],a:"Do",why:"<b>So + trợ động từ + I</b>. Câu gốc hiện tại đơn với động từ thường (<i>enjoy</i>) → <b>So do I</b>."},
{s:"She reads every day ___ she isn't serious.",vi:"Cô ấy đọc sách mỗi ngày nhưng không nghiêm túc.",o:["because","but","and"],a:"but",why:"Hai ý <b>trái ngược</b> → <b>but</b>. <i>because</i> = vì (lý do); <i>and</i> = và (bổ sung)."},
{s:"Coffee ___ to be much cheaper a few years ago.",vi:"Cà phê từng rẻ hơn nhiều vài năm trước.",o:["would","have","used"],a:"used",why:"<b>used to + V</b> = trạng thái trong quá khứ, nay không còn. <i>would</i> không dùng cho trạng thái (<i>be</i>). <i>have to be</i> = phải là."},
{s:"Colt ___ to the store yesterday.",vi:"Colt đã đi đến cửa hàng hôm qua.",o:["go","went","gone"],a:"went",why:"<b>yesterday</b> → quá khứ đơn: go → <b>went</b> → gone. <i>gone</i> (V3) chỉ dùng sau <i>have / has / had</i>."},
{s:"A: Do you think you will get the job? B: ___, but I'm not sure.",vi:"A: Bạn nghĩ mình sẽ được nhận không? B: Có lẽ, nhưng tôi không chắc.",o:["Possible","Possibility","Possibly"],a:"Possibly",why:"Cần <b>trạng từ</b> đứng một mình để trả lời = \"có lẽ\" (= maybe). <i>possible</i> là tính từ; <i>possibility</i> là danh từ."},
{s:"My older sister always gives me ___ advice when I need help.",vi:"Chị gái tôi luôn cho tôi lời khuyên khi tôi cần giúp.",o:["– (no article)","an","the"],a:"– (no article)",why:"<b>advice</b> là danh từ <b>không đếm được</b> → không dùng <i>a / an</i>. Muốn đếm: <i>a piece of advice</i>. Tương tự: information, furniture, news."}
],

gram:[
{s:"Jake's car is in the garage. He ___ be home.",vi:"Xe của Jake đang ở trong gara. Chắc chắn anh ấy đang ở nhà.",o:["could","can","must"],a:"must",why:"<b>must</b> = suy luận <b>chắc chắn</b> dựa trên bằng chứng (xe đang ở nhà). <i>could</i> chỉ là có thể; <i>can</i> không dùng để suy đoán khẳng định."},
{s:"If I ___ taller, I would be better at basketball.",vi:"Nếu tôi cao hơn, tôi sẽ chơi bóng rổ giỏi hơn.",o:["am","could","were"],a:"were",why:"Điều kiện loại 2 (trái với hiện tại): <b>If + quá khứ đơn, would + V</b>. Với <i>be</i> dùng <b>were</b> cho mọi ngôi."},
{s:"She ___ that she would be late.",vi:"Cô ấy nói rằng cô ấy sẽ đến muộn.",o:["said","told","asked"],a:"said",why:"<b>say (that) + mệnh đề</b> — không cần người nghe. <i>tell</i> bắt buộc có người: <i>told <b>me</b> that…</i>. <i>asked</i> dùng cho câu hỏi / lời nhờ."},
{s:"I have a boat ___ is blue.",vi:"Tôi có một chiếc thuyền màu xanh.",o:["who","which","whose"],a:"which",why:"Chỉ <b>vật</b> (boat) → <b>which</b>. <i>who</i> chỉ người; <i>whose</i> phải đi kèm danh từ (whose + N)."},
{s:"My city is ___ than New York.",vi:"Thành phố của tôi nhỏ hơn New York.",o:["smaller","smallest","small"],a:"smaller",why:"Có <b>than</b> → so sánh hơn <b>adj-er + than</b>. <i>smallest</i> là so sánh nhất (the smallest)."},
{s:"I would love ___ dinner with you.",vi:"Tôi rất muốn ăn tối cùng bạn.",o:["having","to have","have"],a:"to have",why:"<b>would love / would like + to V</b>. (Khác với <i>love + V-ing</i> khi nói sở thích chung.)"},
{s:"My parents always ___ me vacuum the house.",vi:"Bố mẹ tôi lúc nào cũng bắt tôi hút bụi nhà.",o:["tell","let","make"],a:"make",why:"<b>make + sb + V nguyên mẫu</b> = bắt ai làm gì. <i>tell</i> cần <b>to</b> (tell me <b>to</b> vacuum). <i>let</i> = cho phép — đúng ngữ pháp nhưng sai nghĩa (hút bụi là việc bị bắt làm)."},
{s:"I ___ the magazine by the time a new one arrived in the mail.",vi:"Tôi đã đọc xong cuốn tạp chí trước khi số mới được gửi đến.",o:["had finished","finished","was finishing"],a:"had finished",why:"<b>By the time + quá khứ đơn</b> → việc xảy ra trước dùng quá khứ hoàn thành <b>had + V3</b>."},
{s:"I was out of town! I ___ have committed the crime!",vi:"Tôi đâu có ở thành phố! Tôi không thể nào gây ra vụ án đó được!",o:["couldn't","wouldn't","shouldn't"],a:"couldn't",why:"<b>couldn't have + V3</b> = <b>không thể nào</b> đã làm (có bằng chứng: tôi không ở đó). <i>wouldn't have</i> = đã không làm (do ý muốn/điều kiện); <i>shouldn't have</i> = lẽ ra không nên."},
{s:"Would you like ___ cereal for breakfast?",vi:"Bạn có muốn ăn ngũ cốc cho bữa sáng không?",o:["a","the","-"],a:"-",why:"<b>cereal</b> là danh từ <b>không đếm được</b> → không dùng <i>a</i>. Đang nói chung chung (không phải loại cụ thể đã nhắc) → không dùng <i>the</i>."},
{s:"Colt ___ to the store yesterday.",vi:"Hôm qua Colt đã đi đến cửa hàng.",o:["go","went","gone"],a:"went",why:"Có <b>yesterday</b> → quá khứ đơn: go → <b>went</b> → gone. <i>gone</i> phải đi với <i>has/had</i>."},
{s:"I live ___ Canada.",vi:"Tôi sống ở Canada.",o:["at","on","in"],a:"in",why:"<b>in</b> + quốc gia / thành phố. <i>at</i> + địa chỉ cụ thể; <i>on</i> + tên đường."},
{s:"When I lived in Colombia, I ___ drive to work.",vi:"Khi sống ở Colombia, tôi từng lái xe đi làm.",o:["was","was used to","used to"],a:"used to",why:"<b>used to + V</b> = thói quen trong quá khứ. Bẫy: <i>was used to + V-ing</i> = đã <b>quen với</b> (I was used to driving)."},
{s:"She's your cousin, ___ she?",vi:"Cô ấy là chị họ của bạn, phải không?",o:["isn't","doesn't","wasn't"],a:"isn't",why:"Câu hỏi đuôi: vế trước <i>She's</i> = <b>she is</b> (khẳng định, hiện tại) → đuôi phủ định cùng trợ động từ: <b>isn't she?</b>"},
{s:"I'm lost. ___ you help me, please?",vi:"Tôi bị lạc. Bạn có thể giúp tôi được không?",o:["Should","Could","Shall"],a:"Could",why:"<b>Could you…?</b> = nhờ ai đó lịch sự. <i>Shall I/we…?</i> dùng để đề nghị giúp; <i>Should you</i> không dùng để nhờ."},
{s:"I was hungry, ___ I ate a sandwich.",vi:"Tôi đói, nên tôi đã ăn một cái bánh mì kẹp.",o:["so","and","but"],a:"so",why:"<b>so</b> = vì vậy (nguyên nhân → kết quả). <i>but</i> = nhưng (đối lập); <i>and</i> chỉ nối thêm ý, không thể hiện kết quả."},
{s:"I have lived in Toronto ___ 3 months.",vi:"Tôi đã sống ở Toronto được 3 tháng.",o:["since","for","from"],a:"for",why:"<b>for</b> + khoảng thời gian (3 months). <b>since</b> + mốc thời gian (since May)."},
{s:"He got injured while they ___ soccer.",vi:"Anh ấy bị thương trong lúc họ đang chơi bóng đá.",o:["was playing","were playing","had played"],a:"were playing",why:"<b>while + quá khứ tiếp diễn</b>: hành động <b>đang diễn ra</b> thì bị việc khác xen vào (got injured). Chủ ngữ <i>they</i> → <b>were</b> (không phải was)."},
{s:"If you ___ a decision, I will support you.",vi:"Nếu bạn đưa ra quyết định, tôi sẽ ủng hộ bạn.",o:["make","made","could make"],a:"make",why:"Điều kiện loại 1: <b>If + hiện tại đơn, will + V</b>. Thấy <i>will</i> ở vế sau → vế If dùng hiện tại đơn."},
{s:"I ___ from Moscow, but now I live in New York.",vi:"Tôi đến từ Moscow, nhưng giờ tôi sống ở New York.",o:["am coming","come","was"],a:"come",why:"<b>come from</b> = quê ở đâu — sự thật cố định → hiện tại đơn. <i>I was from</i> nghe như giờ không còn là người Moscow → sai."},
{s:"I don't really get ___ with my older sister. We always fight.",vi:"Tôi không thật sự hợp với chị gái. Chúng tôi lúc nào cũng cãi nhau.",o:["around","in","along"],a:"along",why:"<b>get along (with sb)</b> = hòa hợp với ai. <i>get around</i> = đi lại / lách (vấn đề)."},
{s:"The concert was called ___ because the singer was sick.",vi:"Buổi hòa nhạc bị hủy vì ca sĩ bị ốm.",o:["off","on","in"],a:"off",why:"<b>call off</b> = hủy bỏ (cancel)."},
{s:"If I ___ schools, we wouldn't have met.",vi:"Nếu tôi không chuyển trường, chúng ta đã không gặp nhau.",o:["wasn't changed","didn't change","hadn't changed"],a:"hadn't changed",why:"Điều kiện loại 3 (trái với quá khứ): <b>If + had V3, would have V3</b>. Vế sau <i>wouldn't have met</i> → vế If <b>hadn't changed</b>."},
{s:"You work ___ hard! Take a break or you'll burn out.",vi:"Bạn làm việc quá sức rồi! Nghỉ ngơi đi kẻo kiệt sức.",o:["too","so","very"],a:"too",why:"<b>too + adj/adv</b> = <b>quá mức</b>, dẫn tới hậu quả xấu (burn out). <i>so / very</i> chỉ nhấn mạnh, không mang ý \"quá đà\"."},
{s:"By the end of next week, I ___ my course.",vi:"Đến cuối tuần sau, tôi sẽ hoàn thành xong khóa học.",o:["will finish","will have finished","will be finished"],a:"will have finished",why:"<b>By + mốc tương lai</b> → tương lai hoàn thành <b>will have + V3</b> (xong trước mốc đó). <i>will be finished</i> là bị động — sai vì <i>I</i> tự hoàn thành."}
],

notes:[
"Câu điều kiện: vế <b>if</b> không bao giờ có <i>would</i> (if I <b>hadn't found</b>…). Điều kiện hỗn hợp có <b>now</b> ở vế sau → <b>would + V</b>.",
"<b>once / when / as soon as / after / until</b> nói về tương lai → <b>hiện tại đơn</b> (once she <b>gets</b> home).",
"<b>because + mệnh đề</b>; <b>due to / because of + danh từ</b>.",
"<b>whose + danh từ</b>; danh từ không đếm được (equipment, advice…) + <b>was / is</b>.",
"Từ vựng: <b>không bỏ trống</b> ô nào, và mỗi từ chỉ dùng một lần."
],
gram:[
{s:"My grandfather ___ always tell me about his time in the war.",vi:"Ông tôi hồi đó hay kể cho tôi nghe về thời chiến tranh.",o:["might","would","could"],a:"would",why:"<b>would + V</b> = thói quen lặp lại trong quá khứ (hay làm gì). <i>would</i> không dùng cho trạng thái (✗ would be cheaper → used to be)."},
{s:"The new hospital ___ built by now!",vi:"Bệnh viện mới lẽ ra đến giờ phải được xây xong rồi!",o:["should","should have","should have been"],a:"should have been",why:"<b>by now</b> + việc lẽ ra đã xong → <b>should have + V3</b>. Bệnh viện <b>được</b> xây → bị động: <b>should have been built</b>. <i>should built / should have built</i> sai (thiếu be / sai nghĩa)."},
{s:"The exam was postponed ___ the pandemic.",vi:"Kỳ thi bị hoãn do đại dịch.",o:["as a result","because","due to"],a:"due to",why:"Sau chỗ trống là <b>danh từ</b> (the pandemic) → <b>due to / because of + N</b>. <i>because</i> + mệnh đề (S + V). <i>as a result</i> = kết quả là (đứng đầu câu sau)."},
{s:"If only I ___ more money! Then I could go to the Maldives.",vi:"Giá mà tôi kiếm được nhiều tiền hơn! Thế thì tôi đã có thể đi Maldives.",o:["will earn","earned","earn"],a:"earned",why:"<b>If only / wish + quá khứ đơn</b> = ước điều trái với hiện tại."},
{s:"She'll call you once she ___ home, don't worry!",vi:"Cô ấy sẽ gọi cho bạn ngay khi về đến nhà, đừng lo!",o:["will get","gets","'s going to get"],a:"gets",why:"Sau <b>once / when / as soon as / after / before / until</b> nói về tương lai vẫn dùng <b>hiện tại đơn</b> — không dùng <i>will / going to</i>."},
{s:"I can't make ___ what's written, I need a glasses.",vi:"Tôi không đọc ra được chữ viết gì, tôi cần kính.",o:["up","out","down"],a:"out",why:"<b>make out</b> = nhìn ra, đọc ra (khó thấy). <i>make up</i> = bịa ra / trang điểm / làm lành; <i>make down</i> không có nghĩa này."},
{s:"Chris is ___ by Vally this afternoon.",vi:"Chiều nay Chris được Vally cắt tóc cho.",o:["cutting her hair","having her hair cut","going to cut her hair"],a:"having her hair cut",why:"Thể nhờ người khác làm: <b>have + vật + V3</b>. Có <i>by Vally</i> → người khác cắt cho Chris."},
{s:"We ___ with the final decision.",vi:"Chúng tôi rất đồng ý với quyết định cuối cùng.",o:["much agree","very much agree","agree much"],a:"very much agree",why:"<b>very much</b> đứng <b>trước</b> agree / appreciate để nhấn mạnh. <i>much</i> đơn lẻ không đứng trước động từ ở câu khẳng định; <i>agree much</i> không tự nhiên."},
{s:"He asked where he ___ put the suitcase.",vi:"Anh ấy hỏi nên để va li ở đâu.",o:["should","ought","shall"],a:"should",why:"Câu hỏi tường thuật: <i>\"Where shall I put it?\"</i> → he asked where he <b>should</b> put it. <i>ought</i> phải có <i>to</i>."},
{s:"I don't know where to eat. I'm hopeless ___ making decisions!",vi:"Tôi không biết ăn ở đâu. Tôi dở tệ khoản ra quyết định!",o:["on","in","at"],a:"at",why:"Tính từ chỉ khả năng + <b>at</b>: <b>good at, bad at, hopeless at, brilliant at</b> + V-ing."},
{s:"It's a bit expensive. Would you be prepared ___ the price?",vi:"Hơi đắt. Bạn có sẵn lòng giảm giá không?",o:["lowering","lowered","to lower"],a:"to lower",why:"<b>be prepared + to V</b> = sẵn lòng làm gì."},
{s:"We have my mother staying with us ___ the moment.",vi:"Hiện giờ mẹ tôi đang ở cùng chúng tôi.",o:["in","on","at"],a:"at",why:"<b>at the moment</b> = hiện giờ (cụm cố định). Tương tự: <i>at present, at the same time, at the weekend</i>."},
{s:"My boss has just ___ to finish the report by the end of the day.",vi:"Sếp vừa bảo tôi phải hoàn thành báo cáo trước cuối ngày.",o:["said me","told me","told about"],a:"told me",why:"<b>tell + người + to V</b>. Không bao giờ <i>said me</i> (phải là <i>said to me</i>)."},
{s:"Saul wasn't sure if he ___ the film before.",vi:"Saul không chắc là trước đó anh ấy đã xem bộ phim chưa.",o:["saw","had seen","had been seeing"],a:"had seen",why:"Mốc quá khứ (<i>wasn't sure</i>) + <b>before</b> → việc xảy ra trước đó dùng quá khứ hoàn thành <b>had + V3</b>."},
{s:"They ___ they'd had a great time in New Zealand.",vi:"Họ ước giá mà họ đã có khoảng thời gian tuyệt vời ở New Zealand.",o:["mean","decide","wish"],a:"wish",why:"<b>wish + had V3</b> = tiếc nuối về quá khứ. <i>mean / decide</i> không đi với mệnh đề quá khứ hoàn thành kiểu này."},
{s:"The woman, ___ car was parked outside, is my new neighbor.",vi:"Người phụ nữ có chiếc xe đỗ bên ngoài là hàng xóm mới của tôi.",o:["that","who","whose"],a:"whose",why:"Sau chỗ trống là <b>danh từ</b> (car) và xe <b>của</b> người phụ nữ → <b>whose + N</b>. <i>who</i> phải đi với động từ ngay sau; <i>that</i> không dùng sau dấu phẩy."},
{s:"My sister ___ the money.",vi:"Chị tôi thừa nhận đã lấy trộm tiền.",o:["admitted","to steal","admitted stealing"],a:"admitted stealing",why:"<b>admit + V-ing</b>. Cùng nhóm: deny, enjoy, avoid, suggest, mind."},
{s:"He described ___",vi:"Anh ấy mô tả tình hình cho tôi.",o:["me the situation","the situation to me","the situation me"],a:"the situation to me",why:"<b>describe / explain + vật + to + người</b>. Không nói ✗ <i>describe me…</i>, ✗ <i>explain me…</i>"},
{s:"I don't know what I'd have done if ___",vi:"Tôi không biết mình sẽ làm gì nếu đã không tìm thấy ví.",o:["I wouldn't have found my wallet","I hadn't found my wallet","I wouldn't find my wallet"],a:"I hadn't found my wallet",why:"Điều kiện loại 3: vế chính <i>would have done</i> → vế <b>if</b> dùng <b>had (not) + V3</b>. Vế <i>if</i> không bao giờ có <i>would</i>."},
{s:"The traffic lights turned red and I ___ hard.",vi:"Đèn giao thông chuyển đỏ và tôi phanh gấp.",o:["brake","broke","braked"],a:"braked",why:"<b>brake</b> (phanh) → quá khứ <b>braked</b> (quy tắc). Bẫy: <i>broke</i> là quá khứ của <i>break</i> (làm vỡ)."},
{s:"The book, ___ was very interesting, told the story of a young adventurer.",vi:"Cuốn sách, vốn rất thú vị, kể câu chuyện về một nhà thám hiểm trẻ.",o:["that","which","whom"],a:"which",why:"Chỉ vật, nằm giữa hai dấu phẩy → <b>which</b>. <i>that</i> không dùng sau dấu phẩy; <i>whom</i> chỉ người (tân ngữ)."},
{s:"I ___ my eyes aren't as good as they used to.",vi:"Tôi thừa nhận mắt tôi không còn tốt như trước.",o:["was admitting","am admitting","admit"],a:"admit",why:"<b>admit</b> (thừa nhận) là động từ chỉ quan điểm → hiện tại đơn: <i>I admit (that)…</i>"},
{s:"The ___ broken.",vi:"Thiết bị bị hỏng rồi.",o:["equipments were","equipment was","equipment were"],a:"equipment was",why:"<b>equipment</b> là danh từ <b>không đếm được</b> → không thêm -s, động từ số ít (<b>was</b>). Cùng nhóm: information, advice, furniture, luggage, news."},
{s:"If I hadn't given up studying German, ___ it fluently now.",vi:"Nếu tôi không bỏ học tiếng Đức, thì giờ có lẽ tôi đã nói trôi chảy rồi.",o:["I'd probably speak","I would probably spoken","I had probably spoken"],a:"I'd probably speak",why:"Điều kiện <b>hỗn hợp</b>: quá khứ (<i>hadn't given up</i>) → kết quả <b>bây giờ</b> (<i>now</i>) → <b>would + V</b>. <i>would spoken</i> sai ngữ pháp."},
{s:"Can you tell me the reason ___ you were late for the meeting?",vi:"Bạn có thể cho tôi biết lý do bạn đến họp muộn không?",o:["which","why","all"],a:"why",why:"<b>the reason why</b> + mệnh đề."}
],

notes:[
"Trả lời ngắn đứng một mình / bổ nghĩa cả câu → <b>trạng từ</b> (Possibly). Giữa <i>a</i> và danh từ → <b>tính từ</b> (a <b>direct</b> train, không phải directly).",
"<b>So / Neither + trợ động từ + I</b>: lấy đúng trợ động từ của câu trước — enjoy → <b>So do I</b>; be → So am I; can → So can I.",
"<b>used to + V</b> = đã từng; <b>be/get used to + V-ing</b> = quen với.",
"Sau <b>have / has / had</b> luôn là <b>V3</b>: write – wrote – <b>written</b>; take – took – taken; go – went – gone; see – saw – seen; eat – ate – eaten; break – broke – broken.",
"Có <b>for / since + now</b> → <b>have been + V-ing</b> (I <b>have</b> been reading… for a week).",
"<b>will be + V-ing</b> = đang làm tại một thời điểm trong tương lai (after 8.30 I'll <b>be relaxing</b>; this time tomorrow I'll be flying).",
"<b>watch television / TV</b> = không đếm được: không <i>a</i>, không <i>-s</i>.",
"<b>get rid of</b> — cụm cố định, học nguyên cụm.",
"Từ vựng đồng nghĩa: đề hay cài bẫy <b>collocation</b> (design → <i>department</i>, policy → <i>business</i>). Tự hỏi: thay từ vào câu nghĩa có giữ nguyên không?",
"Làm xong 5 ô → <b>đọc lại từng dòng</b> với từ đã chọn (carpet / cottage bị đảo chỉ vì sơ ý).",
"Ghép đồng nghĩa: <b>chọn từ chắc trước</b>, rồi ghép phần còn lại theo nghĩa (amuse = vui = <b>entertain</b>; anger = giận = <b>annoy</b>).",
"Collocation: <b>adverse effect</b>, <b>vacant property</b>, <b>collaborative effort</b>, <b>unanimous agreement</b>, <b>humble origins</b> (= humble beginnings ở Đề 4)."
],
gram:[
{s:"A: Do you think you will get the job? B: ___, but I'm not sure.",vi:"A: Bạn nghĩ bạn sẽ được nhận việc không? B: Có thể, nhưng tôi không chắc.",o:["Possible","Possibility","Possibly"],a:"Possibly",why:"Câu trả lời ngắn đứng một mình, nghĩa 'có lẽ' → trạng từ <b>possibly</b>. <i>possible</i> là tính từ (cần <i>It's possible</i>), <i>possibility</i> là danh từ."},
{s:"I ___ 25 years old.",vi:"Tôi 25 tuổi.",o:["have","am","an"],a:"am",why:"Nói tuổi dùng <b>be + tuổi</b>: <i>I am 25 years old</i>. Không dùng <i>have</i>."},
{s:"I have ___ English for three years.",vi:"Tôi đã học tiếng Anh được ba năm.",o:["studied","study","studying"],a:"studied",why:"Hiện tại hoàn thành: <b>have + V3</b>; <i>for three years</i> = kéo dài đến nay."},
{s:"A: I enjoy working on challenging projects at work. B: So ___ I!",vi:"A: Tôi thích làm các dự án khó ở công ty. B: Tôi cũng vậy!",o:["am","do","can"],a:"do",why:"Câu trước dùng động từ thường (<i>enjoy</i>) → trợ động từ <b>do</b>: <b>So do I</b>. (be → So am I; can → So can I)."},
{s:"We could cook dinner. ___, we could buy some takeaway food.",vi:"Mình có thể nấu bữa tối. Mặt khác, mình cũng có thể mua đồ ăn mang về.",o:["Therefore","On the other hand","Although"],a:"On the other hand",why:"Đưa ra phương án khác → <b>On the other hand</b> (mặt khác). <i>Therefore</i> = vì vậy; <i>Although</i> phải nối hai mệnh đề trong một câu."},
{s:"You really should ___ to Barcelona — it's a wonderful city.",vi:"Bạn thật sự nên đến Barcelona — đó là một thành phố tuyệt vời.",o:["go","to go","going"],a:"go",why:"Sau động từ khuyết thiếu (<b>should / can / must / will</b>) → <b>V nguyên mẫu không to</b>."},
{s:"You need ___ new shoes, those ones are too old!",vi:"Bạn cần mua giày mới, đôi đó cũ quá rồi!",o:["to buy","buy","buying"],a:"to buy",why:"<b>need + to V</b> = cần làm gì."},
{s:"When I was at school I used ___ a good student.",vi:"Hồi đi học tôi từng là một học sinh giỏi.",o:["to be","be","being"],a:"to be",why:"<b>used to + V</b> = đã từng (bây giờ không còn). Khác <b>be used to + V-ing</b> = quen với việc gì."},
{s:"I've got no plans for the weekend. Maybe ___ visit my parents.",vi:"Cuối tuần tôi chưa có kế hoạch gì. Có lẽ tôi sẽ về thăm bố mẹ.",o:["I","I'm","I'll"],a:"I'll",why:"Quyết định / dự đoán không chắc chắn (<i>Maybe</i>) → <b>will + V</b>. <i>I'm visit</i> sai ngữ pháp; <i>I visit</i> là thói quen."},
{s:"I'm reading a really ___ book on the history of Europe.",vi:"Tôi đang đọc một cuốn sách rất hay về lịch sử châu Âu.",o:["interest","interesting","interested"],a:"interesting",why:"<b>-ing</b> mô tả vật gây ra cảm giác (cuốn sách thú vị); <b>-ed</b> mô tả cảm giác của người (<i>I'm interested in…</i>)."},
{s:"He's about 40, but in this photograph he looks much ___.",vi:"Anh ấy khoảng 40 tuổi, nhưng trong bức ảnh này trông trẻ hơn nhiều.",o:["young","younger","youngest"],a:"younger",why:"<b>much + so sánh hơn</b> = hơn nhiều. So với chính anh ấy ngoài đời → so sánh hơn <i>younger</i>."},
{s:"She has ___ two books.",vi:"Cô ấy đã viết hai cuốn sách.",o:["written","wrote","write"],a:"written",why:"<b>has + V3</b>. write – wrote (V2) – <b>written</b> (V3). <i>wrote</i> là quá khứ đơn, không đi sau <i>has</i>."},
{s:"I don't recommend driving in the morning because there's too ___ traffic.",vi:"Tôi không khuyên lái xe buổi sáng vì có quá nhiều xe cộ.",o:["much","many","most"],a:"much",why:"<i>traffic</i> là danh từ <b>không đếm được</b> → <b>too much</b>. <i>too many</i> + danh từ đếm được số nhiều (<i>too many cars</i>)."},
{s:"I never do my homework ___ I hate studying at home.",vi:"Tôi không bao giờ làm bài tập về nhà vì tôi ghét học ở nhà.",o:["so","because","although"],a:"because",why:"Vế sau là <b>lý do</b> → <b>because</b>. <i>so</i> = kết quả; <i>although</i> = tương phản."},
{s:"They're so different. I ___, there's no way they'll be happy together.",vi:"Họ khác nhau quá. Ý tôi là, không đời nào họ hạnh phúc bên nhau được.",o:["mean","decide","wish"],a:"mean",why:"<b>I mean,</b> = ý tôi là… — cụm văn nói để giải thích thêm ý vừa nói."},
{s:"Because of computers, many people don't watch a lot of ___ now.",vi:"Vì có máy tính, giờ nhiều người không xem TV nhiều nữa.",o:["television","a television","televisions"],a:"television",why:"<b>watch television / TV</b> (xem chương trình) → <b>không đếm được</b>: không <i>a</i>, không <i>-s</i>. Chỉ khi nói cái máy TV mới đếm được (<i>two televisions</i>)."},
{s:"I think, in the future, people ___ live much longer than they do now.",vi:"Tôi nghĩ trong tương lai con người sẽ sống lâu hơn bây giờ nhiều.",o:["ought","will","would"],a:"will",why:"Dự đoán tương lai (<i>I think, in the future</i>) → <b>will + V</b>. <i>ought</i> cần <i>to</i>; <i>would</i> dùng cho giả định."},
{s:"Call me tomorrow after 8.30, because I will just ___ at home.",vi:"Mai gọi tôi sau 8 giờ 30 nhé, vì lúc đó tôi chỉ đang thư giãn ở nhà thôi.",o:["about to relax","have relax","be relaxing"],a:"be relaxing",why:"<b>Tương lai tiếp diễn: will be + V-ing</b> = việc đang diễn ra tại một thời điểm trong tương lai (sau 8h30 mai). <i>will have relax</i> sai (sau <i>have</i> phải là V3)."},
{s:"The doctor says I will ___ much better by the end of the week.",vi:"Bác sĩ nói đến cuối tuần tôi sẽ thấy khỏe hơn nhiều.",o:["to feel","be feeling","have felt"],a:"be feeling",why:"<b>will be feeling better</b> = trạng thái sẽ có vào cuối tuần. <i>will to feel</i> sai (sau will không có <i>to</i>)."},
{s:"___ been reading this book now for a week and it isn't getting any better!",vi:"Tôi đã đọc cuốn sách này cả tuần nay rồi mà nó chẳng hay hơn chút nào!",o:["I have","I'm","I'd"],a:"I have",why:"<b>for a week + now</b> = bắt đầu từ trước và vẫn đang tiếp tục → <b>hiện tại hoàn thành tiếp diễn: have been + V-ing</b>. <i>I'd been</i> là quá khứ hoàn thành, không đi với <i>now</i>."},
{s:"The garden is looking untidy, you need to get rid ___ the weeds.",vi:"Khu vườn trông bừa bộn quá, bạn cần dọn sạch cỏ dại.",o:["from","out","of"],a:"of",why:"Cụm cố định <b>get rid of + N</b> = loại bỏ, vứt bỏ."},
{s:"The next meeting ___ on the sixth of June.",vi:"Cuộc họp tiếp theo sẽ được tổ chức vào ngày 6 tháng 6.",o:["is holding","will be held","holds"],a:"will be held",why:"Cuộc họp <b>được</b> tổ chức → <b>bị động tương lai: will be + V3</b>."},
{s:"___ of China is very interesting.",vi:"Lịch sử Trung Quốc rất thú vị.",o:["A history","History","The history"],a:"The history",why:"Lịch sử được xác định (<i>of China</i>) → <b>the history of…</b>. Nói chung chung thì không mạo từ: <i>History is interesting</i>."},
{s:"You ___ have bought that car. What a waste of money!",vi:"Lẽ ra bạn không nên mua chiếc xe đó. Phí tiền quá!",o:["shouldn't","mustn't","couldn't"],a:"shouldn't",why:"<b>shouldn't have + V3</b> = trách việc đã làm mà lẽ ra không nên làm. <i>couldn't have</i> = không thể nào đã…"},
{s:"This is a ___ train to London. It doesn't stop on the way.",vi:"Đây là chuyến tàu chạy thẳng đến London. Nó không dừng dọc đường.",o:["direction","directly","direct"],a:"direct",why:"Giữa <i>a</i> và danh từ <i>train</i> → <b>tính từ</b>: <b>a direct train</b>. <i>directly</i> là trạng từ (bổ nghĩa động từ: <i>go directly home</i>)."}
],

{id:'t6',name:'Đề 6 — Aptis General practice',ext:{d:'2026-11-19',g:19,v:21,wrong:['g0','g1','g19','g20','g21','g23','v1_4','v4_1','v4_2','v4_3']},
notes:[
"Hai việc trong quá khứ, việc nào xảy ra / kéo dài <b>trước</b> → <b>had (been + V-ing)</b>: They <b>had</b> been waiting… before they realised.",
"Nhìn chữ <b>ngay sau chỗ trống</b>: có <b>to</b> → <b>ought</b> (ought / ought not <b>to</b>); V nguyên mẫu → should / must.",
"Điều kiện loại 3: <b>If + had V3, … would have V3</b>. Động từ chính là <i>have</i> → <b>had had</b> (không phải lỗi lặp).",
"<i>If only / wish</i> + quá khứ đơn = tiếc hiện tại; + <b>had V3</b> = tiếc quá khứ.",
"<b>Câu hỏi gián tiếp không đảo ngữ</b>: He asked if I knew where <b>the bank was</b> (không phải <i>was the bank</i>).",
"<b>make out</b> = nhìn ra, đọc ra (sai 2 lần: Đề 4 và Đề 6!). <i>make up</i> = bịa ra / trang điểm / làm lành.",
"<b>You never know</b> = chưa biết đâu được (có khi lại…).",
"Thì tiếp diễn theo từ khóa: <b>at the moment</b> → am/is/are V-ing; <b>When + quá khứ đơn</b> (bị xen ngang) → was/were V-ing; <b>this time tomorrow</b> → will be V-ing.",
"<b>alter</b> = change (danh từ: alteration).",
"Collocation: <b>bunk bed</b>, <b>cardinal / ordinal number</b>, <b>fountain pen</b>, <b>house arrest</b>, <b>babysitting</b>. Nếu một từ bị chọn 2 lần → chắc chắn có ô sai."
],
gram:[
{s:"They ___ been waiting for ten minutes before they realised they were in the wrong room.",vi:"Họ đã chờ được mười phút rồi mới nhận ra mình vào nhầm phòng.",o:["Have","Were","Had"],a:"Had",why:"Việc chờ kéo dài <b>trước</b> một việc khác trong quá khứ (<i>realised</i>) → <b>quá khứ hoàn thành tiếp diễn: had been + V-ing</b>. <i>have been</i> chỉ dùng khi kéo dài đến hiện tại."},
{s:"I really ___ not to tell you because I promised to keep it a secret.",vi:"Tôi thật sự không nên kể cho bạn vì tôi đã hứa giữ bí mật.",o:["should","must","ought"],a:"ought",why:"Sau chỗ trống có <b>to</b> (<i>not to tell</i>) → chỉ <b>ought</b> đi với <i>to</i>: <b>ought not to + V</b>. <i>should / must</i> không có <i>to</i>."},
{s:"The shops will close soon, so we ___ go immediately.",vi:"Cửa hàng sắp đóng cửa rồi, nên chúng ta phải đi ngay.",o:["ought","must","shall"],a:"must",why:"Sau chỗ trống là V nguyên mẫu (<i>go</i>) → <b>must + V</b> (phải). <i>ought</i> cần <i>to</i>; <i>shall</i> dùng trong câu hỏi đề nghị (<i>Shall we…?</i>)."},
{s:"___ your sister live with you?",vi:"Chị/em gái bạn có sống cùng bạn không?",o:["Do","Does","Don't"],a:"Does",why:"Chủ ngữ ngôi 3 số ít (<i>your sister</i>) + động từ thường → câu hỏi với <b>Does</b>."},
{s:"If I'd passed my school exams ___ to university. ('d = would / had)",vi:"Nếu hồi đó tôi thi đỗ thì tôi đã vào đại học rồi.",o:["I'd have gone","I have gone","I'd go"],a:"I'd have gone",why:"Điều kiện loại 3: <b>If + had V3, would have + V3</b>."},
{s:"We ate dinner and ___ we watched a film.",vi:"Chúng tôi ăn tối rồi sau đó xem phim.",o:["Then","Since","so"],a:"Then",why:"<b>then</b> = sau đó (nối việc theo thứ tự thời gian). <i>since</i> = từ khi / bởi vì; <i>so</i> = vì vậy."},
{s:"We're ___ in a beautiful holiday home at the moment.",vi:"Hiện giờ chúng tôi đang ở trong một ngôi nhà nghỉ dưỡng rất đẹp.",o:["stay","staying","stayed"],a:"staying",why:"<i>at the moment</i> → <b>hiện tại tiếp diễn: are + V-ing</b>."},
{s:"When I got home, Jenny ___ on the telephone.",vi:"Khi tôi về đến nhà, Jenny đang nói chuyện điện thoại.",o:["was speaking","speaking","speak"],a:"was speaking",why:"Hành động <b>đang diễn ra</b> thì việc khác xen vào (<i>got home</i>) → <b>quá khứ tiếp diễn: was + V-ing</b>."},
{s:"Coffee ___ to be much cheaper a few years ago.",vi:"Vài năm trước cà phê rẻ hơn nhiều.",o:["would","have","used"],a:"used",why:"<b>Trạng thái</b> trong quá khứ → <b>used to + V</b>. <i>would</i> chỉ dùng cho hành động lặp lại, không dùng cho trạng thái."},
{s:"I'm not sure about my future. ___ I will start a business.",vi:"Tôi chưa chắc về tương lai. Có lẽ tôi sẽ mở một công ty.",o:["Perhaps","Shall","Might"],a:"Perhaps",why:"Đứng trước <i>I will</i> → cần trạng từ <b>Perhaps</b> (có lẽ). <i>Shall / Might</i> là động từ khuyết thiếu, không đứng trước <i>I will</i>."},
{s:"She didn't ___ the cake.",vi:"Cô ấy đã không ăn cái bánh.",o:["eat","ate","eats"],a:"eat",why:"Sau <b>did / didn't</b> → <b>V nguyên mẫu</b>; thì quá khứ đã nằm ở <i>didn't</i>."},
{s:"If only I ___ law instead of English when I was at university.",vi:"Giá mà hồi đại học tôi học luật thay vì tiếng Anh.",o:["studied","had studied","have studied"],a:"had studied",why:"<b>If only / wish + had V3</b> = tiếc điều trong <b>quá khứ</b> (<i>when I was at university</i>)."},
{s:"I liked him because he ___ always help me with my homework.",vi:"Tôi quý anh ấy vì anh ấy luôn giúp tôi làm bài tập.",o:["should","ought to","would"],a:"would",why:"<b>would + V</b> = thói quen lặp lại trong quá khứ (có <i>always</i>)."},
{s:"Jane broke her leg last Saturday, so she ___ been to school this week.",vi:"Jane bị gãy chân thứ Bảy tuần trước, nên tuần này cô ấy không đi học.",o:["hasn't","isn't","didn't"],a:"hasn't",why:"<i>this week</i> (chưa kết thúc) + <i>been</i> (V3) → <b>hiện tại hoàn thành: hasn't been</b>."},
{s:"Excuse me, ___ you got the time?",vi:"Xin lỗi, bạn có biết mấy giờ rồi không?",o:["have","do","are"],a:"have",why:"<b>Have you got the time?</b> = Mấy giờ rồi? — câu hỏi của <i>have got</i> đảo <i>have</i> lên đầu."},
{s:"I saw Wi Joo this morning and she ___ if/whether you were free tomorrow.",vi:"Sáng nay tôi gặp Wi Joo và cô ấy hỏi mai bạn có rảnh không.",o:["told","asked","said"],a:"asked",why:"Câu hỏi gián tiếp: <b>asked + if/whether</b>. <i>told / said</i> không đi với <i>if</i>."},
{s:"When I go to university, I may ___ history.",vi:"Khi vào đại học, có thể tôi sẽ học lịch sử.",o:["study","to study","studying"],a:"study",why:"Sau <b>may</b> (động từ khuyết thiếu) → <b>V nguyên mẫu không to</b>."},
{s:"It ___ be meat free – it tastes just like chicken!",vi:"Không thể nào là đồ chay được — vị y hệt thịt gà!",o:["could","can","can't"],a:"can't",why:"Phỏng đoán phủ định chắc chắn → <b>can't be</b> (không thể nào là)."},
{s:"If I hadn't gone out last night, I ___ be so tired now.",vi:"Nếu tối qua tôi không đi chơi thì giờ tôi đã không mệt thế này.",o:["Won't","wouldn't","hadn't"],a:"wouldn't",why:"<b>Điều kiện hỗn hợp</b>: vế if quá khứ (<i>had V3</i>), vế sau có <b>now</b> → <b>would + V</b>."},
{s:"If I ___ enough money last year I would have bought this house.",vi:"Nếu năm ngoái tôi có đủ tiền thì tôi đã mua căn nhà này rồi.",o:["have had","had had","would have"],a:"had had",why:"Điều kiện loại 3: vế if = <b>had + V3</b>. V3 của <i>have</i> là <i>had</i> → <b>had had</b>. <i>would have</i> không bao giờ ở vế if."},
{s:"He asked me if I knew where ___.",vi:"Anh ấy hỏi tôi có biết ngân hàng ở đâu không.",o:["was the was the bank","was it the bank","the bank was"],a:"the bank was",why:"<b>Câu hỏi gián tiếp không đảo ngữ</b>: <i>where <b>the bank was</b></i> (S + V như câu khẳng định). Chỉ câu hỏi trực tiếp mới đảo: <i>Where was the bank?</i>"},
{s:"A: I can't believe I lost my ring. B: You ___ know. It might turn up somewhere.",vi:"A: Không tin nổi là tôi làm mất nhẫn. B: Chưa biết đâu được. Có khi nó lại xuất hiện đâu đó.",o:["will never","shouldn't","didn't"],a:"will never",why:"Thành ngữ <b>You never know</b> = chưa biết đâu được. Trong các lựa chọn chỉ <i>will never</i> gần với cụm này; <i>shouldn't / didn't know</i> không hợp nghĩa."},
{s:"___ you finish your work?",vi:"Bạn đã làm xong việc chưa?",o:["Did","Have","Are"],a:"Did",why:"<b>Did + S + V nguyên mẫu</b>. <i>Have</i> cần <i>finished</i>, <i>Are</i> cần <i>finishing</i>."},
{s:"I can't make ___ what's written, I need a glasses.",vi:"Tôi không đọc ra được chữ viết gì, tôi cần kính.",o:["up","out","down"],a:"out",why:"<b>make out</b> = nhìn ra, đọc ra. <i>make up</i> = bịa ra / trang điểm / làm lành. Câu này đã có ở Đề 4."},
{s:"I ___ my eyes aren't as good as they used to.",vi:"Tôi thừa nhận là mắt tôi không còn tốt như trước.",o:["was admitting","am admitting","admit"],a:"admit",why:"<b>I admit (that)…</b> = tôi thừa nhận — lời tuyên bố ngay lúc nói → hiện tại đơn."}
],

{id:'t7',name:'Đề 7 — Aptis General practice',ext:{d:'2026-11-19',g:20,v:18,wrong:['g1','g2','g13','g14','g22','v0_4','v1_0','v2_0','v2_1','v2_2','v4_0','v4_3']},
notes:[
"Mệnh đề quan hệ <b>giữa hai dấu phẩy</b> → không dùng <i>that</i>: người → <b>who</b>, vật → <b>which</b>.",
"Danh từ được xác định bởi mệnh đề phía sau → <b>the</b>: <b>the</b> education he received, <b>the</b> memory of the day I met…",
"Phỏng đoán quá khứ: <b>must have V3</b> = chắc chắn đã; <b>can't have V3</b> = không thể nào đã.",
"Việc <b>đang làm dở</b> (còn muốn làm tiếp) → <b>was V-ing</b>; việc <b>đã xong</b> → V2 / have V3.",
"<b>try on</b> = mặc thử; put on = mặc vào; take off = cởi ra.",
"Câu tường thuật (said / told / asked) → <b>lùi thì</b>: have been → <b>had been</b>; will → would; can → could; am/is → was.",
"Phủ định của used to: <b>didn't use to</b> (không có -d).",
"Từ vựng: <b>mỗi từ chỉ dùng một lần</b> — nếu thấy một từ được chọn 2 lần là chắc chắn có ô sai (exhibit, Đề 7).",
"Đọc lại cả câu với từ đã chọn: walk down a <b>corridor</b> (hành lang); open the <b>wardrobe</b> (tủ quần áo); <b>maintain discipline</b> (giữ kỷ luật).",
"<b>arrive = reach</b>; <b>oppose ≈ challenge</b>.",
"Collocation: <b>abstract painting</b>, <b>athletics club</b>, <b>congested roads</b>, <b>frantic efforts</b>, <b>housework tasks</b>."
],
gram:[
{s:"The woman, ___ sold me those flowers, spent twenty minutes wrapping them.",vi:"Người phụ nữ bán hoa cho tôi đã mất hai mươi phút để gói chúng.",o:["what","that","who"],a:"who",why:"Mệnh đề quan hệ <b>giữa hai dấu phẩy</b> (không xác định) → không dùng <i>that</i>; chỉ người → <b>who</b>. <i>what</i> không dùng sau danh từ."},
{s:"Tom: I've just seen Mark. Lisa: You ___ have seen him. He's on holiday at the moment.",vi:"Tom: Tớ vừa gặp Mark. Lisa: Cậu không thể nào gặp anh ấy được. Anh ấy đang đi nghỉ mà.",o:["can't","shouldn't","couldn't"],a:"can't",why:"Phỏng đoán chắc chắn điều <b>không thể</b> đã xảy ra → <b>can't have + V3</b>. (<i>couldn't have</i> cũng được dùng, nhưng đáp án chuẩn thường là <i>can't</i>.) <i>shouldn't have</i> = lẽ ra không nên — sai nghĩa."},
{s:"He emphasised in his speech that ___ education he received when younger had been excellent.",vi:"Trong bài phát biểu, ông nhấn mạnh rằng nền giáo dục ông nhận được hồi trẻ rất tuyệt vời.",o:["a","an","the"],a:"the",why:"<i>education</i> đã được xác định bởi <i>he received when younger</i> → <b>the</b>."},
{s:"She takes the bus to work ___ day.",vi:"Ngày nào cô ấy cũng đi xe buýt đi làm.",o:["early","many","every"],a:"every",why:"<b>every day</b> = mỗi ngày. <i>many</i> + danh từ số nhiều."},
{s:"I will call you when I ___ home.",vi:"Tôi sẽ gọi cho bạn khi về đến nhà.",o:["get","will get","getting"],a:"get",why:"Sau <b>when / once / as soon as</b> nói về tương lai → <b>hiện tại đơn</b>, không dùng <i>will</i>."},
{s:"We ate dinner and ___ we watched a film.",vi:"Chúng tôi ăn tối rồi sau đó xem phim.",o:["then","since","so"],a:"then",why:"<b>then</b> = sau đó (thứ tự thời gian)."},
{s:"We're ___ in a beautiful holiday home at the moment.",vi:"Hiện giờ chúng tôi đang ở trong một ngôi nhà nghỉ dưỡng rất đẹp.",o:["stay","staying","stayed"],a:"staying",why:"<i>at the moment</i> → <b>are + V-ing</b>."},
{s:"When I got home, Jenny ___ on the telephone.",vi:"Khi tôi về đến nhà, Jenny đang nói chuyện điện thoại.",o:["was speaking","speaking","speak"],a:"was speaking",why:"Đang diễn ra thì bị việc khác xen vào → <b>was + V-ing</b>."},
{s:"Coffee ___ to be much cheaper a few years ago.",vi:"Vài năm trước cà phê rẻ hơn nhiều.",o:["would","has","used"],a:"used",why:"Trạng thái trong quá khứ → <b>used to + V</b>."},
{s:"I'm not sure about my future. ___ I will start a business.",vi:"Tôi chưa chắc về tương lai. Có lẽ tôi sẽ mở một công ty.",o:["Perhaps","Shall","Might"],a:"Perhaps",why:"Trạng từ <b>Perhaps</b> đứng trước <i>I will</i>."},
{s:"They ate their lunch while they ___ coming home from school.",vi:"Họ ăn trưa trong lúc đang đi học về.",o:["were","was","are"],a:"were",why:"<i>they</i> → <b>were</b>; <i>while</i> + quá khứ tiếp diễn."},
{s:"She bought it herself, ___ she?",vi:"Cô ấy tự mua nó, phải không?",o:["hasn't","didn't","shouldn't"],a:"didn't",why:"Câu hỏi đuôi: quá khứ đơn khẳng định (<i>bought</i>) → <b>didn't she?</b>"},
{s:"If the dress ___ been so expensive, she would have bought it.",vi:"Nếu cái váy không đắt như vậy thì cô ấy đã mua rồi.",o:["hadn't","weren't","aren't"],a:"hadn't",why:"Điều kiện loại 3: <b>If + had (not) V3</b> → <i>hadn't been</i>."},
{s:"I ___ a great book this morning — I really want to finish it.",vi:"Sáng nay tôi đang đọc dở một cuốn sách hay — tôi rất muốn đọc cho xong.",o:["was reading","read","have read"],a:"was reading",why:"<i>want to finish it</i> → <b>chưa xong</b> → <b>was reading</b> (đang làm dở). <i>have read</i> = đã đọc xong — mâu thuẫn."},
{s:"Excuse me? Can I try ___ this jacket to make sure it fits?",vi:"Xin lỗi, tôi mặc thử áo khoác này xem có vừa không được không?",o:["under","with","on"],a:"on",why:"<b>try on</b> = mặc thử (quần áo, giày)."},
{s:"I saw Wi Joo this morning and she ___ if you were free tomorrow.",vi:"Sáng nay tôi gặp Wi Joo và cô ấy hỏi mai bạn có rảnh không.",o:["told","asked","said"],a:"asked",why:"Câu hỏi gián tiếp: <b>asked + if</b>."},
{s:"When I go to university, I may ___ history.",vi:"Khi vào đại học, có thể tôi sẽ học lịch sử.",o:["study","to study","studying"],a:"study",why:"Sau <b>may</b> → V nguyên mẫu không to."},
{s:"It ___ be meat free, it tastes just like chicken!",vi:"Không thể nào là đồ chay được — vị y hệt thịt gà!",o:["could","can","can't"],a:"can't",why:"Phỏng đoán phủ định chắc chắn → <b>can't be</b>."},
{s:"It was a dark, moonlit night when the traveler ___.",vi:"Đó là một đêm tối có trăng khi người lữ khách đến nơi.",o:["arrived","was arriving","had arrived"],a:"arrived",why:"Vế đầu tả bối cảnh; sau <i>when</i> là sự việc chính → <b>quá khứ đơn</b>."},
{s:"If I hadn't gone out last night, I ___ be so tired now.",vi:"Nếu tối qua tôi không đi chơi thì giờ tôi đã không mệt thế này.",o:["won't","wouldn't","hadn't"],a:"wouldn't",why:"Điều kiện hỗn hợp, có <b>now</b> → <b>would + V</b>."},
{s:"I ___ like mushrooms, but I can't stop eating them now.",vi:"Trước đây tôi không thích nấm, nhưng giờ thì ăn mãi không dừng được.",o:["wouldn't","didn't use to","couldn't"],a:"didn't use to",why:"Trước không thích, giờ thích → <b>didn't use to</b> (không -d). <i>wouldn't</i> không dùng cho trạng thái (<i>like</i>)."},
{s:"The newspaper China Today ___ published for over 60 years.",vi:"Tờ báo China Today đã được xuất bản hơn 60 năm.",o:["is being","has been","was being"],a:"has been",why:"<i>for over 60 years</i> (đến nay) + bị động → <b>has been + V3</b>."},
{s:"They said they ___ been studying for ages.",vi:"Họ nói rằng họ đã học rất lâu rồi.",o:["will have","are","had"],a:"had",why:"Câu tường thuật (<i>said</i>) → lùi thì: have been → <b>had been</b> studying."},
{s:"My father, ___ is a dentist, told me not to drink sugary drinks.",vi:"Bố tôi, một nha sĩ, dặn tôi đừng uống đồ uống có đường.",o:["who","which","that"],a:"who",why:"Có dấu phẩy → không dùng <i>that</i>; chỉ người → <b>who</b>."},
{s:"___ memory of the day I met the president is very special to me.",vi:"Ký ức về ngày tôi gặp tổng thống rất đặc biệt với tôi.",o:["The","A","An"],a:"The",why:"<i>memory</i> được xác định bởi <i>of the day I met the president</i> → <b>The</b>."}
],

{id:'t8',name:'Đề 8 — Aptis General practice',ext:{d:'2026-11-19',g:20,v:22,wrong:['g9','g14','g18','g19','g23','v0_2','v2_4','v4_3']},
notes:[
"<b>It's + tính từ + for sb + to V</b>: It's right <b>for</b> children <b>to</b> play… (có <i>to V</i> phía sau → <b>for</b>; nếu dùng <i>that</i> thì phải là mệnh đề: that children should play).",
"Hỏi giá: <b>How much does it cost?</b> hoặc <b>How much is it?</b> — không trộn hai cách.",
"Modal + have V3 (quá khứ): <b>needn't have</b> = đã làm nhưng không cần; <b>shouldn't have</b> = lẽ ra không nên; <b>can't have</b> = không thể nào đã.",
"<b>fewer</b> + danh từ đếm được (fewer people); <b>less</b> + không đếm được (less money). <i>lesser</i> không đi với <i>than</i>.",
"Vị trí với <i>never</i>: <b>would never</b> eat ✔ — <b>never used to</b> eat ✔ — <i>used to never eat</i> ✘.",
"<b>at</b> + giờ; <b>turn right / left</b> không cần giới từ; <b>have to + V</b> (should / must không có to).",
"<b>Frankly,</b> đứng đầu câu có dấu phẩy = thẳng thắn mà nói (bình luận cả câu).",
"Từ vựng: đọc lướt hết 10 từ trước khi chọn (start = <b>begin</b>, không phải go).",
"Điền từ vào câu: manh mối nằm sau chỗ trống — <i>always getting into fights</i> → <b>aggressive</b>; <i>explains things clearly</i> → <b>articulate</b>.",
"Collocation: <b>aerobics classes</b>, <b>agriculture minister</b>, <b>aisle seat</b>, <b>apron strings</b>, <b>atom bomb</b>."
],
gram:[
{s:"I had a shower, ___ I went to bed.",vi:"Tôi tắm xong rồi đi ngủ.",o:["During","Then","until"],a:"Then",why:"<b>then</b> = sau đó (thứ tự thời gian). <i>during</i> + danh từ; <i>until</i> = cho đến khi."},
{s:"I just heard they are ___ get married in June.",vi:"Tôi vừa nghe tin họ sẽ cưới vào tháng Sáu.",o:["Going to","Going","Go to"],a:"Going to",why:"Kế hoạch đã định → <b>be going to + V</b>."},
{s:"Excuse me, I'm lost. ___ you help me?",vi:"Xin lỗi, tôi bị lạc. Bạn có thể giúp tôi không?",o:["Shall","Should","Could"],a:"Could",why:"Nhờ giúp lịch sự → <b>Could you…?</b>"},
{s:"___ you like to go out this evening?",vi:"Tối nay bạn có muốn đi chơi không?",o:["Would","Will","Can"],a:"Would",why:"Lời mời → <b>Would you like to…?</b>"},
{s:"I wish it ___ the time of year when I could go on holiday.",vi:"Ước gì bây giờ là thời điểm trong năm tôi được đi nghỉ.",o:["Were","Will be","is"],a:"Were",why:"<b>wish + quá khứ đơn</b> (trái hiện tại); với be thường dùng <b>were</b>."},
{s:"I ___ use to swim much, but now I have my own pool, I swim every day.",vi:"Trước đây tôi không bơi nhiều, nhưng giờ có hồ bơi riêng nên ngày nào tôi cũng bơi.",o:["Didn't","Did","don't"],a:"Didn't",why:"Trước không, giờ có → <b>didn't use to</b>."},
{s:"The children ___ playing football for two hours before it started raining.",vi:"Bọn trẻ đã chơi bóng được hai tiếng trước khi trời bắt đầu mưa.",o:["Had been","Has been","Have been"],a:"Had been",why:"Kéo dài <b>trước</b> một việc quá khứ (<i>before it started raining</i>) → <b>had been + V-ing</b>."},
{s:"I ___ to work when I saw Steve.",vi:"Tôi đang đi làm thì gặp Steve.",o:["Was going","Went","going"],a:"Was going",why:"Đang diễn ra thì việc khác xen vào → <b>was + V-ing</b>."},
{s:"If you were a better cook, you ___ need to eat out all the time.",vi:"Nếu bạn nấu ăn giỏi hơn thì bạn đã không phải ăn ngoài suốt.",o:["Hadn't","Wouldn't","won't"],a:"Wouldn't",why:"Điều kiện loại 2: <i>If + quá khứ đơn</i>, <b>would(n't) + V</b>."},
{s:"I don't think it's right ___ children to play with toy guns.",vi:"Tôi không nghĩ trẻ con chơi súng đồ chơi là đúng.",o:["To","For","that"],a:"For",why:"<b>It's + adj + for + người + to V</b>. Nếu dùng <i>that</i> phải là mệnh đề đầy đủ: <i>that children should play</i>."},
{s:"We could cook dinner. ___, we could buy some take away food.",vi:"Mình có thể nấu bữa tối. Mặt khác, mình cũng có thể mua đồ ăn mang về.",o:["Although","Therefore","On the other hand"],a:"On the other hand",why:"Phương án khác → <b>On the other hand</b>."},
{s:"The film starts ___ half past four.",vi:"Phim bắt đầu lúc bốn rưỡi.",o:["In","On","at"],a:"at",why:"<b>at</b> + giờ; on + ngày; in + tháng / năm."},
{s:"You ___ to do your homework by tomorrow.",vi:"Bạn phải làm xong bài tập trước ngày mai.",o:["Should","Have","must"],a:"Have",why:"Sau chỗ trống có <i>to do</i> → <b>have to + V</b>. <i>should / must</i> không đi với <i>to</i>."},
{s:"He is single. He never ___.",vi:"Anh ấy độc thân. Anh ấy chưa từng lấy vợ.",o:["marries","marrying","married"],a:"married",why:"<b>He never married</b> = chưa từng kết hôn (quá khứ đơn)."},
{s:"How much ___ the train to Santiago cost?",vi:"Vé tàu đi Santiago giá bao nhiêu?",o:["Is","does","do"],a:"does",why:"<i>cost</i> là động từ thường → <b>How much does it cost?</b> Dùng <i>is</i> thì không có <i>cost</i>: <i>How much is the train?</i>"},
{s:"He ___ in Cairo.",vi:"Anh ấy sống ở Cairo.",o:["Lives","Living","live"],a:"Lives",why:"Ngôi 3 số ít, hiện tại đơn → <b>lives</b>."},
{s:"A: I enjoy working on challenging projects at work. B: So ___ I!",vi:"A: Tôi thích làm các dự án khó ở công ty. B: Tôi cũng vậy!",o:["Can","Do","am"],a:"Do",why:"<i>enjoy</i> (động từ thường) → <b>So do I</b>."},
{s:"Go to the end of the street and turn ___ right.",vi:"Đi đến cuối phố rồi rẽ phải.",o:["(-)","on","to"],a:"(-)",why:"<b>turn right / left</b> — không cần giới từ."},
{s:"We ___ have caught the early train, as the football match was delayed.",vi:"Lẽ ra chúng tôi không cần bắt chuyến tàu sớm, vì trận bóng bị hoãn.",o:["Didn't","Needn't","mustn't"],a:"Needn't",why:"<b>needn't have + V3</b> = đã làm nhưng hóa ra không cần."},
{s:"There were ___ than fifty people in the audience last night.",vi:"Tối qua có chưa đến năm mươi khán giả.",o:["Fewer","Lesser","few"],a:"Fewer",why:"<b>fewer than</b> + danh từ đếm được (<i>people</i>). <i>lesser</i> không đi với <i>than</i>; <i>few</i> không phải so sánh hơn."},
{s:"She reads every day ___ she isn't serious.",vi:"Cô ấy đọc mỗi ngày nhưng không nghiêm túc.",o:["Because","But","and"],a:"But",why:"Tương phản → <b>but</b>."},
{s:"William ___ in South America now.",vi:"Hiện giờ William đang sống ở Nam Mỹ.",o:["Is living","Was living","Will live"],a:"Is living",why:"<i>now</i> → hiện tại tiếp diễn (giai đoạn tạm thời)."},
{s:"That man's so unreliable - you can't trust him. ___",vi:"Gã đó thật không đáng tin — bạn không thể tin anh ta. Thẳng thắn mà nói, tôi sẽ không làm việc với anh ta.",o:["I wouldn't work frankly with him.","I wouldn't frankly work with him.","Frankly, I wouldn't work with him."],a:"Frankly, I wouldn't work with him.",why:"<b>Frankly,</b> = thẳng thắn mà nói — bình luận cả câu → đứng <b>đầu câu, có dấu phẩy</b>."},
{s:"In those days, my father ___ never eat dinner after eight o'clock.",vi:"Hồi đó bố tôi không bao giờ ăn tối sau tám giờ.",o:["used to","will","would"],a:"would",why:"<b>would never eat</b> = thói quen lặp lại trong quá khứ. <i>used to never eat</i> sai trật tự (phải là <i>never used to eat</i>)."},
{s:"He ___ finished cooking when we arrived.",vi:"Anh ấy đã nấu xong khi chúng tôi đến.",o:["had","have","has"],a:"had",why:"Xong <b>trước</b> việc khác trong quá khứ → <b>had + V3</b>."}
],
